link: "/rules/simulator/changelog/"
productName: Rules simulator
productLink: "/rules/simulator/"
entries:
  - publish_date: "2024-04-15"
    title: Rules simulator now supports Workers
    description: |-
      Starting today, customers can use Rules simulator to confirm if a request to a specific URL within their zone is routed through a [Workers script](/workers/).

  - publish_date: "2024-03-18"
    title: Rules simulator now supports BYOIP zones
    description: |-
      Customers can now use Rules simulator to simulate HTTP/S requests through their [BYOIP](/byoip/) zones.

  - publish_date: "2024-03-12"
    title: Rules simulator now supports grey-clouded hostnames
    description: |-
      Even if the hostname is [not proxied by Cloudflare](/dns/proxy-status/#dns-only-records), Rules simulator will now return all the configurations that Cloudflare would have applied to the request.
