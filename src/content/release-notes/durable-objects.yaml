link: "/durable-objects/release-notes/"
productName: Durable Objects
productLink: "/durable-objects/"
entries:
  - publish_date: "2026-11-13"
    title: Spending limits for Durable Objects
    description: |-
      You can now set a [Durable Objects spending limit](/durable-objects/platform/spend-management/) or email alerts separately from Workers. Spending limits apply to requests, duration, and storage operations after included usage, but not to stored data charges.
  - publish_date: "2026-11-05"
    title: Automatic retries for Durable Object calls
    description: |-
      The runtime now retries `fetch()` and RPC calls that fail with a retryable error before reaching a Durable Object, and a retry never runs a method twice unless you mark it with `retryable()`. If your code already retries these calls, lower your attempt count or pass `retry: { maxRetries: 0 }` to `get()` or `getByName()`, as described in [Automatic retries](/durable-objects/best-practices/automatic-retries/).
  - publish_date: "2026-10-30"
    title: Durable Objects defer code updates by default
    description: |-
      When you deploy, an active Durable Object can now keep running its current code for up to 5 minutes while it waits to hibernate, giving in-flight work time to finish. Configure the delay with [`code_update_strategy`](/durable-objects/deployments/durable-objects-code-updates/), or pass `--durable-objects-code-update-mode immediate` to apply an update right away.
  - publish_date: "2026-10-01"
    title: Pending I/O keeps Durable Objects active without a connected client
    description: |-
      For Workers with a compatibility date of `2026-10-01` or later, pending I/O such as service binding requests, calls to other Durable Objects, `ctx.waitUntil()` promises, and timers prevents a Durable Object from being [evicted](/durable-objects/concepts/durable-object-lifecycle/) for up to 15 minutes per operation. Duration charges continue during that time, and you can opt in with an earlier compatibility date by using the [`durable_object_io_tasks_prevent_eviction`](/workers/configuration/compatibility-flags/#durable-object-io-tasks-prevent-eviction) flag.
  - publish_date: "2026-08-28"
    title: Durable Objects can use up to ten Dynamic Workers concurrently
    description: |-
      A Durable Object can now have up to ten distinct [Dynamic Workers](/dynamic-workers/platform/limits/) with in-flight requests, up from four. The limit applies across all concurrent requests to the same Durable Object.
  - publish_date: "2026-08-25"
    title: Prevent alarm retries when using `ctx.abort()`
    description: |-
      Pass `{ retryAlarm: false }` to [`ctx.abort()`](/durable-objects/api/state/#abort) to stop an in-progress [alarm](/durable-objects/api/alarms/) from retrying after the Durable Object resets. Existing `ctx.abort()` calls still retry alarms by default.
  - publish_date: "2026-08-20"
    title: Deployments tab for Durable Object namespaces
    description: |-
      Durable Object namespaces now have a read-only **Deployments** tab in the Cloudflare dashboard that shows the backing Worker's active [versions](/workers/versions-and-deployments/#versions), traffic split, and per-version metrics.
  - publish_date: "2026-07-24"
    title: Filter Durable Object logs and traces by instance ID
    description: |-
      [Workers Logs](/workers/observability/logs/workers-logs/) and traces for Durable Object requests now include the object's instance ID, which you can filter with `$workers.durableObjectId`.
  - publish_date: "2026-07-20"
    title: Total SQLite storage chart for Durable Object namespaces
    description: |-
      The Cloudflare dashboard now shows [total SQLite storage](/durable-objects/observability/metrics-and-analytics/) over time for SQLite-backed Durable Object namespaces.
  - publish_date: "2026-07-09"
    title: New Durable Object namespaces must use the SQLite storage backend
    description: |-
      Accounts without an existing key-value backed Durable Object namespace can no longer create new ones and must use the [SQLite storage backend](/durable-objects/best-practices/access-durable-objects-storage/#create-sqlite-backed-durable-object-class) for new classes. Accounts with at least one key-value backed namespace can still create new ones for now.
  - publish_date: "2026-06-30"
    title: Declarative class lifecycle with `exports`
    description: |-
      A new declarative [`exports`](/durable-objects/reference/durable-objects-migrations/) field in your Wrangler configuration file replaces the imperative `migrations` array for creating, deleting, renaming, and transferring Durable Object classes. Each `wrangler deploy` now prints a structured reconciliation report. Existing Workers on `migrations` continue to work unchanged.
  - publish_date: "2026-06-30"
    title: Memory usage metrics for Durable Objects
    description: |-
      The Durable Objects **Metrics** tab now includes a [memory usage](/durable-objects/observability/metrics-and-analytics/#memory-usage) chart with P50, P90, P99, and P999 percentiles.
  - publish_date: "2026-06-26"
    title: New `us` jurisdiction for Durable Objects
    description: |-
      Durable Objects now support a `us` [jurisdiction](/durable-objects/reference/data-location/#restrict-durable-objects-to-a-jurisdiction) that keeps an object's compute and storage within the United States. Workers can still access these Durable Objects from anywhere.
  - publish_date: "2026-06-19"
    title: Outbound connections keep Durable Objects alive
    description: |-
      Active outbound TCP sockets created with [`connect()`](/workers/runtime-apis/tcp-sockets/) and outbound WebSockets now keep a Durable Object alive for up to 15 minutes per connection. Previously, an object could be evicted 70-140 seconds after its last incoming request, even with an outbound connection open.
  - publish_date: "2026-06-19"
    title: "New Asia-Pacific location hints: `apac-ne` and `apac-se`"
    description: |-
      Durable Objects now support the `apac-ne` (Northeast Asia-Pacific) and `apac-se` (Southeast Asia-Pacific) [location hints](/durable-objects/reference/data-location/#provide-a-location-hint) for finer-grained placement than `apac`.
  - publish_date: "2026-06-12"
    title: Filter Durable Objects metrics by object ID or name
    description: |-
      You can now filter Durable Objects [metrics](/durable-objects/observability/metrics-and-analytics/) in the Cloudflare dashboard to a single object by ID or name.
  - publish_date: "2026-03-26"
    title: Access Durable Object jurisdiction with `ctx.id.jurisdiction`
    description: |-
      `ctx.id.jurisdiction` now reports the [jurisdiction](/durable-objects/api/id/#jurisdiction) a Durable Object was created in, such as `"eu"`. It is `undefined` for Durable Objects outside jurisdiction-restricted namespaces.
  - publish_date: "2026-03-15"
    title: Access Durable Object name with `ctx.id.name`
    description: |-
      When a Durable Object is accessed with `idFromName()` or `getByName()`, that name is now available as [`ctx.id.name`](/durable-objects/api/id/#name) inside the object, including in alarm handlers.
  - publish_date: "2026-02-24"
    title: "`deleteAll()` now deletes Durable Object alarms"
    description: |-
      For Workers with a compatibility date of `2026-02-24` or later, [`deleteAll()`](/durable-objects/api/sqlite-storage-api/#deleteall) also deletes the Durable Object's alarm, so a separate `deleteAlarm()` call is no longer needed.
  - publish_date: "2026-01-07"
    title: Billing for SQLite Storage
    description: |-
      Storage billing for SQLite-backed Durable Objects will be enabled in January 2026, with a target date of January 7, 2026 (no earlier). For more details, refer to the [Billing for SQLite Storage](/changelog/post/2025-12-12-durable-objects-sqlite-storage-billing/).
  - publish_date: "2025-10-25"
    description: |-
      - The maximum WebSocket message size limit has been increased from 1 MiB to 32 MiB.
  - publish_date: "2025-10-16"
    title: Durable Objects can access stored data with UI editor
    description: |-
      Durable Objects stored data can be viewed and written using [Data Studio](/durable-objects/observability/data-studio/) on the Cloudflare dashboard. Only Durable Objects using [SQLite storage](/durable-objects/best-practices/access-durable-objects-storage/#create-sqlite-backed-durable-object-class) can use Data Studio.
  - publish_date: "2025-08-21"
    title: Durable Objects stubs can now be directly constructed by name
    description: |-
      A [`DurableObjectStub`](/durable-objects/api/stub) can now be constructed directly with [`DurableObjectNamespace::getByName`](/durable-objects/api/namespace/#getbyname).
  - publish_date: "2025-06-25"
    title: "`@cloudflare/actors` library in beta"
    description: |-
      The [`@cloudflare/actors`](https://github.com/cloudflare/actors) library is now in beta, with an `Actor` class and helpers for SQLite storage, schema migrations, and alarms.
  - publish_date: "2025-05-16"
    title: Durable Objects in Python Workers
    description: |-
      You can now define Durable Objects in [Python Workers](/workers/languages/python/) by extending `DurableObject` from the `workers` module.
  - publish_date: "2025-04-07"
    title: Durable Objects on Workers Free plan
    description: |-
      [SQLite-backed Durable Objects](/durable-objects/get-started/) are now available on the Workers Free plan with these [limits](/durable-objects/platform/pricing/).

  - publish_date: "2025-04-07"
    title: SQLite in Durable Objects GA
    description: |-
      [SQLite-backed Durable Objects](/durable-objects/best-practices/access-durable-objects-storage/#create-sqlite-backed-durable-object-class) and corresponding [Storage API](/durable-objects/api/sqlite-storage-api/) methods like `sql.exec` have moved from beta to general availability. New Durable Object classes should use wrangler configuration for SQLite storage over key-value storage.

      SQLite storage per Durable Object has increased to 10GB for all existing and new objects.

  - publish_date: "2025-02-19"
    description: |-
      SQLite-backed Durable Objects now support `PRAGMA optimize` command, which can improve database query performance. It is recommended to run this command after a schema change (for example, after creating an index). Refer to [`PRAGMA optimize`](/d1/sql-api/sql-statements/#pragma-optimize) for more information.

  - publish_date: "2025-02-11"
    description: |-
      When Durable Objects generate an "internal error" exception in response to certain failures, the exception message may provide a reference ID that customers can include in support communication for easier error identification. For example, an exception with the new message might look like: `internal error; reference = 0123456789abcdefghijklmn`.

  - publish_date: "2024-10-07"
    title: Alarms re-enabled in (beta) SQLite-backed Durable Object classes
    description: |-
      The issue identified with [alarms](/durable-objects/api/alarms/) in [beta Durable Object classes with a SQLite storage backend](/durable-objects/best-practices/access-durable-objects-storage/#sqlite-storage-backend) has been resolved and alarms have been re-enabled.

  - publish_date: "2024-09-27"
    title: Alarms disabled in (beta) SQLite-backed Durable Object classes
    description: |-
      An issue was identified with [alarms](/durable-objects/api/alarms/) in [beta Durable Object classes with a SQLite storage backend](/durable-objects/best-practices/access-durable-objects-storage/#sqlite-storage-backend). Alarms have been temporarily disabled for only SQLite-backed Durable Objects while a fix is implemented. Alarms in Durable Objects with default, key-value storage backend are unaffected and continue to operate.

  - publish_date: "2024-09-26"
    title: (Beta) SQLite storage backend & SQL API available on new Durable Object classes
    description: |-
      The new beta version of Durable Objects is available where each Durable Object has a private, embedded SQLite database. When deploying a new Durable Object class, users can [opt-in to a SQLite storage backend](/durable-objects/best-practices/access-durable-objects-storage/#sqlite-storage-backend) in order to access new [SQL API](/durable-objects/api/sqlite-storage-api/#sql-api) and [point-in-time-recovery API](/durable-objects/api/sqlite-storage-api/#pitr-point-in-time-recovery-api), part of Durable Objects Storage API.

      You cannot enable a SQLite storage backend on an existing, deployed Durable Object class. Automatic migration of deployed classes from their key-value storage backend to SQLite storage backend will be available in the future.

      During the initial beta, Storage API billing is not enabled for Durable Object classes using SQLite storage backend. SQLite-backed Durable Objects will incur [charges for requests and duration](/durable-objects/platform/pricing/#billing-metrics). We plan to enable Storage API billing for Durable Objects using SQLite storage backend in the first half of 2025 after advance notice with the following [pricing](/durable-objects/platform/pricing/#sqlite-storage-backend).

  - publish_date: "2024-09-07"
    title: New error message for overloaded Durable Objects
    description: |-
      Introduced a new overloaded error message for Durable Objects: "Durable Object is overloaded. Too many requests for the same object within a 10 second window."

      This error message does not replace other types of overload messages that you may encounter for your Durable Object, and is only returned at more extreme levels of overload.

  - publish_date: "2024-06-24"
    description: |-
      [Exceptions](/durable-objects/best-practices/error-handling) thrown from Durable Object internal operations and tunneled to the caller may now be populated with a `.retryable: true` property if the exception was likely due to a transient failure, or populated with an `.overloaded: true` property if the exception was due to [overload](/durable-objects/observability/troubleshooting/#durable-object-is-overloaded).

  - publish_date: "2024-04-03"
    title: Durable Objects support for Oceania region
    description: |-
      Durable Objects can reside in Oceania, lowering Durable Objects request latency for eyeball Workers in Oceania locations.

      Refer to [Durable Objects](/durable-objects/reference/data-location/#provide-a-location-hint) to provide location hints to objects.

  - publish_date: "2024-04-01"
    title: Billing reduction for WebSocket messages
    description: |-
      Durable Objects [request billing](/durable-objects/platform/pricing/#billing-metrics) applies a 20:1 ratio for incoming WebSocket messages. For example, 1 million Websocket received messages across connections would be charged as 50,000 Durable Objects requests.

      This is a billing-only calculation and does not impact Durable Objects [metrics and analytics](/durable-objects/observability/metrics-and-analytics/).

  - publish_date: "2024-02-15"
    title: Optional `alarmInfo` parameter for Durable Object Alarms
    description: |-
      Durable Objects [Alarms](/durable-objects/api/alarms/) now have a new `alarmInfo` argument that provides more details about an alarm invocation, including the `retryCount` and `isRetry` to signal if the alarm was retried.
