name: OpenCode
vendor: Anomaly
slug: opencode
icon: opencode
description: "Open-source terminal agent with a rich TUI that works with 75+ LLMs. Made by Anomaly."
capabilities:
  ide: false
  terminal: true
  standalone: true
  cloud: false
  extension: true
  open_source: true
features:
  - 75+ model support
  - Rich terminal TUI
  - Built-in agents (build/plan)
  - LSP integration

primary_type: terminal
pricing_model: byok
pricing_detail: "Free open-source tool; bring your own API key for any supported model provider"
model_flexibility: multi_provider
context_approach: project_memory

quick_start:
  - title: Install OpenCode
    description: 'Install OpenCode. For npm, Homebrew, Bun, Scoop, or Windows options, see the <a href="https://opencode.ai/docs/" target="_blank" rel="noopener noreferrer">OpenCode install guide</a>.'
    command: "curl -fsSL https://opencode.ai/install | bash"
  - title: Install the Cloudflare Skills
    description: Installs the Cloudflare Skills into ~/.config/opencode/skills/.
    command: "npx skills add https://github.com/cloudflare/skills"
  - title: Add the Cloudflare MCP servers
    description: Add MCP servers to .opencode.jsonc in your project.
    command: '{"mcp": {"cloudflare": {"type": "remote", "url": "https://mcp.cloudflare.com/mcp"}, "cloudflare-docs": {"type": "remote", "url": "https://docs.mcp.cloudflare.com/mcp"}}}'
  - title: Launch OpenCode and build
    description: 'Start OpenCode in your project directory and try a prompt — for example, "Create an example hello world app using Cloudflare Workers."'
    command: "opencode"

mcp_config: |
  {
    "mcp": {
      "cloudflare": {
        "type": "remote",
        "url": "https://mcp.cloudflare.com/mcp"
      },
      "cloudflare-docs": {
        "type": "remote",
        "url": "https://docs.mcp.cloudflare.com/mcp"
      },
      "cloudflare-observability": {
        "type": "remote",
        "url": "https://observability.mcp.cloudflare.com/mcp"
      }
    }
  }

skills_plugin_install:
  supported: true
  command: "npx skills add https://github.com/cloudflare/skills"
  note: "Uses the npx skills CLI. Installs Skills only — MCP servers are configured separately."

skills_install:
  command: "npx skills add https://github.com/cloudflare/skills"
  directory: "~/.config/opencode/skills/"
  docs_url: "https://opencode.ai/docs/skills/"

example_prompts:
  - "Create a Cloudflare Workers REST API with TypeScript."
  - "Add a D1 database and write a migration for user accounts."
  - "Set up R2 object storage for file uploads."
  - "Build a Workers AI chatbot with streaming responses."
  - "Deploy this project to Cloudflare Workers."
  - "Add a cron trigger that processes queued messages every 5 minutes."
  - "Create a Durable Object for managing WebSocket connections."
  - "Check my Worker logs for errors and help me debug."

tips:
  - "OpenCode supports 75+ LLMs — you can use Cloudflare Workers AI as the model provider for a fully Cloudflare-native workflow."
  - "The Skills plugin includes a wrangler Skill that teaches OpenCode when to reach for npx wrangler deploy, wrangler d1, and other CLI commands."
  - "Use OpenCode's plan agent (Tab key) to break down complex Workers projects before coding — pair it with <code>/cloudflare:build-agent</code> or <code>/cloudflare:build-mcp</code> slash commands."
  - "The Cloudflare API MCP server uses Code Mode — OpenCode writes JavaScript to reach any of 2,500+ endpoints in ~1,000 tokens."
  - "Cloudflare was one of the first sites to serve agent-friendly Markdown docs natively — OpenCode automatically requests text/markdown on every docs fetch."
  - 'For more information on installing additional MCP servers, or when to use Code Mode versus traditional MCP servers, refer to the <a href="https://github.com/cloudflare/mcp-server-cloudflare" target="_blank" rel="noopener noreferrer">Cloudflare MCP server repository</a>.'

faq:
  - question: "Should I use Skills, the MCP server, Wrangler CLI, or all of them?"
    answer: "All three. Skills provide persistent Cloudflare expertise so OpenCode knows when to reach for Durable Objects vs KV, how to structure a Workers project, and when to call CLI vs API. The Cloudflare API MCP server handles platform operations (DNS, WAF, Zero Trust, R2 buckets). Wrangler handles local dev, deploys, and Workers-specific commands. The bundled `wrangler` Skill teaches OpenCode which to use."
  - question: "How do I connect OpenCode to Cloudflare?"
    answer: "Install the Skills plugin with `npx skills add https://github.com/cloudflare/skills`. The first time OpenCode calls a Cloudflare tool, you'll be redirected to authorize via OAuth and choose permissions."
  - question: "Can I use Workers AI as the model provider in OpenCode?"
    answer: "Yes. OpenCode supports 75+ model providers, including Cloudflare Workers AI. Configure your model in `.opencode.jsonc`."
  - question: "Is OpenCode open source?"
    answer: "Yes. OpenCode is fully open source and available at github.com/anomalyco/opencode."

troubleshooting:
  - issue: "MCP server connection fails"
    solution: 'Verify the MCP configuration in `.opencode.jsonc` uses `"type": "remote"` with the correct URL. Run `opencode mcp list` to check connected servers.'
  - issue: "OpenCode cannot find Wrangler"
    solution: "Install Wrangler globally with `npm install -g wrangler` or ensure `npx` is available in your `PATH`."
  - issue: "Skills are not loading"
    solution: "Verify skills are installed in `~/.config/opencode/skills/`. Re-run `npx skills add https://github.com/cloudflare/skills`."

links:
  skills: "https://github.com/cloudflare/skills"
  mcp_server: "https://github.com/cloudflare/mcp"
  docs: "https://opencode.ai/docs"
  website: "https://opencode.ai"
