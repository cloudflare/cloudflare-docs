name: Codex
vendor: OpenAI
slug: codex
icon: codex
description: "Lightweight open-source terminal agent that reads and writes files, runs commands, and browses the web in a sandbox. Made by OpenAI."
capabilities:
  ide: false
  terminal: true
  standalone: true
  cloud: true
  extension: true
  open_source: true
features:
  - File read/write operations
  - Command execution
  - Web browsing
  - Sandboxed environment

primary_type: terminal
pricing_model: hybrid
pricing_detail: "Open source CLI is free; requires OpenAI API key or ChatGPT Plus/Pro subscription"
model_flexibility: locked
context_approach: session

quick_start:
  - title: Install Codex
    description: 'Install the Codex CLI. macOS and Linux are fully supported; use WSL2 on Windows. For Homebrew or other install methods, see the <a href="https://developers.openai.com/codex/cli/" target="_blank" rel="noopener noreferrer">Codex CLI setup guide</a>.'
    command: "npm install -g @openai/codex"
  - title: Install the Cloudflare Skills
    description: Installs the Cloudflare Skills into ~/.codex/skills/.
    command: "npx skills add https://github.com/cloudflare/skills"
  - title: Add the Cloudflare MCP servers
    description: Register the Cloudflare MCP servers with Codex.
    command: "codex mcp add cloudflare -- npx mcp-remote https://mcp.cloudflare.com/mcp"
  - title: Launch Codex and build
    description: 'Start Codex in your project directory and try a prompt — for example, "Create an example hello world app using Cloudflare Workers."'
    command: "codex"

mcp_config: |
  codex mcp add cloudflare -- npx mcp-remote https://mcp.cloudflare.com/mcp
  codex mcp add cloudflare-docs -- npx mcp-remote https://docs.mcp.cloudflare.com/mcp
  codex mcp add cloudflare-observability -- npx mcp-remote https://observability.mcp.cloudflare.com/mcp

skills_plugin_install:
  supported: true
  command: "npx skills add https://github.com/cloudflare/skills"
  note: "Uses the npx skills CLI. Installs Skills only — MCP servers are configured separately."

skills_install:
  command: "npx skills add https://github.com/cloudflare/skills"
  directory: "~/.codex/skills/"
  docs_url: "https://developers.openai.com/codex/skills/"

example_prompts:
  - "Create a Cloudflare Workers API with CRUD endpoints."
  - "Add a D1 database to this project and set up migrations."
  - "Configure R2 storage for file uploads with pre-signed URLs."
  - "Build a Workers application that uses Workers AI for text generation."
  - "Deploy this application to Cloudflare Workers."
  - "Set up KV namespace for caching API responses."
  - "Add a cron trigger to my Worker that runs every hour."
  - "Check the deployment logs and fix any errors."

tips:
  - "Codex runs in a sandbox — it can safely execute Wrangler commands without touching your host system, and the bundled wrangler Skill guides it on what to run."
  - "The Cloudflare API MCP server uses Code Mode — Codex writes JavaScript against a typed API to reach any of 2,500+ endpoints in ~1,000 tokens."
  - "Codex supports web browsing; pair it with the docs MCP server for the freshest Cloudflare references without leaving the agent loop."
  - "Try the <code>/cloudflare:build-agent</code> slash command to scaffold a complete Agents SDK project, or <code>/cloudflare:build-mcp</code> for a remote MCP server."
  - 'For more information on installing additional MCP servers, or when to use Code Mode versus traditional MCP servers, refer to the <a href="https://github.com/cloudflare/mcp-server-cloudflare" target="_blank" rel="noopener noreferrer">Cloudflare MCP server repository</a>.'

faq:
  - question: "Should I use Skills, the MCP server, Wrangler CLI, or all of them?"
    answer: "All three. Skills load Cloudflare knowledge into every Codex session (when to use Durable Objects, how to structure a Workers project, etc.). The Cloudflare API MCP server handles platform operations (DNS, WAF, Zero Trust). Wrangler handles local dev, deploys, and migrations. The bundled `wrangler` Skill teaches Codex when to run CLI commands vs. call the MCP API."
  - question: "How do I connect Codex to my Cloudflare account?"
    answer: "Install the Skills plugin with `npx skills add https://github.com/cloudflare/skills`. The first time Codex calls a Cloudflare tool, you'll be redirected to authorize via OAuth and choose permissions."
  - question: "Is Codex open source?"
    answer: "Yes. Codex is open source and available on GitHub at github.com/openai/codex."

troubleshooting:
  - issue: "Codex cannot find Wrangler"
    solution: "Ensure Wrangler is installed globally with `npm install -g wrangler` or use `npx wrangler` commands."
  - issue: "MCP server authentication fails"
    solution: "Remove and re-add the MCP server. Complete the OAuth flow in your browser when prompted."
  - issue: "Sandbox restrictions prevent deployment"
    solution: "Codex runs in a sandbox by default. Ensure network access is enabled for Cloudflare API endpoints."

links:
  skills: "https://github.com/cloudflare/skills"
  mcp_server: "https://github.com/cloudflare/mcp"
  docs: "https://developers.openai.com/codex/"
  website: "https://openai.com/codex"
