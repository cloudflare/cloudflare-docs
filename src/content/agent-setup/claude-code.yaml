name: Claude Code
vendor: Anthropic
slug: claude-code
icon: claude
description: "Terminal-based coding agent that understands your codebase, runs commands, edits files, and manages git. Made by Anthropic."
capabilities:
  ide: false
  terminal: true
  standalone: true
  cloud: true
  extension: true
  open_source: false
features:
  - Full codebase understanding
  - Terminal command execution
  - Git operations
  - Multi-file editing

primary_type: terminal
pricing_model: subscription
pricing_detail: "Included with Claude Pro ($20/mo) and Max ($200/mo); API usage billing also available"
model_flexibility: locked
context_approach: project_memory

quick_start:
  - title: Install Claude Code
    description: 'Install the Claude Code CLI. For Windows, Homebrew, WinGet, or npm, see the <a href="https://docs.anthropic.com/en/docs/claude-code/setup" target="_blank" rel="noopener noreferrer">Claude Code setup guide</a>.'
    command: "curl -fsSL https://claude.ai/install.sh | bash"
  - title: Launch Claude Code in your project
    description: Start Claude Code from the root of your project, where wrangler.jsonc lives (if it already exists).
    command: "claude"
  - title: Install the Cloudflare Skills plugin
    description: In Claude Code, run these two slash commands. The plugin installs all 8 Cloudflare Skills and additionally registers the Cloudflare API, docs, bindings, builds, and observability MCP servers.
    command: "/plugin marketplace add cloudflare/skills\n/plugin install cloudflare@cloudflare"
  - title: Try a prompt
    description: 'For example, "Create an example hello world app using Cloudflare Workers."'

mcp_config: |
  claude mcp add cloudflare -- npx mcp-remote https://mcp.cloudflare.com/mcp
  claude mcp add cloudflare-docs -- npx mcp-remote https://docs.mcp.cloudflare.com/mcp
  claude mcp add cloudflare-observability -- npx mcp-remote https://observability.mcp.cloudflare.com/mcp
  claude mcp add cloudflare-bindings -- npx mcp-remote https://bindings.mcp.cloudflare.com/mcp

skills_plugin_install:
  supported: true
  command: "/plugin marketplace add cloudflare/skills\n/plugin install cloudflare@cloudflare"
  note: "Install via the Claude Code plugin marketplace. Bundles Skills + MCP servers."

skills_install:
  command: "/plugin marketplace add cloudflare/skills\n/plugin install cloudflare@cloudflare"
  directory: "~/.claude/skills/"
  docs_url: "https://code.claude.com/docs/en/skills"

example_prompts:
  - "Create a Cloudflare Workers application that serves as a backend API server."
  - "Add a D1 database to my Worker and create a users table with CRUD endpoints."
  - "Show me how to use Hyperdrive to connect my Worker to an existing Postgres database."
  - "Build an image upload service using R2 pre-signed URLs."
  - "Create an AI chat agent using the Cloudflare Agents SDK that maintains conversation history."
  - "Set up a KV namespace and use it for session storage in my Worker."
  - "Check my deployment logs for errors and suggest fixes."
  - "Add rate limiting to my API using Cloudflare's rate limiting rules."
  - "Build a WebSocket-based pub/sub app using Durable Objects with hibernation."
  - "Deploy this project to Cloudflare Workers with a custom domain."

tips:
  - "The Skills plugin includes a wrangler Skill — Claude knows when to reach for npx wrangler deploy, wrangler d1 migrations apply, and other CLI commands automatically."
  - "Try the <code>/cloudflare:build-agent</code> slash command to scaffold a complete Agents SDK project, or <code>/cloudflare:build-mcp</code> for a remote MCP server."
  - "The Cloudflare API MCP server uses Code Mode — Claude writes JavaScript against a TypeScript API to hit any of 2,500+ endpoints in ~1,000 tokens."
  - "Claude Code works best from the root of your Workers project where wrangler.jsonc lives — that's what the agent uses to understand your bindings."
  - "Use <code>claude mcp list</code> to verify Cloudflare servers are connected. For CI/CD, skip OAuth by passing a Cloudflare API token as a bearer token instead."
  - 'For more information on installing additional MCP servers, or when to use Code Mode versus traditional MCP servers, refer to the <a href="https://github.com/cloudflare/mcp-server-cloudflare" target="_blank" rel="noopener noreferrer">Cloudflare MCP server repository</a>.'

faq:
  - question: "Should I use Skills, the MCP server, Wrangler CLI, or all of them?"
    answer: "All three — and the Skills plugin configures them together. Skills give Claude persistent Cloudflare knowledge (when to use Durable Objects vs KV, what a good Workers project layout looks like). The Cloudflare API MCP server handles platform operations (DNS, WAF, R2 buckets, Zero Trust). Wrangler runs local dev and Workers-specific commands. The `wrangler` Skill teaches Claude when to reach for which."
  - question: "How do I give Claude Code access to my Cloudflare account?"
    answer: "The first time Claude calls a Cloudflare tool, you'll be redirected to authorize via OAuth and choose what permissions to grant."
  - question: "Can Claude Code deploy to existing Workers projects?"
    answer: "Yes. Run Claude Code from your existing project directory where `wrangler.jsonc` is located, and it will understand your project configuration and deploy accordingly."
  - question: "What does Code Mode mean for MCP?"
    answer: 'Code Mode is how the Cloudflare API MCP server fits all 2,500+ API endpoints into ~1,000 tokens. Instead of exposing every endpoint as a separate tool, it exposes two — <code>search()</code> and <code>execute()</code> — and Claude writes JavaScript to call them. <a href="https://developers.cloudflare.com/agents/api-reference/codemode/">Learn more about Code Mode</a>.'

troubleshooting:
  - issue: "MCP server connection fails or times out"
    solution: 'Run <code>claude mcp list</code> to verify the server is registered. Try removing and re-adding: <code>claude mcp remove cloudflare</code> then re-add it. Ensure you have <code>npx</code> and <code>mcp-remote</code> available.'
  - issue: "Claude cannot authenticate with Cloudflare"
    solution: "The MCP server uses OAuth. When prompted, complete the authorization flow in your browser. For CI/CD, create a Cloudflare API token and pass it as a bearer token instead."
  - issue: "Claude does not understand Workers APIs"
    solution: "Connect the docs MCP server: `claude mcp add cloudflare-docs -- npx mcp-remote https://docs.mcp.cloudflare.com/mcp`. This gives Claude access to up-to-date Cloudflare documentation."
  - issue: "Deployment fails with permission error"
    solution: "Verify your Cloudflare OAuth permissions include Workers write access. Re-authorize via the MCP server if needed, or check your API token scopes."

links:
  skills: "https://github.com/cloudflare/skills"
  mcp_server: "https://github.com/cloudflare/mcp"
  docs: "https://docs.anthropic.com/en/docs/claude-code"
  website: "https://claude.ai/code"
