name: Claude Code
vendor: Anthropic
slug: claude-code
icon: claude
description: "Terminal-based coding agent that understands your codebase, runs commands, edits files, and manages git. Made by Anthropic."
capabilities:
  ide: false
  terminal: true
  standalone: true
  cloud: true
  extension: true
  open_source: false
features:
  - Full codebase understanding
  - Terminal command execution
  - Git operations
  - Multi-file editing

primary_type: terminal
pricing_model: subscription
pricing_detail: "Included with Claude Pro ($20/mo) and Max ($200/mo); API usage billing also available"
model_flexibility: locked
context_approach: project_memory

quick_start:
  - title: Install Claude Code
    description: Install the Claude Code CLI globally.
    command: "npm install -g @anthropic-ai/claude-code"
  - title: Connect Cloudflare MCP server
    description: Give Claude native access to the Cloudflare API — over 2,500 endpoints through two tools.
    command: "claude mcp add cloudflare -- npx mcp-remote https://mcp.cloudflare.com/mcp"
  - title: Install Cloudflare Skills
    description: Add Cloudflare slash commands, contextual prompts, and MCP servers.
    command: "/plugin marketplace add cloudflare/skills"
  - title: Start building
    description: Launch Claude Code in your project directory and try a prompt.
    command: "claude"

mcp_config: |
  claude mcp add cloudflare -- npx mcp-remote https://mcp.cloudflare.com/mcp
  claude mcp add cloudflare-docs -- npx mcp-remote https://docs.mcp.cloudflare.com/mcp
  claude mcp add cloudflare-observability -- npx mcp-remote https://observability.mcp.cloudflare.com/mcp
  claude mcp add cloudflare-bindings -- npx mcp-remote https://bindings.mcp.cloudflare.com/mcp

skills_install:
  command: "/plugin marketplace add cloudflare/skills"
  directory: "~/.claude/skills/"
  docs_url: "https://code.claude.com/docs/en/skills"

example_prompts:
  - "Create a Cloudflare Workers application that serves as a backend API server."
  - "Add a D1 database to my Worker and create a users table with CRUD endpoints."
  - "Show me how to use Hyperdrive to connect my Worker to an existing Postgres database."
  - "Build an image upload service using R2 pre-signed URLs."
  - "Create an AI chat agent using the Cloudflare Agents SDK that maintains conversation history."
  - "Set up a KV namespace and use it for session storage in my Worker."
  - "Check my deployment logs for errors and suggest fixes."
  - "Add rate limiting to my API using Cloudflare's rate limiting rules."
  - "Build a WebSocket-based pub/sub app using Durable Objects with hibernation."
  - "Deploy this project to Cloudflare Workers with a custom domain."

workflows:
  - title: Deploy a new Workers app
    steps:
      - "Ask Claude to scaffold a new Workers project"
      - "Claude runs npm create cloudflare@latest and configures the project"
      - "Claude generates wrangler.jsonc with your bindings"
      - "Claude deploys with npx wrangler deploy"
      - "Claude verifies the deployment and returns the live URL"
  - title: Add a D1 database
    steps:
      - "Ask Claude to add a D1 database to your project"
      - "Claude creates the database with npx wrangler d1 create"
      - "Claude adds the binding to wrangler.jsonc"
      - "Claude writes the schema migration and applies it"
      - "Claude updates your Worker code to query the database"
  - title: Debug a failing deployment
    steps:
      - "Ask Claude to check your deployment logs"
      - "Claude uses the observability MCP server to fetch recent logs"
      - "Claude analyzes errors and identifies the root cause"
      - "Claude applies the fix and redeploys"
  - title: Set up a custom domain
    steps:
      - "Ask Claude to configure a custom domain for your Worker"
      - "Claude adds the route to wrangler.jsonc"
      - "Claude provides DNS configuration instructions"
      - "Claude verifies the domain is working"

tips:
  - "Connect the observability MCP server to let Claude automatically debug deployment errors and check logs."
  - "Use the /cloudflare-docs skill to search Cloudflare documentation inline without leaving your terminal."
  - "Add the bindings MCP server for Claude to discover and configure Workers bindings (D1, R2, KV, etc.) automatically."
  - "Claude Code works best when you run it from the root of your Workers project where wrangler.jsonc lives."
  - "Use claude mcp list to verify all Cloudflare MCP servers are connected before starting work."

faq:
  - question: "How do I give Claude Code access to my Cloudflare account?"
    answer: "Connect the Cloudflare API MCP server with `claude mcp add cloudflare -- npx mcp-remote https://mcp.cloudflare.com/mcp`. On first use, you will be redirected to Cloudflare to authorize via OAuth and select permissions."
  - question: "Can Claude Code deploy to existing Workers projects?"
    answer: "Yes. Run Claude Code from your existing project directory where wrangler.jsonc is located, and it will understand your project configuration and deploy accordingly."
  - question: "What MCP servers should I connect?"
    answer: "At minimum, connect the Cloudflare API server (mcp.cloudflare.com/mcp) and docs server (docs.mcp.cloudflare.com/mcp). For debugging, add the observability server. For building, add the bindings server."
  - question: "How do I use Cloudflare Skills with Claude Code?"
    answer: "Install via the plugin marketplace with `/plugin marketplace add cloudflare/skills`. This gives you slash commands like /deploy, /workers, and contextual Cloudflare prompts."

troubleshooting:
  - issue: "MCP server connection fails or times out"
    solution: "Run `claude mcp list` to verify the server is registered. Try removing and re-adding: `claude mcp remove cloudflare` then re-add it. Ensure you have npx and mcp-remote available."
  - issue: "Claude cannot authenticate with Cloudflare"
    solution: "The MCP server uses OAuth. When prompted, complete the authorization flow in your browser. For CI/CD, create a Cloudflare API token and pass it as a bearer token instead."
  - issue: "Claude does not understand Workers APIs"
    solution: "Connect the docs MCP server: `claude mcp add cloudflare-docs -- npx mcp-remote https://docs.mcp.cloudflare.com/mcp`. This gives Claude access to up-to-date Cloudflare documentation."
  - issue: "Deployment fails with permission error"
    solution: "Verify your Cloudflare OAuth permissions include Workers write access. Re-authorize via the MCP server if needed, or check your API token scopes."

related_agents:
  - codex
  - opencode
  - cursor

links:
  skills: "https://github.com/cloudflare/skills"
  mcp_server: "https://github.com/cloudflare/mcp"
  docs: "https://docs.anthropic.com/en/docs/claude-code"
  website: "https://claude.ai/code"
