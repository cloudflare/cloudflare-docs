name: GitHub Copilot
vendor: GitHub
slug: github-copilot
icon: copilot
description: "Editor extension and CLI with agent mode, workspace context, and native PR integration. Made by GitHub."
capabilities:
  ide: false
  terminal: true
  standalone: false
  cloud: true
  extension: true
  open_source: false
features:
  - Agent mode
  - Workspace context
  - CLI integration
  - PR summaries

primary_type: extension
pricing_model: subscription
pricing_detail: "Free tier with limits; Pro ($10/mo), Business ($19/mo per user), Enterprise ($39/mo per user)"
model_flexibility: multi_provider
context_approach: indexed_codebase

quick_start:
  - title: Install GitHub Copilot
    description: 'Install the GitHub Copilot extension in VS Code from the <a href="https://marketplace.visualstudio.com/items?itemName=GitHub.copilot" target="_blank" rel="noopener noreferrer">Visual Studio Marketplace</a>. For JetBrains IDEs, Visual Studio, or Xcode, see the <a href="https://docs.github.com/en/copilot/how-tos/set-up/install-copilot-extension" target="_blank" rel="noopener noreferrer">Install the Copilot extension</a> guide.'
    link: "https://marketplace.visualstudio.com/items?itemName=GitHub.copilot"
  - title: Install the Cloudflare Skills
    description: 'Installs the Cloudflare Skills. See <a href="https://docs.github.com/en/copilot/concepts/agents/about-agent-skills" target="_blank" rel="noopener noreferrer">About agent skills</a> for where Copilot looks for Skills and how they work in VS Code agent mode, the Copilot CLI, and the cloud agent.'
    command: "npx skills add https://github.com/cloudflare/skills"
  - title: Configure Cloudflare MCP servers
    description: Add the Cloudflare API and docs MCP servers to your VS Code MCP settings. VS Code 1.99+ supports MCP natively.
    command: '{"mcpServers": {"cloudflare": {"url": "https://mcp.cloudflare.com/mcp"}, "cloudflare-docs": {"url": "https://docs.mcp.cloudflare.com/mcp"}}}'
  - title: Start building
    description: 'Open Copilot Chat (Ctrl+Shift+I), switch to agent mode, and try a prompt — for example, "Create an example hello world app using Cloudflare Workers."'

mcp_config: |
  {
    "mcpServers": {
      "cloudflare": {
        "url": "https://mcp.cloudflare.com/mcp"
      },
      "cloudflare-docs": {
        "url": "https://docs.mcp.cloudflare.com/mcp"
      }
    }
  }

skills_plugin_install:
  supported: true
  command: "npx skills add https://github.com/cloudflare/skills"
  note: "Uses the npx skills CLI. Installs Skills only — MCP servers are configured separately."

skills_install:
  command: "npx skills add https://github.com/cloudflare/skills"
  docs_url: "https://docs.github.com/en/copilot/concepts/agents/about-agent-skills"

example_prompts:
  - "Create a new Cloudflare Workers application with TypeScript."
  - "Add a D1 database binding to this Worker and create the schema."
  - "Configure R2 storage for this project."
  - "Explain how Workers routing works in this project."
  - "Set up GitHub Actions to auto-deploy this Worker to Cloudflare."
  - "Add error handling and logging to my Worker."
  - "Generate Vitest tests for my Worker."
  - "Review my wrangler.jsonc for best practices."

tips:
  - "Agent Skills work with VS Code agent mode, the Copilot CLI, and the GitHub cloud agent — but not with inline code completion. Switch Copilot Chat to agent mode to unlock Skills-aware behavior."
  - "Use @workspace in Copilot Chat to give the agent full context of your Workers project before asking it to build or deploy."
  - "Commit a .github/copilot-instructions.md file with repository-wide conventions (coding standards, preferred patterns) — Copilot loads it automatically on every interaction, complementing Skills which are loaded on demand."
  - "Connect the Cloudflare API MCP server to VS Code — Copilot can then manage Cloudflare resources (DNS, WAF, R2 buckets) through Code Mode in ~1,000 tokens."
  - "GitHub Copilot integrates natively with GitHub Actions — ask it to generate a deploy workflow that runs Wrangler with your CLOUDFLARE_API_TOKEN secret."
  - "The Cloudflare docs MCP server keeps Copilot's Workers API references fresh without you needing to paste documentation into prompts."

faq:
  - question: "Does Copilot support Cloudflare Skills?"
    answer: "Yes. GitHub Copilot added Agent Skills support for VS Code agent mode, the Copilot CLI, and the cloud agent. Run `npx skills add https://github.com/cloudflare/skills` to install them. See the [About agent skills](https://docs.github.com/en/copilot/concepts/agents/about-agent-skills) guide for details on where Copilot looks for Skills."
  - question: "Should I use Skills, the MCP server, Wrangler CLI, or all of them?"
    answer: "All three. Skills load Cloudflare expertise into every agent-mode session. The Cloudflare API MCP server handles platform operations (DNS, WAF, Zero Trust, R2 buckets). Wrangler runs local dev and deploys in the VS Code terminal. The bundled `wrangler` Skill teaches Copilot when to reach for which."
  - question: "Do I still need .github/copilot-instructions.md?"
    answer: "It's complementary. Use custom instructions for simple repository-wide conventions that apply to almost every task (coding standards, preferred libraries). Use Skills for detailed, situational guidance Copilot should only load when relevant."
  - question: "Can Copilot deploy to Cloudflare directly?"
    answer: "Yes, via Wrangler in the VS Code terminal, or via a GitHub Actions workflow that Copilot can generate for you."

troubleshooting:
  - issue: "Skills don't load in Copilot"
    solution: "Skills only work in VS Code agent mode, the Copilot CLI, and the cloud agent — not with inline completion or plain chat. Switch Copilot Chat to agent mode. If Skills still aren't discovered, see [About agent skills](https://docs.github.com/en/copilot/concepts/agents/about-agent-skills) for the paths Copilot checks."
  - issue: "Copilot does not understand Workers APIs"
    solution: "Verify the Cloudflare Skills are installed, connect the Cloudflare docs MCP server, and make sure you're using Copilot in agent mode."
  - issue: "MCP server not available in VS Code"
    solution: "Ensure you are using VS Code 1.99+ which supports MCP natively. Add the server configuration to `.vscode/mcp.json`."
  - issue: "GitHub Actions deployment fails"
    solution: "Verify `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID` are set as repository secrets. Ensure the token has Workers write permissions."

links:
  skills: "https://github.com/cloudflare/skills"
  mcp_server: "https://github.com/cloudflare/mcp"
  docs: "https://docs.github.com/en/copilot"
  website: "https://github.com/features/copilot"
