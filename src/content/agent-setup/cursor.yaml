name: Cursor
vendor: Cursor
slug: cursor
icon: cursor
description: "AI-first IDE built on VS Code with multi-file Composer edits and background agents. Made by Cursor."
capabilities:
  ide: true
  terminal: true
  standalone: true
  cloud: true
  extension: false
  open_source: false
features:
  - Multi-file Composer
  - Background agents
  - Codebase indexing
  - Terminal integration

primary_type: ide
pricing_model: subscription
pricing_detail: "Free tier; Pro ($20/mo), Business ($40/mo per user) for advanced features"
model_flexibility: multi_provider
context_approach: indexed_codebase

quick_start:
  - title: Install Cursor
    description: 'Download Cursor for macOS, Windows, or Linux from the <a href="https://cursor.com/downloads" target="_blank" rel="noopener noreferrer">Cursor downloads page</a>. Linux users can also use apt or dnf — see the <a href="https://cursor.com/docs/get-started/installation" target="_blank" rel="noopener noreferrer">Cursor installation guide</a>.'
    link: "https://cursor.com/downloads"
  - title: Install the Cloudflare Skills
    description: Install from the Cursor Marketplace, or add manually via Settings > Rules > Add Rule > Remote Rule (GitHub) with cloudflare/skills.
    command: "cloudflare/skills"
  - title: Add the Cloudflare MCP servers
    description: Add the server URLs to .cursor/mcp.json in your project (or ~/.cursor/mcp.json globally).
    command: '{"mcpServers": {"cloudflare": {"url": "https://mcp.cloudflare.com/mcp"}, "cloudflare-docs": {"url": "https://docs.mcp.cloudflare.com/mcp"}}}'
  - title: Open Composer and build
    description: 'Open Composer with Cmd+I and try a prompt — for example, "Create an example hello world app using Cloudflare Workers."'

mcp_config: |
  {
    "mcpServers": {
      "cloudflare": {
        "url": "https://mcp.cloudflare.com/mcp"
      },
      "cloudflare-docs": {
        "url": "https://docs.mcp.cloudflare.com/mcp"
      },
      "cloudflare-observability": {
        "url": "https://observability.mcp.cloudflare.com/mcp"
      }
    }
  }

skills_plugin_install:
  supported: true
  command: "cloudflare/skills"
  note: "Install from the Cursor Marketplace, or add manually via Settings > Rules > Add Rule > Remote Rule (GitHub) with this path."

skills_install:
  command: "cloudflare/skills"
  directory: "~/.cursor/skills/"
  docs_url: "https://cursor.com/docs/context/skills"

example_prompts:
  - "Create a new Workers project with TypeScript and deploy it."
  - "Add a D1 database with a schema for a blog with posts and comments."
  - "Configure R2 for image storage with upload and download endpoints."
  - "Build a Workers application using Workers AI for content moderation."
  - "Set up private networking between my API Worker and database."
  - "Add WebSocket support to my Worker with proper health checks."
  - "Deploy this monorepo to Cloudflare Workers with a custom Dockerfile."
  - "Create separate staging and production environments for my Worker."

tips:
  - "The Skills plugin includes a wrangler Skill that teaches Cursor when to run npx wrangler deploy vs. call the MCP API directly."
  - "Use Composer (Cmd+I) for multi-file edits — it pairs well with the Skills plugin for scaffolding Workers projects end to end."
  - "The Cloudflare API MCP server uses Code Mode — Cursor writes JavaScript against a typed API to reach any of 2,500+ endpoints in ~1,000 tokens."
  - "Add @wrangler.jsonc to your Composer prompts so Cursor sees your current bindings when generating or modifying code."
  - "For background agents running in the cloud, use a Cloudflare API token instead of OAuth — pass it as a bearer token in the MCP server config."
  - 'For more information on installing additional MCP servers, or when to use Code Mode versus traditional MCP servers, refer to the <a href="https://github.com/cloudflare/mcp-server-cloudflare" target="_blank" rel="noopener noreferrer">Cloudflare MCP server repository</a>.'

faq:
  - question: "Should I use Skills, the MCP server, Wrangler CLI, or all of them?"
    answer: "All three work together. Skills give Cursor persistent Cloudflare knowledge loaded into every Composer prompt. The Cloudflare API MCP server handles platform operations (DNS, WAF, R2 buckets, Zero Trust). Wrangler runs local dev and Workers-specific commands. The bundled `wrangler` Skill teaches Cursor when to reach for which."
  - question: "How do I give Cursor access to Cloudflare?"
    answer: "Install the Skills plugin (from the Cursor Marketplace, or Settings > Rules > Add Rule > Remote Rule with `cloudflare/skills`). The first time Cursor calls a Cloudflare tool, you'll be redirected to authorize via OAuth and choose permissions."
  - question: "Can Cursor deploy to Cloudflare without leaving the IDE?"
    answer: "Yes. Ask Composer to deploy your project. Cursor runs Wrangler commands in the integrated terminal and can also call the API MCP server for managed deploys and resource creation."

troubleshooting:
  - issue: "MCP server not connecting in Cursor"
    solution: "Verify your `.cursor/mcp.json` configuration is valid JSON. Restart Cursor after making changes to the MCP config."
  - issue: "Wrangler CLI not found in Cursor terminal"
    solution: "Install Wrangler globally with `npm install -g wrangler` and restart Cursor to refresh the PATH."
  - issue: "Composer does not understand Workers APIs"
    solution: "Add the Cloudflare docs MCP server and Workers documentation to your project context. Use @-mentions to reference `wrangler.jsonc`."

links:
  skills: "https://github.com/cloudflare/skills"
  mcp_server: "https://github.com/cloudflare/mcp"
  docs: "https://docs.cursor.com"
  website: "https://cursor.sh"
