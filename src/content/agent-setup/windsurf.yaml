name: Windsurf
vendor: Codeium
slug: windsurf
icon: windsurf
description: "Agentic IDE with Cascade context and Flows for multi-step tasks. Made by Codeium."
capabilities:
  ide: true
  terminal: false
  standalone: true
  cloud: false
  extension: false
  open_source: false
features:
  - Cascade context engine
  - Flows automation
  - Deep codebase search
  - Command suggestions

primary_type: ide
pricing_model: subscription
pricing_detail: "Free tier; Pro ($15/mo), Teams ($30/mo per user), Enterprise (custom)"
model_flexibility: multi_provider
context_approach: indexed_codebase

quick_start:
  - title: Download Windsurf
    description: 'Download Windsurf for macOS, Windows, or Linux from the <a href="https://windsurf.com/download" target="_blank" rel="noopener noreferrer">Windsurf downloads page</a>.'
    link: "https://windsurf.com/download"
  - title: Install the Cloudflare Skills
    description: 'Windsurf supports the Agent Skills standard in Cascade. Install the Cloudflare Skills bundle from <a href="https://github.com/cloudflare/skills" target="_blank" rel="noopener noreferrer">cloudflare/skills</a> — see the <a href="https://docs.windsurf.com/windsurf/cascade/skills" target="_blank" rel="noopener noreferrer">Windsurf Skills documentation</a> for where Cascade loads Skills from.'
  - title: Configure Cloudflare MCP servers
    description: Windsurf supports remote MCP servers via OAuth. Add the Cloudflare API and docs servers to your ~/.codeium/windsurf/mcp_config.json file.
    command: '{"mcpServers": {"cloudflare": {"serverUrl": "https://mcp.cloudflare.com/mcp"}, "cloudflare-docs": {"serverUrl": "https://docs.mcp.cloudflare.com/mcp"}}}'
  - title: Start building
    description: 'Open Cascade and try a prompt — for example, "Create an example hello world app using Cloudflare Workers."'

mcp_config: |
  {
    "mcpServers": {
      "cloudflare": {
        "serverUrl": "https://mcp.cloudflare.com/mcp"
      },
      "cloudflare-docs": {
        "serverUrl": "https://docs.mcp.cloudflare.com/mcp"
      },
      "cloudflare-observability": {
        "serverUrl": "https://observability.mcp.cloudflare.com/mcp"
      }
    }
  }

skills_plugin_install:
  supported: true
  note: "Windsurf supports Agent Skills in Cascade. Install the Cloudflare Skills from github.com/cloudflare/skills; refer to the Windsurf Cascade Skills docs for where Skills are loaded from."

skills_install:
  docs_url: "https://docs.windsurf.com/windsurf/cascade/skills"

example_prompts:
  - "Create a Workers REST API with authentication middleware."
  - "Add a D1 database with a schema for an e-commerce product catalog."
  - "Set up R2 storage for serving static assets."
  - "Build a real-time notification system using Durable Objects and WebSockets."
  - "Deploy this application to Cloudflare Workers."
  - "Add rate limiting and bot protection to my API endpoints."
  - "Create a Cloudflare Workers cron trigger for data processing."
  - "Set up environment variables for staging and production."

tips:
  - "Install the Cloudflare Skills bundle so Cascade knows when to reach for Workers, Wrangler, Durable Objects, and the Agents SDK without you re-explaining them."
  - "Windsurf's Cascade maintains context across actions — start with MCP + Skills and Cascade will remember your Cloudflare configuration for subsequent requests."
  - "The Cloudflare API MCP server uses Code Mode — Cascade writes JavaScript to reach any of 2,500+ endpoints in ~1,000 tokens."
  - "Use @-mention to include your wrangler.jsonc in Cascade prompts — Cascade uses this to understand your current bindings when generating code."
  - "Add the observability MCP server to let Cascade automatically check Workers logs and debug deployments without leaving the IDE."
  - 'For more information on installing additional MCP servers, or when to use Code Mode versus traditional MCP servers, refer to the <a href="https://github.com/cloudflare/mcp-server-cloudflare" target="_blank" rel="noopener noreferrer">Cloudflare MCP server repository</a>.'

faq:
  - question: "Does Windsurf support Cloudflare Skills?"
    answer: "Yes. Windsurf supports Agent Skills in Cascade. Install the Cloudflare Skills bundle from [cloudflare/skills](https://github.com/cloudflare/skills) — see the [Windsurf Cascade Skills documentation](https://docs.windsurf.com/windsurf/cascade/skills) for where Cascade discovers and loads Skills."
  - question: "Should I use the MCP server, Wrangler CLI, or both?"
    answer: "Both. Use the Cloudflare API MCP server for platform operations (DNS, WAF, Zero Trust, R2 buckets) and Wrangler in Windsurf's integrated terminal for local dev and deploys. Cascade coordinates between them naturally."
  - question: "How do I configure MCP servers in Windsurf?"
    answer: "Edit `~/.codeium/windsurf/mcp_config.json` and add the Cloudflare server URLs under `mcpServers` using the `serverUrl` field. Restart Windsurf to pick up changes. Windsurf supports OAuth for remote MCP servers, so you'll be redirected to Cloudflare to authorize on first use."
  - question: "Can Cascade deploy to Cloudflare?"
    answer: "Yes. Cascade can run `npx wrangler deploy` in the integrated terminal, and with the MCP server configured it can also call the Cloudflare API directly for managed deploys and resource creation."

troubleshooting:
  - issue: "MCP server not connecting"
    solution: "Verify your mcp_config.json configuration. Restart Windsurf after making changes. Ensure the MCP server URL ends with /mcp."
  - issue: "Cascade loses context about Workers"
    solution: "Use @-mention to include `wrangler.jsonc` and key configuration files in your Cascade prompt. The Flows feature helps maintain context across multi-step tasks."
  - issue: "Wrangler not found in terminal"
    solution: "Install Wrangler globally with `npm install -g wrangler` and restart Windsurf to refresh the terminal PATH."

links:
  mcp_server: "https://github.com/cloudflare/mcp"
  docs: "https://docs.windsurf.com"
  website: "https://windsurf.com"
