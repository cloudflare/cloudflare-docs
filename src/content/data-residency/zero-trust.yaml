category: Zero Trust
order: 6
entries:
  - product: Access
    controls:
      regional_services:
        status: requirements
        requirements:
          - The Access team domain can be processed only in the FedRAMP Moderate Compliant (Domestic) region. Contact your account team to configure it.
          - A protected public application hostname can use any managed region available for [Regional Hostnames](/data-localization/regional-services/regional-hostnames/).
      storage:
        status: unassessed
      cmb:
        status: supported
        impact:
          - When Customer Metadata Boundary is set to the EU, Access does not store Access User Logs and the dashboard appears empty. Use [Logpush](/logs/logpush/) to retain these logs.
      gkm:
        status: supported
        impact:
          - If the protected application hostname uses a supported custom certificate, Geo Key Manager can restrict where its private key is used. [Access JWT](/cloudflare-one/access-controls/applications/http-apps/authorization-cookie/validating-json/) is not yet localized.
  - product: Browser Isolation
    controls:
      regional_services:
        status: requirements
        requirements:
          - Only the US FedRAMP region is supported. Contact your account team to set up a FedRAMP account.
      storage:
        status: unassessed
      cmb:
        status: supported
      gkm:
        status: out-of-scope
  - product: CASB
    controls:
      regional_services:
        status: out-of-scope
      storage:
        status: unassessed
      cmb:
        status: not-supported
      gkm:
        status: out-of-scope
  - product: Cloudflare Tunnel
    controls:
      regional_services:
        status: requirements
        requirements:
          - For [published applications](/cloudflare-one/networks/connectors/cloudflare-tunnel/routing-to-tunnel/), Regional Services applies through the region set on the public hostname's DNS record.
        notes:
          - The [`--region us` parameter](/cloudflare-one/networks/connectors/cloudflare-tunnel/configure-tunnels/run-parameters/#region) restricts `cloudflared` connections to data centers in the United States. It is separate from Regional Services.
      storage:
        status: unassessed
      cmb:
        status: out-of-scope
      gkm:
        status: out-of-scope
  - product: Digital Experience
    controls:
      regional_services:
        status: out-of-scope
      storage:
        status: unassessed
      cmb:
        status: supported
        impact:
          - Dashboard Analytics are empty when using CMB outside the US region. Use [Logpush](/logs/logpush/) instead.
      gkm:
        status: out-of-scope
  - product: DLP
    controls:
      regional_services:
        status: out-of-scope
        notes:
          - Uses Gateway HTTP and CASB.
      storage:
        status: unassessed
      cmb:
        status: supported
        impact:
          - DLP is part of Gateway HTTP, however, [DLP detection entries](/cloudflare-one/data-loss-prevention/detection-entries/configure-detection-entries/) are not available outside US region when using Customer Metadata Boundary.
      gkm:
        status: out-of-scope
        notes:
          - Uses Gateway HTTP and CASB.
  - product: Gateway
    controls:
      regional_services:
        status: requirements
        requirements:
          - Applies to Gateway HTTP traffic from [supported on-ramps](/data-localization/how-to/zero-trust/#supported-on-ramps) in [supported regions](/data-localization/how-to/zero-trust/#available-regions). The region is set per account.
        impact:
          - Gateway DNS and network policies are processed at the data center where traffic is received, not in the selected region.
          - "[File Sandboxing](/cloudflare-one/traffic-controls/http-policies/file-sandboxing/) processes quarantined files in the United States, regardless of the selected region."
          - Some DLP detection features are unsupported. Refer to [Gateway limitations](/data-localization/how-to/zero-trust/#gateway-limitations).
      storage:
        status: unassessed
      cmb:
        status: supported
        impact:
          - Dashboard Analytics and Logs are empty when using CMB outside the US region. Use Logpush instead.
      gkm:
        status: supported
        impact:
          - You can [bring your own certificate](/cloudflare-one/team-and-resources/devices/user-side-certificates/custom-certificate/) to Gateway, but the certificate cannot be restricted to a specific region.
  - product: Cloudflare One Client
    controls:
      regional_services:
        status: out-of-scope
      storage:
        status: unassessed
      cmb:
        status: supported
        impact:
          - Logs / Analytics not available outside US region when using Customer Metadata Boundary.
      gkm:
        status: out-of-scope
