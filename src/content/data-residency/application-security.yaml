category: Application Security
order: 2
entries:
  - product: Advanced Certificate Manager
    controls:
      regional_services:
        status: out-of-scope
      storage:
        status: unassessed
      cmb:
        status: out-of-scope
      gkm:
        status: not-supported
  - product: Advanced DDoS Protection
    controls:
      regional_services:
        status: supported
      storage:
        status: unassessed
      cmb:
        status: supported
        impact:
          - "Email and webhook notifications for DDoS and WAF events may not fire reliably when Customer Metadata Boundary is set to `eu`. This behavior is intermittent and under investigation. If timely alerts are critical, use [Logpush](/logs/logpush/) as a complementary monitoring mechanism."
      gkm:
        status: supported
  - product: API Shield
    controls:
      regional_services:
        status: supported
      storage:
        status: unassessed
      cmb:
        status: supported
        impact:
          - "The following API Shield sub-features do not work when CMB is set to EU: API Discovery (automatic detection of your API endpoints), Volumetric Abuse Detection (identifying unusually high API call volumes), and [Sequence Analytics and Mitigation](/api-shield/security/sequence-analytics/) (tracking the order of API calls to detect misuse). All other API Shield features work with any CMB region."
      gkm:
        status: supported
  - product: Bot Management
    controls:
      regional_services:
        status: supported
      storage:
        status: unassessed
      cmb:
        status: supported
      gkm:
        status: supported
  - product: Client-side security (formerly Page Shield)
    controls:
      regional_services:
        status: supported
      storage:
        status: unassessed
      cmb:
        status: supported
        notes:
          - Cloudflare ingests CSP violation reports at the edge and processes reported JavaScript files in its core data centers.
      gkm:
        status: supported
  - product: DNS Firewall
    controls:
      regional_services:
        status: out-of-scope
      storage:
        status: unassessed
      cmb:
        status: supported
        impact:
          - Dashboard analytics are not available outside the US region when using Customer Metadata Boundary. Use [Logpush](/logs/logpush/) instead.
      gkm:
        status: out-of-scope
  - product: Rate Limiting
    controls:
      regional_services:
        status: supported
      storage:
        status: unassessed
      cmb:
        status: supported
        impact:
          - Legacy Zone Analytics & Logs section not available outside US region when using CMB. Use [Security Analytics](/waf/analytics/security-analytics/) instead.
      gkm:
        status: supported
  - product: SSL/TLS
    controls:
      regional_services:
        status: supported
      storage:
        status: unassessed
      cmb:
        status: supported
      gkm:
        status: supported
  - product: Cloudflare for SaaS
    controls:
      regional_services:
        status: supported
      storage:
        status: unassessed
      cmb:
        status: supported
      gkm:
        status: requirements
        requirements:
          - Only with [custom certificates](/cloudflare-for-platforms/cloudflare-for-saas/security/certificate-management/custom-certificates/) that you upload for custom hostnames. Certificates that Cloudflare issues for custom hostnames are not supported.
  - product: Turnstile
    controls:
      regional_services:
        status: not-supported
      storage:
        status: unassessed
      cmb:
        status: supported
        impact:
          - "[Turnstile Analytics](/turnstile/turnstile-analytics/) are available. However, there are no regionalization guarantees for the Siteverify API yet."
        notes:
          - For how Turnstile handles visitor data, refer to the [Turnstile privacy policy](https://www.cloudflare.com/turnstile-privacy-policy/).
      gkm:
        status: out-of-scope
  - product: WAF/L7 Firewall
    controls:
      regional_services:
        status: supported
      storage:
        status: unassessed
      cmb:
        status: supported
        impact:
          - "Email and webhook notifications for DDoS and WAF events may not fire reliably when Customer Metadata Boundary is set to `eu`. This behavior is intermittent and under investigation. If timely alerts are critical, use [Logpush](/logs/logpush/) as a complementary monitoring mechanism."
      gkm:
        status: supported
  - product: DMARC Management
    controls:
      regional_services:
        status: out-of-scope
      storage:
        status: unassessed
      cmb:
        status: supported
      gkm:
        status: out-of-scope
  - product: Keyless SSL
    controls:
      regional_services:
        status: unassessed
      storage:
        status: unassessed
      cmb:
        status: unassessed
      gkm:
        status: unassessed
