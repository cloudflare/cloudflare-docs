releaseNotes: |-
  This release contains new improvements in addition to features and improvements introduced in Beta Client version 2025.5.735.1. Please try this Beta version to resolve the issues noted below.

  **Changes and improvements**
  - Improvement to better handle multi-user fast user switching.
  - Fix for an issue causing WARP connectivity to fail without full system reboot.


  **Known issues**
  - DNS resolution may be broken when the following conditions are all true:
    - WARP is in Secure Web Gateway without DNS filtering (tunnel-only) mode.
    - A custom DNS server address is configured on the primary network adapter.
    - The custom DNS server address on the primary network adapter is changed while WARP is connected.

    To work around this issue, please reconnect the WARP client by toggling off and back on.
  - We've received reports of performance issues from some customers that have upgraded to 24H2 with the Windows Filtering Platform and local device firewall rules. Before rolling out this Windows version, we highly encourage customers to test thoroughly as we continue to debug with Microsoft

  For Zero Trust documentation please see: <https://developers.cloudflare.com/cloudflare-one/connections/connect-devices/warp>

  For Consumer documentation please see: <https://developers.cloudflare.com/warp-client/>
