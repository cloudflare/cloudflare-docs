releaseNotes: This hotfix resolves a regression that caused a large increase in
  DNS-over-TCP queries to fallback and internal DNS servers. The client now
  sends fallback DNS queries over UDP first, falling back to TCP only when a
  response is truncated, instead of querying both protocols in parallel.
