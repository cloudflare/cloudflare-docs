releaseNotes: |-
  New Cloudflare One app changes:

  - Fixed an issue where metered-aware apps restricted uploads while WARP was connected, even on an unmetered Wi-Fi network. The client now correctly propagates the underlying network's metered status through the VPN interface.
  - Fixed a misleading error message that reported an MDM parsing failure when toggling WARP on a device with a missing registration.
