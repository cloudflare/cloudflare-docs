releaseNotes: |-
  Default language - en-US
  New Cloudflare One app changes:

  - Added a new MDM parameter 'use_in_app_webview' that enables in-app WebView for Zero Trust authentication.
  - Adjusted TCP fallback time for MASQUE tunnels to further improve connectivity on unreliable networks.
  - Reduced events logged to reduce diagnostic log size and legibility.
  - Fixed an issue with delayed connection resumption after waking from sleep on ChromeOS.
  - Fixed an issue where dismissing notifications would not actually dismiss the notification.
