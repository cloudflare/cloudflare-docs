<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 920 292" role="img" aria-labelledby="title description">
  <title id="title">A run pauses for approval, then resumes where it paused or fails if rejected</title>
  <desc id="description">A timeline of one run's states. The run is running until the agent's code calls postComment(), which calls ctx.interrupt() to ask for approval. The run then waits for approval, paused at postComment(). When respond() approves the call, the run resumes where it paused, ctx.interrupt() returns, and the comment is posted. If respond() rejects it, postComment() throws, and the run fails unless the code catches the error.</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.label{font-size:12px;font-weight:600;fill:#1a1a1a}.sublabel{font-size:11px;fill:#6b7280}.run{font-size:12px;font-weight:600;fill:#0369a1}.wait{font-size:12px;font-weight:600;fill:#374151}.gate{font-size:11px;font-weight:600;fill:#9a3412}.event{font-size:11px;font-weight:600;fill:#1a1a1a}.approve{font-size:12px;font-weight:600;fill:#166534}.reject{font-size:12px;font-weight:600;fill:#991b1b}.branch{font-size:11px;font-weight:600;fill:#991b1b}
  </style>
  <defs>
    <marker id="time-arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
      <path fill="#d1d5db" d="m0 0 8 3-8 3z"/>
    </marker>
    <marker id="reject-arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3">
      <path fill="#fca5a5" d="m0 0 8 3-8 3z"/>
    </marker>
  </defs>
  <rect width="920" height="292" fill="#fafafa" rx="8"/>
  <text x="40" y="28" class="label">An approval in a run</text>
  <path stroke="#d1d5db" stroke-width="1.5" marker-end="url(#time-arrow)" d="M40 44h840"/>
  <text x="886" y="48" class="sublabel">time</text>

  <text x="250" y="65" class="gate" text-anchor="middle">ctx.interrupt()</text>
  <text x="250" y="82" class="sublabel" text-anchor="middle">asks for approval</text>
  <path stroke="#fb923c" stroke-dasharray="3 3" stroke-width="1.5" d="M250 88v8"/>

  <text x="560" y="65" class="event" text-anchor="middle">respond()</text>
  <text x="560" y="82" class="sublabel" text-anchor="middle">approves or rejects</text>
  <path stroke="#9ca3af" stroke-dasharray="3 3" stroke-width="1.5" d="M560 88v8"/>

  <path class="shape" fill="#eff6ff" stroke="#93c5fd" d="M40 96h198l12 26-12 26H40z"/>
  <text x="139" y="118" class="run" text-anchor="middle">Running</text>
  <text x="139" y="135" class="sublabel" text-anchor="middle">code calls postComment()</text>

  <path class="shape" fill="#f3f4f6" stroke="#d1d5db" stroke-dasharray="4 3" d="M250 96h298l12 26-12 26H250l12-26z"/>
  <text x="405" y="118" class="wait" text-anchor="middle">Waiting for approval</text>
  <text x="405" y="135" class="sublabel" text-anchor="middle">paused at postComment()</text>

  <path class="shape" fill="#f0fdf4" stroke="#86efac" d="M560 96h308l12 26-12 26H560l12-26z"/>
  <text x="722" y="118" class="approve" text-anchor="middle">Resumes where it paused</text>
  <text x="722" y="135" class="sublabel" text-anchor="middle">ctx.interrupt() returns and the comment is posted</text>


  <path stroke="#fca5a5" stroke-dasharray="4 3" stroke-width="1.5" marker-end="url(#reject-arrow)" d="M566 148v98h10"/>
  <text x="582" y="200" class="branch">if rejected</text>
  <path class="shape" fill="#fef2f2" stroke="#fca5a5" d="M580 224h288l12 22-12 22H580z"/>
  <text x="724" y="242" class="reject" text-anchor="middle">Rejected: postComment() throws</text>
  <text x="724" y="258" class="sublabel" text-anchor="middle">the run fails unless the code catches it</text>
</svg>
