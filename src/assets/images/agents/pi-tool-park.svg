<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="960" height="622" viewBox="0 0 960 622" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="dg-title dg-desc">
<title id="dg-title">A parked tool call waits on disk, not in memory</title>
<desc id="dg-desc">A sequence diagram of a tool that asks the user a question. The model calls the tool. The tool has no answer yet, so it shows the question with its task id and returns a park naming the signal it waits for. Pi stores the park with the call, and the Durable Object can hibernate. Later your app calls harness.signal() with the task id and the answer. Pi matches the stored signal key and runs execute() again with the same arguments. This time readSignal() returns the answer, and the tool returns it to the model as its result.</desc>
