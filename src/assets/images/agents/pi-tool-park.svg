 font-size="11.5" font-weight="400" text-anchor="start">signal: Answer.key("answer")</text><rect style="fill:var(--dg-tint);stroke:var(--dg-accent)" x="354" y="118" width="12" height="152" rx="3" stroke-width="1.5"/><text style="fill:var(--dg-orange-ink);stroke:var(--dg-bg);paint-order:stroke" x="344" y="242" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="end" stroke-width="5" stroke-linejoin="round">run 1</text><rect style="fill:var(--dg-tint);stroke:var(--dg-accent)" x="354" y="510" width="12" height="108" rx="3" stroke-width="1.5"/><text style="fill:var(--dg-orange-ink);stroke:var(--dg-bg);paint-order:stroke" x="344" y="525" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="end" stroke-width="5" stroke-linejoin="round">run 2</text><path style="stroke:var(--dg-text2)" d="M114,128 L350,128" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><text style="fill:var(--dg-text);stroke:var(--dg-bg);paint-order:stroke" x="234" y="120" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" stroke-width="5" stroke-linejoin="round">calls ask_user</text><rect style="fill:var(--dg-card);stroke:var(--dg-white-stroke)" x="251.5" y="157" width="217" height="30" rx="6" stroke-width="1.2"/><text style="fill:var(--dg-text)" x="360" y="176" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle">readSignal(): no answer yet</text><path style="stroke:var(--dg-text2)" d="M366,216 L846,216" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><text style="fill:var(--dg-text);stroke:var(--dg-bg);paint-order:stroke" x="608" y="208" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" 