<rect style="fill:var(--dg-bg)" width="960" height="622" rx="16"/>
<line style="stroke:var(--dg-faint)" x1="115" y1="90" x2="115" y2="562" stroke-width="1.2" stroke-dasharray="4 4"/><line style="stroke:var(--dg-faint)" x1="375" y1="90" x2="375" y2="562" stroke-width="1.2" stroke-dasharray="4 4"/><line style="stroke:var(--dg-faint)" x1="625" y1="90" x2="625" y2="562" stroke-width="1.2" stroke-dasharray="4 4"/><line style="stroke:var(--dg-faint)" x1="855" y1="90" x2="855" y2="562" stroke-width="1.2" stroke-dasharray="4 4"/><rect style="stroke:var(--dg-grey-stroke)" x="368" y="250" width="14" height="202" fill="url(#hatch)" stroke-width="1"/><text style="fill:var(--dg-muted);stroke:var(--dg-bg);paint-order:stroke" x="361" y="355" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="end" stroke-width="5" stroke-linejoin="round">parked</text><rect style="fill:var(--dg-card);stroke:var(--dg-line)" x="30" y="40" width="170" height="50" rx="10" stroke-width="1.5"/><text style="fill:var(--dg-text)" x="115" y="70" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Model</text><rect style="fill:var(--dg-tint);stroke:var(--dg-accent)" x="290" y="40" width="170" height="50" rx="10" stroke-width="1.5"/><text style="fill:var(--dg-text)" x="375" y="61" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Tool</text><text style="fill:var(--dg-muted)" x="375" y="79" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">execute()</text><rect style="fill:var(--dg-card);stroke:var(--dg-line)" x="540" y="40" width="170" height="50" rx="10" stroke-width="1.5"/><text style="fill:var(--dg-text)" x="625" y="61" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Pi</text><text style="fill:var(--dg-muted)" x="625" y="79" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">stores every call</text><rect style="fill:var(--dg-blue-fill);stroke:var(--dg-blue-stroke)" x="770" y="40" width="170" height="50" rx="10" stroke-width="1.5"/><text style="fill:var(--dg-blue-ink)" x="855" y="61" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Your app</text><text style="fill:var(--dg-muted)" x="855" y="79" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">agent and UI</text><path style="stroke:var(--dg-text2)" d="M119,124 L369,124" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><text style="fill:var(--dg-text);stroke:var(--dg-bg);paint-order:stroke" x="245" y="116" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" stroke-width="5" stroke-linejoin="round">calls ask_user</text><rect style="fill:var(--dg-card);stroke:var(--dg-white-stroke)" x="266.5" y="155" width="217" height="30" rx="6" stroke-width="1.2"/><text style="fill:var(--dg-text)" x="375" y="174" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle">readSignal(): no answer yet</text><path style="stroke:var(--dg-text2)" d="M379,216 L849,216" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><text style="fill:var(--dg-text);stroke:var(--dg-bg);paint-order:stroke" x="615" y="208" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" stroke-width="5" stroke-linejoin="round">shows the question, with api.taskId</text><path style="stroke:var(--dg-text2)" d="M379,262 L619,262" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><text style="fill:var(--dg-text);stroke:var(--dg-bg);paint-order:stroke" x="500" y="254" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" stroke-width="5" stroke-linejoin="round">returns { sleep: { signals } }</text><rect style="fill:var(--dg-card);stroke:var(--dg-white-stroke)" x="510" y="293" width="230" height="30" rx="6" stroke-width="1.2"/><text style="fill:var(--dg-text)" x="625" y="312" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">stores the park: task id + signal key</text><path style="stroke:var(--dg-new)" d="M851,394 L631,394" fill="none" stroke-width="1.6" marker-end="url(#arrowGreen)"/><text style="fill:var(--dg-text);stroke:var(--dg-bg);paint-order:stroke" x="740" y="386" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle" stroke-width="5" stroke-linejoin="round">harness.signal(taskId, …)</text><path style="stroke:var(--dg-new)" d="M621,440 L381,440" fill="none" stroke-width="1.6" marker-end="url(#arrowGreen)"/><text style="fill:var(--dg-text);stroke:var(--dg-bg);paint-order:stroke" x="500" y="432" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" stroke-width="5" stroke-linejoin="round">runs execute() again, same arguments</text><rect style="fill:var(--dg-card);stroke:var(--dg-white-stroke)" x="277" y="471" width="196" height="30" rx="6" stroke-width="1.2"/><text style="fill:var(--dg-text)" x="375" y="490" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="middle">readSignal(): the answer</text><path style="stroke:var(--dg-text2)" d="M371,532 L121,532" fill="none" stroke-width="1.6" marker-end="url(#arrow)"/><text style="fill:var(--dg-text);stroke:var(--dg-bg);paint-order:stroke" x="245" y="524" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" stroke-width="5" stroke-linejoin="round">returns the answer as its result</text><text style="fill:var(--dg-muted);stroke:var(--dg-bg);paint-order:stroke" x="392" y="384" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" stroke-width="5" stroke-linejoin="round">holds no process, so</text><text style="fill:var(--dg-muted);stroke:var(--dg-bg);paint-order:stroke" x="392" y="400" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="start" stroke-width="5" stroke-linejoin="round">the object can hibernate</text><rect style="fill:var(--dg-tint);stroke:var(--dg-accent)" x="40" y="582" width="14" height="14" rx="3" stroke-width="1.5"/><text style="fill:var(--dg-muted)" x="62" y="594" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">the tool call</text><rect style="fill:var(--dg-blue-fill);stroke:var(--dg-blue-stroke)" x="175.2" y="582" width="14" height="14" rx="3" stroke-width="1.5"/><text style="fill:var(--dg-muted)" x="197.2" y="594" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">your code</text><text style="fill:var(--dg-muted)" x="920" y="594" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="end">green: the wake</text>
