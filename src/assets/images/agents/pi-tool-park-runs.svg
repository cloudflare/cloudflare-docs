<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="960" height="414" viewBox="0 0 960 414" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="dg-title dg-desc">
<title id="dg-title">The same execute() runs twice and takes a different path each time</title>
<desc id="dg-desc">The ask_user tool's execute() code, with two gutters marking which lines each run reaches. Run 1, before the answer: readSignal() returns nothing, the if is skipped, the tool shows the question and returns the tool park. Run 2, after the wake, starts again from the top with the same arguments: readSignal() returns the answer, and the tool returns it as its result, so the question is not shown again.</desc>
<style>
svg { --dg-bg: #FBFBFB; --dg-card: #FFFFFF; --dg-band: #F5F5F5; --dg-line: #E7E7E7; --dg-line2: #D4D4D4; --dg-text: #18181B; --dg-text2: #404040; --dg-muted: #737373; --dg-faint: #A1A1A1; --dg-on-solid: #FFFFFF; --dg-accent: #F6821F; --dg-arrow: #BD6500; --dg-tint: #FFF7ED; --dg-pill: #FFEDD4; --dg-orange-fill: #FFF7ED; --dg-orange-stroke: #F6821F; --dg-orange-ink: #C2410C; --dg-orange-soft: #FED7AA; --dg-orange-mid: #FDBA74; --dg-blue-fill: #EFF6FF; --dg-blue-stroke: #3B82F6; --dg-blue-ink: #1D4ED8; --dg-blue-soft: #BFDBFE; --dg-purple-fill: #FAF5FF; --dg-purple-stroke: #9333EA; --dg-purple-ink: #7E22CE; --dg-purple-soft: #D8B4FE; --dg-green-fill: #ECFDF5; --dg-green-stroke: #059669; --dg-green-ink: #047857; --dg-green-soft: #A7F3D0; --dg-grey-fill: #F5F5F5; --dg-grey-stroke: #737373; --dg-grey-ink: #404040; --dg-light-fill: #FAFAFA; --dg-light-stroke: #A1A1A1; --dg-white-stroke: #18181B; --dg-new: #16A34A; --dg-cellgreen-fill: #F0FDF4; --dg-amber-fill: #FFFBEB; --dg-amber-stroke: #D97706; --dg-amber-soft: #FEF3C7; --dg-red: #DC2626; --dg-red-fill: #FEF2F2; }
@media (prefers-color-scheme: dark) { svg { --dg-bg: #030303; --dg-card: #0F0F0F; --dg-band: #262626; --dg-line: #333333; --dg-line2: #404040; --dg-text: #F5F5F5; --dg-text2: #D4D4D4; --dg-muted: #A1A1A1; --dg-faint: #737373; --dg-on-solid: #030303; --dg-accent: #F6821F; --dg-arrow: #FF8904; --dg-tint: #2A1C0A; --dg-pill: #3B2406; --dg-orange-fill: #2A1C0A; --dg-orange-stroke: #F6821F; --dg-orange-ink: #FDBA74; --dg-orange-soft: #4A2A0A; --dg-orange-mid: #7C3A0A; --dg-blue-fill: #0C1A33; --dg-blue-stroke: #60A5FA; --dg-blue-ink: #93C5FD; --dg-blue-soft: #1E3A5F; --dg-purple-fill: #1D1030; --dg-purple-stroke: #C084FC; --dg-purple-ink: #D8B4FE; --dg-purple-soft: #3B1D5C; --dg-green-fill: #04211A; --dg-green-stroke: #34D399; --dg-green-ink: #6EE7B7; --dg-green-soft: #0B3B2C; --dg-grey-fill: #1A1A1A; --dg-grey-stroke: #8A8A8A; --dg-grey-ink: #D4D4D4; --dg-light-fill: #121212; --dg-light-stroke: #525252; --dg-white-stroke: #E5E5E5; --dg-new: #4ADE80; --dg-cellgreen-fill: #052412; --dg-amber-fill: #261A05; --dg-amber-stroke: #F59E0B; --dg-amber-soft: #3A2A06; --dg-red: #F87171; --dg-red-fill: #2B0D0D; } }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path style="fill:var(--dg-text2)" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path style="fill:var(--dg-new)" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path style="fill:var(--dg-orange-stroke)" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path style="fill:var(--dg-arrow)" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrowFaint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path style="fill:var(--dg-faint)" d="M0,0 L10,5 L0,10 z"/></marker>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect style="fill:var(--dg-grey-fill)" width="8" height="8"/><line style="stroke:var(--dg-faint)" x1="0" y1="0" x2="0" y2="8" stroke-width="3"/></pattern>
</defs>
<rect style="fill:var(--dg-bg)" width="960" height="414" rx="16"/>
<text style="fill:var(--dg-orange-ink)" x="76" y="52" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Run 1</text><text style="fill:var(--dg-muted)" x="76" y="70" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">no answer yet</text><text style="fill:var(--dg-green-ink)" x="176" y="52" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Run 2</text><text style="fill:var(--dg-muted)" x="176" y="70" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">after the wake</text><rect style="fill:var(--dg-card);stroke:var(--dg-line)" x="240" y="90" width="680" height="252" rx="10" stroke-width="1.5"/><text style="fill:var(--dg-text)" x="258" y="120" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start">async execute({ question }, api, context) {</text><text style="fill:var(--dg-text)" x="258" y="148" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start">  const answer = await api.readSignal(Answer, "answer", context);</text><text style="fill:var(--dg-text)" x="258" y="176" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start">  if (answer !== undefined &amp;&amp; "value" in answer) {</text><text style="fill:var(--dg-text)" x="258" y="204" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start">    return { output: [{ type: "text", text: answer.value.text }] };</text><text style="fill:var(--dg-text)" x="258" y="232" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start">  }</text><text style="fill:var(--dg-text)" x="258" y="260" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start">  await showQuestion(api.taskId, question);</text><text style="fill:var(--dg-text)" x="258" y="288" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start">  return { sleep: { signals: [Answer.key("answer")] } };</text><text style="fill:var(--dg-text)" x="258" y="316" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="400" text-anchor="start">}</text><rect style="fill:var(--dg-orange-fill);stroke:var(--dg-orange-stroke)" x="71" y="104" width="10" height="78" rx="5" stroke-width="1.5"/><line style="stroke:var(--dg-orange-stroke)" x1="76" y1="194" x2="76" y2="236" stroke-width="1.5" stroke-dasharray="3 4"/><rect style="fill:var(--dg-orange-fill);stroke:var(--dg-orange-stroke)" x="71" y="244" width="10" height="50" rx="5" stroke-width="1.5"/><circle style="fill:var(--dg-orange-stroke)" cx="76" cy="300" r="5"/><rect style="fill:var(--dg-cellgreen-fill);stroke:var(--dg-new)" x="171" y="104" width="10" height="106" rx="5" stroke-width="1.5"/><circle style="fill:var(--dg-new)" cx="176" cy="216" r="5"/><line style="stroke:var(--dg-faint)" x1="176" y1="222" x2="176" y2="292" stroke-width="1.5" stroke-dasharray="3 4"/><text style="fill:var(--dg-green-ink);stroke:var(--dg-bg);paint-order:stroke" x="904" y="204" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="end" stroke-width="5" stroke-linejoin="round">run 2 returns the result</text><text style="fill:var(--dg-orange-ink);stroke:var(--dg-bg);paint-order:stroke" x="904" y="288" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="end" stroke-width="5" stroke-linejoin="round">run 1 returns the tool park</text><text style="fill:var(--dg-muted)" x="40" y="372" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">Run 2 starts again from the top, with the same arguments. Checking for the answer first is what stops</text><text style="fill:var(--dg-muted)" x="40" y="390" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">it from showing the question twice.</text>
</svg>