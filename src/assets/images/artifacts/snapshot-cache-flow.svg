<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <!-- Cloudflare palette:
         orange #F6821F  orange-dark #C15E1B  orange-light #FBEAD7
         blue   #0051C3  blue-light  #E4EEFB
         ink #1D1D1D  gray #595959  gray-light #F2F2F2 -->
    <marker id="ink" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1D1D1D"/>
    </marker>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0051C3"/>
    </marker>
  </defs>

  <!-- =============== TIMELINE =============== -->
  <text x="250"  y="55" font-size="28" font-weight="800" fill="#1D1D1D" text-anchor="middle">commit 1</text>
  <text x="750"  y="55" font-size="28" font-weight="800" fill="#1D1D1D" text-anchor="middle">commit 2</text>
  <text x="1250" y="55" font-size="28" font-weight="800" fill="#1D1D1D" text-anchor="middle">commit 3</text>

  <!-- dashed timeline arrows -->
  <line x1="10"   y1="130" x2="200"  y2="130" stroke="#1D1D1D" stroke-width="3" stroke-dasharray="11 8" marker-end="url(#ink)"/>
  <line x1="300"  y1="130" x2="700"  y2="130" stroke="#1D1D1D" stroke-width="3" stroke-dasharray="11 8" marker-end="url(#ink)"/>
  <line x1="800"  y1="130" x2="1200" y2="130" stroke="#1D1D1D" stroke-width="3" stroke-dasharray="11 8" marker-end="url(#ink)"/>
  <line x1="1300" y1="130" x2="1490" y2="130" stroke="#1D1D1D" stroke-width="3" stroke-dasharray="11 8" marker-end="url(#ink)"/>

  <!-- commit circles (neutral) -->
  <circle cx="250"  cy="130" r="40" fill="#F2F2F2" stroke="#595959" stroke-width="2"/>
  <circle cx="750"  cy="130" r="40" fill="#F2F2F2" stroke="#595959" stroke-width="2"/>
  <circle cx="1250" cy="130" r="40" fill="#F2F2F2" stroke="#595959" stroke-width="2"/>

  <!-- pnpm-lock.yaml labels between commits -->
  <!-- UNCHANGED between 1 and 2 -->
  <rect x="410" y="62" width="16" height="20" rx="2" fill="#ffffff" stroke="#595959" stroke-width="2"/>
  <path d="M422,62 l0,5 l4,0" fill="none" stroke="#595959" stroke-width="2"/>
  <text x="435" y="78" font-size="21" font-weight="700" fill="#F6821F">pnpm-lock.yaml</text>
  <text x="500" y="102" font-size="19" font-weight="700" fill="#1D1D1D" text-anchor="middle">UNCHANGED</text>

  <!-- CHANGED between 2 and 3 -->
  <rect x="910" y="62" width="16" height="20" rx="2" fill="#ffffff" stroke="#595959" stroke-width="2"/>
  <path d="M922,62 l0,5 l4,0" fill="none" stroke="#595959" stroke-width="2"/>
  <text x="935" y="78" font-size="21" font-weight="700" fill="#F6821F">pnpm-lock.yaml</text>
  <text x="1000" y="102" font-size="19" font-weight="700" fill="#1D1D1D" text-anchor="middle">CHANGED</text>

  <!-- =============== COMMIT 1 : cache MISS (install) =============== -->
  <text x="250" y="200" font-size="20" font-weight="700" fill="#595959" text-anchor="middle">cache key</text>
  <rect x="135" y="213" width="230" height="34" rx="8" fill="#FBEAD7" stroke="#F6821F" stroke-width="2"/>
  <text x="250" y="237" font-size="17" font-weight="700" fill="#C15E1B" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">hash(pnpm-lock.yaml)</text>
  <line x1="250" y1="248" x2="250" y2="322" stroke="#1D1D1D" stroke-width="2.5" stroke-dasharray="3 6" marker-end="url(#ink)"/>
  <text x="228" y="352" font-size="23" font-weight="700" fill="#0051C3" text-anchor="end">Is it cached?</text>
  <circle cx="250" cy="345" r="15" fill="#E4EEFB" stroke="#0051C3" stroke-width="2"/>
  <text x="272" y="352" font-size="23" font-weight="700" fill="#0051C3" text-anchor="start">No</text>
  <!-- install step (orange, active) -->
  <rect x="150" y="380" width="200" height="58" rx="12" fill="#FBEAD7" stroke="#F6821F" stroke-width="2"/>
  <text x="250" y="416" font-size="23" font-weight="700" fill="#C15E1B" text-anchor="middle">Step: install</text>
  <text x="230" y="478" font-size="23" font-weight="700" fill="#0051C3" text-anchor="end">Cache snapshot</text>
  <circle cx="250" cy="470" r="15" fill="#E4EEFB" stroke="#0051C3" stroke-width="2"/>
  <line x1="250" y1="485" x2="250" y2="580" stroke="#1D1D1D" stroke-width="2.5" stroke-dasharray="3 6"/>

  <!-- serve cached snapshot : commit1 snapshot -> commit2 cached node (blue dotted) -->
  <line x1="267" y1="470" x2="733" y2="470" stroke="#0051C3" stroke-width="2.5" stroke-dasharray="3 6" marker-end="url(#blue)"/>

  <!-- =============== COMMIT 2 : cache HIT (skip) =============== -->
  <text x="750" y="200" font-size="20" font-weight="700" fill="#595959" text-anchor="middle">cache key</text>
  <rect x="635" y="213" width="230" height="34" rx="8" fill="#F2F2F2" stroke="#B4B4B4" stroke-width="2"/>
  <text x="750" y="237" font-size="17" font-weight="700" fill="#8A8A8A" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">hash(pnpm-lock.yaml)</text>
  <line x1="750" y1="248" x2="750" y2="322" stroke="#1D1D1D" stroke-width="2.5" stroke-dasharray="3 6" marker-end="url(#ink)"/>
  <text x="728" y="352" font-size="23" font-weight="700" fill="#0051C3" text-anchor="end">Is it cached?</text>
  <circle cx="750" cy="345" r="15" fill="#E4EEFB" stroke="#0051C3" stroke-width="2"/>
  <text x="772" y="352" font-size="23" font-weight="700" fill="#0051C3" text-anchor="start">Yes</text>
  <!-- skipped install step (greyed) — words split so arrow passes between -->
  <rect x="650" y="380" width="200" height="58" rx="12" fill="#F2F2F2" stroke="#D5D5D5" stroke-width="2"/>
  <text x="741" y="416" font-size="23" font-weight="700" fill="#BFBFBF" text-anchor="end">Step:</text>
  <text x="759" y="416" font-size="23" font-weight="700" fill="#BFBFBF" text-anchor="start">install</text>
  <text x="865" y="400" font-size="19" font-weight="700" fill="#8A8A8A">step</text>
  <text x="865" y="422" font-size="19" font-weight="700" fill="#8A8A8A">skipped</text>
  <!-- blue arrow down through skipped step -->
  <line x1="750" y1="360" x2="750" y2="453" stroke="#0051C3" stroke-width="2.5" marker-end="url(#blue)"/>
  <circle cx="750" cy="470" r="15" fill="#E4EEFB" stroke="#0051C3" stroke-width="2"/>
  <text x="775" y="478" font-size="23" font-weight="700" fill="#0051C3" text-anchor="start">Serve cached</text>
  <text x="775" y="503" font-size="23" font-weight="700" fill="#0051C3" text-anchor="start">snapshot</text>
  <line x1="750" y1="485" x2="750" y2="580" stroke="#1D1D1D" stroke-width="2.5" stroke-dasharray="3 6"/>

  <!-- =============== COMMIT 3 : cache MISS (install) =============== -->
  <text x="1250" y="200" font-size="20" font-weight="700" fill="#595959" text-anchor="middle">cache key</text>
  <rect x="1135" y="213" width="230" height="34" rx="8" fill="#FBEAD7" stroke="#F6821F" stroke-width="2"/>
  <text x="1250" y="237" font-size="17" font-weight="700" fill="#C15E1B" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">hash(pnpm-lock.yaml)</text>
  <line x1="1250" y1="248" x2="1250" y2="322" stroke="#1D1D1D" stroke-width="2.5" stroke-dasharray="3 6" marker-end="url(#ink)"/>
  <text x="1228" y="352" font-size="23" font-weight="700" fill="#0051C3" text-anchor="end">Is it cached?</text>
  <circle cx="1250" cy="345" r="15" fill="#E4EEFB" stroke="#0051C3" stroke-width="2"/>
  <text x="1272" y="352" font-size="23" font-weight="700" fill="#0051C3" text-anchor="start">No</text>
  <rect x="1150" y="380" width="200" height="58" rx="12" fill="#FBEAD7" stroke="#F6821F" stroke-width="2"/>
  <text x="1250" y="416" font-size="23" font-weight="700" fill="#C15E1B" text-anchor="middle">Step: install</text>
  <text x="1230" y="478" font-size="23" font-weight="700" fill="#0051C3" text-anchor="end">Cache snapshot</text>
  <circle cx="1250" cy="470" r="15" fill="#E4EEFB" stroke="#0051C3" stroke-width="2"/>
  <line x1="1250" y1="485" x2="1250" y2="580" stroke="#1D1D1D" stroke-width="2.5" stroke-dasharray="3 6"/>
</svg>
