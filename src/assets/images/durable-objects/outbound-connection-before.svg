<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 820 360"><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.label{font-size:12px;font-weight:600;fill:#1a1a1a}.phase,.sublabel{font-size:11px}.sublabel{fill:#6b7280}.phase{font-weight:600;fill:#fff}</style><defs><marker id="time-arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#d1d5db" d="m0 0 8 3-8 3z"/></marker></defs><rect width="820" height="360" fill="#fafafa" rx="8"/><path stroke="#d1d5db" stroke-width="1.5" marker-end="url(#time-arrow)" d="M200 48h520"/><text x="735" y="52" class="sublabel">time</text><text x="40" y="95" class="label">Incoming request</text><rect width="140" height="36" x="200" y="76" fill="#f97316" stroke="#ea580c" rx="4"/><text x="270" y="99" class="phase" text-anchor="middle">processing</text><text x="40" y="155" class="label">Outbound LLM stream</text><path fill="#eff6ff" stroke="#93c5fd" d="M244 136h226v36H244q-4 0-4-4v-28q0-4 4-4z"/><text x="355" y="159" style="font-size:11px;fill:#0369a1" text-anchor="middle">streaming tokens</text><text x="478" y="152" class="label" style="fill:#dc2626">✗</text><text x="496" y="152" class="sublabel" style="fill:#dc2626">stream cut off</text><text x="40" y="215" class="label">Durable Object</text><path fill="#16a34a" stroke="#15803d" d="M204 196h266v36H204q-4 0-4-4v-28q0-4 4-4z"/><text x="270" y="219" class="phase" text-anchor="middle">alive</text><path fill="#fef2f2" stroke="#dc2626" stroke-dasharray="4 3" stroke-width="1.5" d="M340 196h130v36H340z"/><text x="405" y="219" style="font-size:11px;font-weight:600;fill:#dc2626" text-anchor="middle">70-140s idle</text><path stroke="#dc2626" stroke-dasharray="4 3" stroke-width="1.5" d="M470 68v176"/><text x="470" y="262" class="sublabel" style="fill:#dc2626" text-anchor="middle">evicted</text><text x="40" y="295" class="sublabel">The Durable Object is evicted 70-140 seconds after the last incoming request,</text><text x="40" y="310" class="sublabel">cutting off the in-flight LLM stream even though the outbound connection is still open.</text><rect width="740" height="32" x="40" y="318" fill="#f9fafb" stroke="#e5e7eb" rx="6"/><rect width="24" height="14" x="58" y="327" fill="#f97316" stroke="#ea580c" rx="3"/><text x="89" y="338" class="sublabel">Incoming request (keeps object alive)</text><rect width="24" height="14" x="320" y="327" fill="#eff6ff" stroke="#93c5fd" rx="3"/><text x="351" y="338" class="sublabel">Outbound stream (ignored)</text><rect width="24" height="14" x="540" y="327" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="3 2" rx="3"/><text x="571" y="338" class="sublabel">Idle window until eviction</text></svg>