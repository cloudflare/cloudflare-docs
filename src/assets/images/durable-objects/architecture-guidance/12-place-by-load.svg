<svg viewBox="0 0 760 252" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect width="100%" height="100%" fill="#ffffff" /><title id="d13t">Placing by load. Fixed entity-to-shard mappings let hot entities pile onto one shard. Shared shards plus promotion keep load even.</title><desc id="d13d">WRONG: Worker: shard = hash(entity) % 4
       shard 0 holds 3 hot entities; shards 1 and 2 are idle; shard 3 holds 1 quiet entity
       hot entities collide and cannot be moved
RIGHT: Worker + cached placement map (KV)
       → shared:0, shared:1 (many quiet entities each)
       → entity:e7 (dedicated object; promoted from a shared shard when it got hot)</desc><defs><marker id="d13g" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d13o" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d13b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d13p" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#8b8b93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d13r" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#d93636" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d13k" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#1f9d55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs><line x1="380" y1="8" x2="380" y2="96%" stroke="#e4e4e7" stroke-width="1.2"></line><text x="190" y="20" font-size="12.5" font-weight="700" fill="#b42323" text-anchor="middle"><tspan x="190" dy="0">Shards pinned to entities</tspan></text><rect x="90" y="34" width="200" height="46" rx="6" fill="#fdf1e4"></rect><g transform="translate(102 46) scale(0.9166666666666666)" fill="none" stroke="#f6821f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M9.2 3.5h3.1L7 12l5.3 8.5H9.2L3.9 12z"></path><path d="M11.7 3.5h3.1l5.3 8.5-5.3 8.5h-3.1L17 12z"></path></g><text x="207" y="54" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="207" dy="0">Worker</tspan></text><text x="207" y="69" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="207" dy="0">shard = hash(entity) % 4</tspan></text><path d="M190,80 L190,100 L64,100 L64,118" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d13g)"></path><path d="M190,80 L190,100 L152,100 L152,118" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d13g)"></path><path d="M190,80 L190,100 L240,100 L240,118" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d13g)"></path><path d="M190,80 L190,100 L328,100 L328,118" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d13g)"></path><rect x="25" y="120" width="78" height="70" rx="6" fill="#fdecec" stroke="#efb1b1" stroke-width="1.3"></rect><text x="64" y="145" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="64" dy="0">shard 0</tspan></text><text x="64" y="160" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="64" dy="0">3 hot</tspan><tspan x="64" dy="14">entities</tspan></text><rect x="113" y="120" width="78" height="70" rx="6" fill="#fdf1e4"></rect><text x="152" y="152" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="152" dy="0">shard 1</tspan></text><text x="152" y="167" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="152" dy="0">idle</tspan></text><rect x="201" y="120" width="78" height="70" rx="6" fill="#fdf1e4"></rect><text x="240" y="152" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="240" dy="0">shard 2</tspan></text><text x="240" y="167" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="240" dy="0">idle</tspan></text><rect x="289" y="120" width="78" height="70" rx="6" fill="#fdf1e4"></rect><text x="328" y="145" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="328" dy="0">shard 3</tspan></text><text x="328" y="160" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="328" dy="0">1 quiet</tspan><tspan x="328" dy="14">entity</tspan></text><text x="190" y="216" font-size="11" font-weight="400" fill="#b42323" text-anchor="middle"><tspan x="190" dy="0">Hot entities collide while</tspan><tspan x="190" dy="14.3">other shards sit idle</tspan></text><text x="570" y="20" font-size="12.5" font-weight="700" fill="#157a43" text-anchor="middle"><tspan x="570" dy="0">Placed by load</tspan></text><rect x="410" y="34" width="200" height="46" rx="6" fill="#fdf1e4"></rect><g transform="translate(422 46) scale(0.9166666666666666)" fill="none" stroke="#f6821f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M9.2 3.5h3.1L7 12l5.3 8.5H9.2L3.9 12z"></path><path d="M11.7 3.5h3.1l5.3 8.5-5.3 8.5h-3.1L17 12z"></path></g><text x="527" y="54" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="527" dy="0">Worker</tspan></text><text x="527" y="69" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="527" dy="0">cached placement lookup</tspan></text><rect x="640" y="34" width="100" height="46" rx="6" fill="#fdf1e4"></rect><text x="690" y="54" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="690" dy="0">KV</tspan></text><text x="690" y="69" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="690" dy="0">placement map</tspan></text><path d="M611,57 L638,57" fill="none" stroke="#8b8b93" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d13p)" marker-start="url(#d13p)"></path><path d="M510,80 L510,100 L457,100 L457,118" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d13g)"></path><path d="M510,80 L510,100 L572,100 L572,118" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d13g)"></path><path d="M510,80 L510,100 L690,100 L690,118" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d13g)"></path><rect x="405" y="120" width="105" height="70" rx="6" fill="#fdf1e4"></rect><text x="457.5" y="145" font-size="12" font-weight="700" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="457.5" dy="0">shared:0</tspan></text><text x="457.5" y="160" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="457.5" dy="0">many quiet</tspan><tspan x="457.5" dy="14">entities</tspan></text><rect x="520" y="120" width="105" height="70" rx="6" fill="#fdf1e4"></rect><text x="572.5" y="145" font-size="12" font-weight="700" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="572.5" dy="0">shared:1</tspan></text><text x="572.5" y="160" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="572.5" dy="0">many quiet</tspan><tspan x="572.5" dy="14">entities</tspan></text><rect x="635" y="120" width="110" height="70" rx="6" fill="#fdf1e4"></rect><text x="690" y="145" font-size="12" font-weight="700" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="690" dy="0">entity:e7</tspan></text><text x="690" y="160" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><t