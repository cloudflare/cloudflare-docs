<svg viewBox="0 0 760 118" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect width="100%" height="100%" fill="#ffffff" /><title id="d4t">Anatomy of a compound Durable Object name. The stable atom key comes first and the scale-out dimension comes last.</title><desc id="d4d">Name: stream:7:v2:shard:5
  stream     = class or type prefix
  7         = atom ID
  v2        = layout version (bump it before changing the shard count)
  shard:5  = scale-out dimension (shard or region), always last</desc><defs><marker id="d4g" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="stream" stroke-linejoin="stream"></path></marker><marker id="d4o" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="stream" stroke-linejoin="stream"></path></marker><marker id="d4b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="stream" stroke-linejoin="stream"></path></marker><marker id="d4p" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#8b8b93" stroke-width="1.8" stroke-linecap="stream" stroke-linejoin="stream"></path></marker><marker id="d4r" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#d93636" stroke-width="1.8" stroke-linecap="stream" stroke-linejoin="stream"></path></marker><marker id="d4k" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#1f9d55" stroke-width="1.8" stroke-linecap="stream" stroke-linejoin="stream"></path></marker></defs><rect x="193" y="22" width="85" height="46" rx="6" fill="#fdf1e4"></rect><text x="235.5" y="51" font-size="18" font-weight="600" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="235.5" dy="0">stream</tspan></text><line x1="235.5" y1="70" x2="235.5" y2="84" stroke="#8b8b93" stroke-width="1.2"></line><text x="235.5" y="100" font-size="11.5" font-weight="600" fill="#55555c" text-anchor="middle"><tspan x="235.5" dy="0">class / type</tspan></text><text x="291" y="52" font-size="20" font-weight="700" fill="#55555c" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="291" dy="0">:</tspan></text><rect x="304" y="22" width="41" height="46" rx="6" fill="#fdf1e4"></rect><text x="324.5" y="51" font-size="18" font-weight="600" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="324.5" dy="0">7</tspan></text><line x1="324.5" y1="70" x2="324.5" y2="84" stroke="#8b8b93" stroke-width="1.2"></line><text x="324.5" y="100" font-size="11.5" font-weight="600" fill="#55555c" text-anchor="middle"><tspan x="324.5" dy="0">atom ID</tspan></text><text x="358" y="52" font-size="20" font-weight="700" fill="#55555c" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="358" dy="0">:</tspan></text><rect x="371" y="22" width="52" height="46" rx="6" fill="#fdf1e4"></rect><text x="397" y="51" font-size="18" font-weight="600" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="397" dy="0">v2</tspan></text><line x1="397" y1="70" x2="397" y2="84" stroke="#8b8b93" stroke-width="1.2"></line><text x="397" y="100" font-size="11.5" font-weight="600" fill="#55555c" text-anchor="middle"><tspan x="397" dy="0">layout version</tspan></text><text x="436" y="52" font-size="20" font-weight="700" fill="#55555c" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="436" dy="0">:</tspan></text><rect x="449" y="22" width="118" height="46" rx="6" fill="#fde3c8"></rect><text x="508" y="51" font-size="18" font-weight="600" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="508" dy="0">shard:5</tspan></text><line x1="508" y1="70" x2="508" y2="84" stroke="#8b8b93" stroke-width="1.2"></line><text x="508" y="100" font-size="11.5" font-weight="600" fill="#55555c" text-anchor="middle"><tspan x="508" dy="0">shard or region</tspan></text></svg>
