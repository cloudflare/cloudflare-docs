<svg viewBox="0 0 760 345" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect width="100%" height="100%" fill="#ffffff" /><title id="d1t">Workers are the stateless control plane. They route each request by name to the Durable Object that owns that atom of state.</title><desc id="d1d">Clients (browsers, mobile apps, webhooks and APIs)
  → Worker (stateless control plane, runs everywhere)
      does: authentication, validation, routing by name, registry reads and writes
      ↔ D1: registry of atoms (list and query across atoms)
      ↔ KV: read-heavy configuration
  → getByName("&lt;class&gt;:&lt;id&gt;") → one Durable Object per atom (data plane)
      examples: room:lobby, room:42, doc:a1b2, doc:c3d4, session:91, … millions, mostly hibernated
      each object: one thread, one location, its own SQLite database and WebSockets</desc><defs><marker id="d1g" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d1o" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d1b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d1p" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#8b8b93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d1r" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#d93636" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d1k" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#1f9d55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs><rect x="185" y="28" width="230" height="305" rx="10" fill="#ffffff" fill-opacity="0.7" stroke="#c8c8ce" stroke-width="1.2" stroke-dasharray="6 4"></rect><rect x="445" y="28" width="300" height="305" rx="10" fill="#ffffff" fill-opacity="0.7" stroke="#c8c8ce" stroke-width="1.2" stroke-dasharray="6 4"></rect><rect x="20" y="72" width="130" height="44" rx="6" fill="#f4f4f5"></rect><text x="85" y="98" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="85" dy="0">Browsers</tspan></text><rect x="20" y="137" width="130" height="44" rx="6" fill="#f4f4f5"></rect><text x="85" y="163" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="85" dy="0">Mobile apps</tspan></text><rect x="20" y="202" width="130" height="44" rx="6" fill="#f4f4f5"></rect><text x="85" y="228" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="85" dy="0">Webhooks · APIs</tspan></text><path d="M150,94 L203,94" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d1g)"></path><path d="M150,159 L203,159" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d1g)"></path><path d="M150,224 L203,224" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d1g)"></path><rect x="205" y="52" width="190" height="196" rx="6" fill="#fdf1e4"></rect><g transform="translate(285 81) scale(1.25)" fill="none" stroke="#f6821f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M9.2 3.5h3.1L7 12l5.3 8.5H9.2L3.9 12z"></path><path d="M11.7 3.5h3.1l5.3 8.5-5.3 8.5h-3.1L17 12z"></path></g><text x="300" y="131" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="300" dy="0">Worker (stateless)</tspan></text><text x="300" y="146" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="300" dy="0">runs everywhere</tspan><tspan x="300" dy="14"></tspan><tspan x="300" dy="14">authentication</tspan><tspan x="300" dy="14">validation</tspan><tspan x="300" dy="14">routing by name</tspan><tspan x="300" dy="14">registry reads and writes</tspan></text><rect x="205" y="278" width="90" height="46" rx="6" fill="#fdf1e4"></rect><text x="250" y="298" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="250" dy="0">D1</tspan></text><text x="250" y="313" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="250" dy="0">registry</tspan></text><rect x="305" y="278" width="90" height="46" rx="6" fill="#fdf1e4"></rect><g transform="translate(317 290) scale(0.9166666666666666)" fill="none" stroke="#f6821f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><ellipse cx="12" cy="5.8" rx="7.5" ry="2.8"></ellipse><path d="M4.5 5.8v12.4c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V5.8M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"></path></g><text x="367" y="298" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="367" dy="0">KV</tspan></text><text x="367" y="313" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="367" dy="0">config</tspan></text><path d="M250,249 L250,276" fill="none" stroke="#8b8b93" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d1p)" marker-start="url(#d1p)"></path><path d="M350,249 L350,276" fill="none" stroke="#8b8b93" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d1p)" marker-start="url(#d1p)"></path><path d="M396,151 L430,151 L430,86 L466,86" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d1g)"></path><path d="M396,151 L466,151" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d1g)"></path><path d="M396,151 L430,151 L430,216 L466,216" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d1g)"></path><text x="401" y="170" font-size="11" font-weight="600" fill="#1f1f22" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="401" dy="0">by name</tspan></text><rect x="468" y="62" width="125" height="48" rx="6" fill="#fdf1e4"></rect><text x="530.5" y="83" font-size="12" font-weight="700" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="530.5" dy="0">room:lobby</tspan></text><text x="530.5" y="98" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="530.5" dy="0">SQLite · sockets</tspan></text><rect x="605" y="62" width="125" height="48" rx="6" fill="#fdf1e4"></rect><text x="667.5" y="83" font-size="12" font-weight="700" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="667.5" dy="0">room:42</tspan></text><text x="667.5" y="98" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="667.5" dy="0">SQLite · sockets</tspan></text><rect x="468" y="127" width="125" height="48" rx="6" fill="#fdf1e4"></rect><text x="530.5" y="148" font-size="12" font-weight="700" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="530.5" dy="0">doc:a1b2</tspan></text><text x="530.5" y="163" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="530.5" dy="0">SQLite · sockets</tspan></text><rect x="605" y="127" width="125" height="48" rx="6" fill="#fdf1e4"></rect><text x="667.5" y="148" font-size="12" font-weight="700" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="667.5" dy="0">doc:c3d4</tspan></text><text x="667.5" y="163" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="667.5" dy="0">SQLite · sockets</tspan></text><rect x="468" y="192" width="125" height="48" rx="6" fill="#fdf1e4"></rect><text x="530.5" y="213" font-size="12" font-weight="700" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="530.5" dy="0">session:91</tspan></text><text x="530.5" y="228" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="530.5" dy="0">SQLite · sockets</tspan></text><rect x="605" y="192" width="125" height="48" rx="6" fill="#ffffff" stroke="#b9b9c0" stroke-width="1.3" stroke-dasharray="5 4"></rect><text x="667.5" y="213" font-size="12" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="667.5" dy="0">…millions</tspan></text><text x="667.5" y="228" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="667.5" dy="0">mostly hibernated</tspan></text><text x="595" y="272" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="595" dy="0">Each object: one thread, one location,</tspan><tspan x="595" dy="14.3">its own storage. Idle objects hibernate.</tspan></text><rect x="197" y="19" width="160.21" height="18" rx="9" fill="#ffffff" stroke="#c8c8ce" stroke-width="1"></rect><text x="277.105" y="31.5" font-size="9.5" font-weight="700" fill="#62626a" text-anchor="middle" letter-spacing="0.07em"><tspan x="277.105" dy="0">CONTROL PLANE · WORKERS</tspan></text><rect x="457" y="19" width="216.64000000000001" height="18" rx="9" fill="#ffffff" stroke="#c8c8ce" stroke-width="1"></rect><text x="565.32" y="31.5" font-size="9.5" font-weight="700" fill="#62626a" text-anchor="middle" letter-spacing="0.07em"><tspan x="565.32" dy="0">DATA PLANE · ONE OBJECT PER ATOM</tspan></text></svg>
