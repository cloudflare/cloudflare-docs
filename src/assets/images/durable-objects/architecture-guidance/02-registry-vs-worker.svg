<svg viewBox="0 0 760 336" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect width="100%" height="100%" fill="#ffffff" /><title id="d17t">Left: a registry object becomes a global bottleneck and a single point of failure. Right: the Worker owns the control plane, and data traffic goes directly to each object.</title><desc id="d17d">WRONG: clients → Worker → registry Durable Object (auth, lookup, list, route) → doc:1 | doc:2 | doc:3
       every request queues on one thread, in one location
RIGHT: clients → Worker (auth, route by name) ↔ D1 (registry), KV (config)
       Worker → doc:1 | doc:2 | doc:3 directly
       control requests hit D1 and KV; data requests go straight to the object</desc><defs><marker id="d17g" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d17o" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d17b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d17p" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#8b8b93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d17r" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#d93636" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d17k" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#1f9d55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs><line x1="380" y1="8" x2="380" y2="96%" stroke="#e4e4e7" stroke-width="1.2"></line><text x="190" y="22" font-size="12.5" font-weight="700" fill="#b42323" text-anchor="middle"><tspan x="190" dy="0">Registry Durable Object on the request path</tspan></text><text x="570" y="22" font-size="12.5" font-weight="700" fill="#157a43" text-anchor="middle"><tspan x="570" dy="0">Workers as the control plane</tspan></text><circle cx="116" cy="48" r="4.2" fill="#a1a1aa"></circle><circle cx="132" cy="48" r="4.2" fill="#a1a1aa"></circle><circle cx="148" cy="48" r="4.2" fill="#a1a1aa"></circle><circle cx="164" cy="48" r="4.2" fill="#a1a1aa"></circle><circle cx="180" cy="48" r="4.2" fill="#a1a1aa"></circle><circle cx="196" cy="48" r="4.2" fill="#a1a1aa"></circle><circle cx="212" cy="48" r="4.2" fill="#a1a1aa"></circle><circle cx="228" cy="48" r="4.2" fill="#a1a1aa"></circle><circle cx="244" cy="48" r="4.2" fill="#a1a1aa"></circle><path d="M180,56 L180,73" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d17g)"></path><rect x="60" y="75" width="240" height="36" rx="6" fill="#fdf1e4"></rect><g transform="translate(72 82) scale(0.9166666666666666)" fill="none" stroke="#f6821f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M9.2 3.5h3.1L7 12l5.3 8.5H9.2L3.9 12z"></path><path d="M11.7 3.5h3.1l5.3 8.5-5.3 8.5h-3.1L17 12z"></path></g><text x="197" y="97" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="197" dy="0">Worker</tspan></text><path d="M180,111 L180,138" fill="none" stroke="#d93636" stroke-width="3" stroke-linejoin="round" marker-end="url(#d17r)"></path><rect x="60" y="140" width="240" height="52" rx="6" fill="#fdecec" stroke="#efb1b1" stroke-width="1.3"></rect><text x="180" y="163" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="180" dy="0">Registry Durable Object</tspan></text><text x="180" y="178" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="180" dy="0">auth · lookup · list · route</tspan></text><path d="M180,192 L180,216 L75,216 L75,238" fill="none"