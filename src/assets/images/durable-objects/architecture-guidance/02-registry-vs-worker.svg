<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Separate administrative and resource request paths</title>
<desc id="diagram-desc">Both designs contain a request Worker, one account control Durable Object, and three separate document Durable Objects named doc:1, doc:2, and doc:3. On the coupled path, every document request passes through the account control object. On the separated path, an administrative Worker updates the account control object, which publishes configuration through KV or R2. The request Worker reads that configuration and routes directly to the selected document object. Workers use the Workers logo; every Durable Object has its own Durable Objects icon and box.</desc>
