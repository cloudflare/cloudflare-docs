<svg viewBox="0 0 760 322" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect width="100%" height="100%" fill="#ffffff" /><title id="d11t">Fan-out tree. Keep the topic hub as the atom, and add leaf objects beneath it when one topic outgrows a single object.</title><desc id="d11d">Origin → topic:feed:weur (relay; still exactly one upstream link per region)
  → topic:feed:weur:leaf:0 → capped share of client sockets
  → topic:feed:weur:leaf:1 → capped share of client sockets
  → topic:feed:weur:leaf:2 → capped share of client sockets
  → topic:feed:weur:leaf:3 → capped share of client sockets
Add leaves only for topics above a threshold.</desc><defs><marker id="d11g" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d11o" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d11b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d11p" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#8b8b93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d11r" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#d93636" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d11k" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#1f9d55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs><rect x="300" y="14" width="160" height="44" rx="6" fill="#f4f4f5"></rect><text x="380" y="40" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><