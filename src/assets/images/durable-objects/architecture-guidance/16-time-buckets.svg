<rect width="100%" height="100%" fill="#ffffff" /><title id="d15t">Time buckets. Append-only data rolls over to a new object each period, so no single object grows without bound.</title><desc id="d15d">Worker: bucket = yyyy-mm → audit:acme:2026-11 (hot, receives all new writes)
