<svg viewBox="0 0 760 298" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect width="100%" height="100%" fill="#ffffff" /><title id="d12t">Hash-sharded ingest. Hashing event IDs distributes events across shards and routes retries to the same shard for local deduplication.</title><desc id="d12d">event A        → Worker: shard = hash(eventId) % shardCount → shard:5 → accepted
event B        → Worker → shard:6 → accepted
event A retry  → Worker → shard:5 → duplicate detected by UNIQUE(event_id)
Same key → same shard, every time: deduplication is a local SQLite constraint.</desc><defs><marker id="d12g" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d12o" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d12b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d12p" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#8b8b93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d12r" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#d93636" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d12k" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#1f9d55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs><rect x="110" y="14" width="120" height="32" rx="6" fill="#f4f4f5"></rect><text x="170" y="34" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="170" dy="0">event A</tspan></text><rect x="320" y="14" width="120" height="32" rx="6" fill="#f4f4f5"></rect><text x="380" y="34" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="380" dy="0">event B</tspan></text><rect x="530" y="14" width="140" height="32" rx="6" fill="#f4f4f5"></rect><text x="600" y="34" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="600" dy="0">event A (retry)</tspan></text><path d="M170,46 L170,95 L228,95" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d12g)"></path><path d="M380,46 L380,70" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d12g)"></path><path d="M600,46 L600,95 L532,95" fill="none" stroke="#d93636" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#d12r)"></path><rect x="230" y="72" width="300" height="46" rx="6" fill="#fdf1e4"></rect><g transform="translate(242 84) scale(0.9166666666666666)" fill="none" stroke="#f6821f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M9.2 3.5h3.1L7 12l5.3 8.5H9.2L3.9 12z"></path><path d="M11.7 3.5h3.1l5.3 8.5-5.3 8.5h-3.1L17 12z"></path></g><text x="397" y="92" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="397" dy="0">Worker</tspan></text><text x="397" y="107" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="397" dy="0">shard = hash(eventId) % shardCount</tspan></text><path d="M300,118 L300,140 L110,140 L110,170" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d12o)"></path><text x="205" y="132" font-size="11" font-weight="600" fill="#1f1f22" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="205" dy="0">A → 5</tspan></text><path d="M380,118 L380,152 L290,152 L290,170" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d12o)"></path><text x="388" y="140" font-size="11" font-weight="600" fill="#1f1f22" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="388" dy="0">B → 6</tspan></text><path d="M460,118 L460,162 L150,162 L150,170" fill="none" stroke="#d93636" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#d12r)"></path><text x="468" y="150" font-size="11" font-weight="600" fill="#d93636" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="468" dy="0">A retry → 5</tspan></text><rect x="30" y="172" width="160" height="58" rx="6" fill="#fdf1e4"></rect><g transform="translate(42 190) scale(0.9166666666666666)" fill="none" stroke="#f6821f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12.6 3.1v17.8M3.4 9.4h9.2M3.4 14.6h9.2"></path><circle cx="16.6" cy="7.6" r="1.2" fill="#f6821f" stroke="none"></circle><circle cx="17.6" cy="12" r="1.2" fill="#f6821f" stroke="none"></circle><circle cx="16.6" cy="16.4" r="1.2" fill="#f6821f" stroke="none"></circle></g><text x="127" y="198" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="127" dy="0">shard:5</tspan></text><text x="127" y="213" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="127" dy="0">UNIQUE(event_id)</tspan></text><rect x="210" y="172" width="160" height="58" rx="6" fill="#fdf1e4"></rect><g transform="translate(222 190) scale(0.9166666666666666)" fill="none" stroke="#f6821f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12.6 3.1v17.8M3.4 9.4h9.2M3.4 14.6h9.2"></path><circle cx="16.6" cy="7.6" r="1.2" fill="#f6821f" stroke="none"></circle><circle cx="17.6" cy="12" r="1.2" fill="#f6821f" stroke="none"></circle><circle cx="16.6" cy="16.4" r="1.2" fill="#f6821f" stroke="none"></circle></g><text x="307" y="198" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="307" dy="0">shard:6</tspan></text><text x="307" y="213" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="307" dy="0">UNIQUE(event_id)</tspan></text><rect x="390" y="172" width="160" height="58" rx="6" fill="#fdf1e4"></rect><g transform="translate(402 190) scale(0.9166666666666666)" fill="none" stroke="#f6821f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12.6 3.1v17.8M3.4 9.4h9.2M3.4 14.6h9.2"></path><circle cx="16.6" cy="7.6" r="1.2" fill="#f6821f" stroke="none"></circle><circle cx="17.6" cy="12" r="1.2" fill="#f6821f" stroke="none"></circle><circle cx="16.6" cy="16.4" r="1.2" fill="#f6821f" stroke="none"></circle></g><text x="487" y="198" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="487" dy="0">shard:7</tspan></text><text x="487" y="213" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="487" dy="0">UNIQUE(event_id)</tspan></text><text x="650" y="205" font-size="12" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="650" dy="0">… more shards</tspan></text><text x="110" y="252" font-size="11" font-weight="600" fill="#b42323" text-anchor="middle"><tspan x="110" dy="0">Retry of event A is detected</tspan></text><text x="380" y="284" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="380" dy="0">Same key, same shard, every time: deduplication is a local SQLite constraint</tspan></text></svg>
