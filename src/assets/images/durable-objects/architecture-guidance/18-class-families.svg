<svg viewBox="0 0 760 258" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect width="100%" height="100%" fill="#ffffff" /><title id="d18t">Splitting Workers by class family. Deploying a Worker resets its Durable Objects, so one script for every class turns each deploy into a platform-wide reconnect.</title><desc id="d18d">WRONG: one Worker script = control plane + every class (Runs, Shards, Timers, Tenants)
       every deploy resets every object; all clients reconnect at once
RIGHT: Family A Worker (Runs, Steps) | Family B Worker (Shards, Timers) | Family C Worker (Tenants, Index)
       deploying Family B resets only Shards and Timers; other objects keep running</desc><defs><marker id="d18g" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d18o" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d18b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d18p" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#8b8b93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d18r" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#d93636" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d18k" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#1f9d55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs><line x1="380" y1="8" x2="380" y2="96%" stroke="#e4e4e7" stroke-width="1.2"></line><text x="190" y="20" font-size="12.5" font-weight="700" fill="#b42323" text-anchor="middle"><tspan x="190" dy="0">One Worker for every class</tspan></text><rect x="20" y="40" width="340" height="166" rx="10" fill="#ffffff" fill-opacity="0.7" stroke="#c8c8ce" stroke-width="1.2" stroke-dasharray="6 4"></rect><rect x="40" y="60" width="300" height="42" rx="6" fill="#fdf1e4"></rect><g transform="translate(52 70) scale(0.9166666666666666)" fill="none" stroke="#f6821f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M9.2 3.5h3.1L7 12l5.3 8.5H9.2L3.9 12z"></path><path d="M11.7 3.5h3.1l5.3 8.5-5.3 8.5h-3.1L17 12z"></path></g><text x="207" y="78" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="207" dy="0">Control-plane Worker</tspan></text><text x="207" y="93" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="207" dy="0">API · routing · every class</tspan></text><rect x="40" y="124" width="70" height="60" rx="6" fill="#fdecec" stroke="#efb1b1" stroke-width="1.3"></rect><text x="75" y="151" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="75" dy="0">Runs</tspan></text><text x="75" y="166" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="75" dy="0">reset</tspan></text><rect x="116" y="124" width="70" height="60" rx="6" fill="#fdecec" stroke="#efb1b1" stroke-width="1.3"></rect><text x="151" y="151" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="151" dy="0">Shards</tspan></text><text x="151" y="166" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="151" dy="0">reset</tspan></text><rect x="192" y="124" width="70" height="60" rx="6" fill="#fdecec" stroke="#efb1b1" stroke-width="1.3"></rect><text x="227" y="151" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="227" dy="0">Timers</tspan></text><text x="227" y="166" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x=