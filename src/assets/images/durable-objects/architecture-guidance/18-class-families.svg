ill="#55555c" text-anchor="middle"><tspan x="567.5" dy="0">deployed</tspan></text><rect x="522" y="112" width="91" height="38" rx="6" fill="#fdecec" stroke="#efb1b1" stroke-width="1.3"></rect><text x="567.5" y="128" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="567.5" dy="0">Shards</tspan></text><text x="567.5" y="143" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="567.5" dy="0">reset</tspan></text><rect x="522" y="158" width="91" height="38" rx="6" fill="#fdecec" stroke="#efb1b1" stroke-width="1.3"></rect><text x="567.5" y="174" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="567.5" dy="0">Timers</tspan></text><text x="567.5" y="189" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="567.5" dy="0">reset</tspan></text><rect x="629" y="40" width="111" height="166" rx="10" fill="#ffffff" fill-opacity="0.7" stroke="#c8c8ce" stroke-width="1.2" stroke-dasharray="6 4"></rect><rect x="639" y="60" width="91" height="40" rx="6" fill="#fdf1e4"></rect><text x="684.5" y="84" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="684.5" dy="0">Worker</tspan></text><rect x="639" y="112" width="91" height="38" rx="6" fill="#fdf1e4"></rect><text x="684.5" y="135" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="684.5" dy="0">Tenants</tspan></text><rect x="639" y="158" width="91" height="38" rx="6" fill="#fdf1e4"></rect><text x="684.5" y="181" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="684.5" dy="0">Index</tspan></text><text x="570" y="232" font-size="11" font-weight="400" fill="#157a43" text-anchor="middle"><tspan x="570" dy="0">A deploy resets only its own family;</tspan><tspan x="570" dy="14.3">other objects keep running</tspan></text><rect x="32" y="31" width="122.59" height="18" rx="9" fill="#ffffff" stroke="#c8c8ce" stroke-width="1"></rect><text x="93.295" y="43.5" f