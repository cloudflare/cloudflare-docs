<rect x="505" y="205" width="200" height="62" rx="9" fill="#ffffff" stroke="#b6c7e0" stroke-width="1.5" /><use href="#icon-durable-objects" x="515" y="217" width="33" height="33" fill="#f6821f" color="#f6821f"/><text x="559" y="231" font-size="15" font-weight="600" text-anchor="start" fill="#1d2939">Run</text><text x="559" y="251" font-size="12" font-weight="400" text-anchor="start" fill="#475467">DO class</text>
<rect x="505" y="285" width="200" height="62" rx="9" fill="#ffffff" stroke="#b6c7e0" stroke-width="1.5" /><use href="#icon-durable-objects" x="515" y="297" width="33" height="33" fill="#f6821f" color="#f6821f"/><text x="559" y="311" font-size="15" font-weight="600" text-anchor="start" fill="#1d2939">Step</text><text x="559" y="331" font-size="12" font-weight="400" text-anchor="start" fill="#475467">DO class</text>
