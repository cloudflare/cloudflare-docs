<rect x="245" y="285" width="165" height="62" rx="9" fill="#ffffff" stroke="#b6c7e0" stroke-width="1.5" /><use href="#icon-durable-objects" x="255" y="297" width="33" height="33" fill="#f6821f" color="#f6821f"/><text x="299" y="311" font-size="15" font-weight="600" text-anchor="start" fill="#1d2939">Timer</text><text x="299" y="331" font-size="12" font-weight="400" text-anchor="start" fill="#475467">DO class</text>
<rect x="245" y="365" width="165" height="62" rx="9" fill="#ffffff" stroke="#b6c7e0" stroke-width="1.5" /><use href="#icon-durable-objects" x="255" y="377" width="33" height="33" fill="#f6821f" color="#f6821f"/><text x="299" y="391" font-size="15" font-weight="600" text-anchor="start" fill="#1d2939">Index</text><text x="299" y="411" font-size="12" font-weight="400" text-anchor="start" fill="#475467">DO class</text>
<text x="235" y="510" font-size="15" font-weight="400" text-anchor="middle" fill="#475467">One update can affect objects across every class</text>
