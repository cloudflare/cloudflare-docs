<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 610" font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Independent class-family deployments</title>
<desc id="diagram-desc">Worker logos and outer boxes identify deployment boundaries. Durable Objects icons identify exported classes inside those boundaries, not separate Workers. The shared Worker exports Run, Step, Shard, Timer, Account, and Index classes. Independent Workers export the same classes in pairs: A defines Run and Step, B defines Shard and Timer, and C defines Account and Index. Updating only Worker B can reset objects in its classes under the immediate update strategy, without updating objects defined in A or C. Default deferred updates may avoid a reset. Control-plane and data-plane roles do not determine deployment boundaries.</desc>
<defs>
<symbol id="icon-workers" viewBox="0 0 48 49"><path d="m18.63 37.418-9.645-12.9 9.592-12.533-1.852-2.527L5.917 23.595l-.015 1.808 10.86 14.542z"/><path d="M21.997 6.503h-3.712l13.387 18.3-13.072 17.7h3.735L35.4 24.81z"/><path d="M29.175 6.503h-3.758l13.598 18.082-13.598 17.918h3.765l12.908-17.01v-1.808z"/></symbol>
<symbol id="icon-durable-objects" viewBox="0 0 64 64"><path fill="currentColor" fill-rule="evenodd" d="M32.214 6h-.202a26 26 0 1 0 .327 52q.266 0 .527-.014A26 26 0 0 0 58.012 32 26 26 0 0 0 32.865 6.014a10 10 0 0 0-.65-.013m-9.503 6.063A22 22 0 0 0 10.104 30h7.804q.068-1.79.252-3.51l3.998.24A46 46 0 0 0 21.91 30H30V10.519c-1.784.81-3.475 2.582-4.9 5.41q-.139.278-.274.567l-3.873-1.145q.276-.627.575-1.221c.363-.72.757-1.412 1.182-2.067M30 34h-8.09c.226 5.584 1.392 10.5 3.19 14.071 1.425 2.829 3.116 4.6 4.9 5.41zm-7.29 17.937a22 22 0 0 1-1.182-2.067c-2.131-4.233-3.393-9.795-3.62-15.87h-7.806A22 22 0 0 0 22.71 51.937m19.554-.472A22 22 0 0 0 53.921 34h-7.15a51 51 0 0 1-.26 3.589l-3.998-.24q.185-1.627.255-3.349H34v19.742c2.032-.641 3.973-2.486 5.577-5.671q.129-.255.252-.517l3.874 1.145q-.267.6-.553 1.171a23 23 0 0 1-.885 1.595M42.768 30H34V10.258c2.032.641 3.973 2.486 5.577 5.671 1.799 3.572 2.965 8.487 3.191 14.071m4.003 0c-.227-6.075-1.49-11.637-3.621-15.87a22 22 0 0 0-.885-1.595A22 22 0 0 1 53.921 30z" clip-rule="evenodd"/></symbol>
<symbol id="icon-kv" viewBox="0 0 64 64"><path fill="currentColor" d="M22 44.95h-7v-4h7zm-7-8h7v-4h-7zm7-8h-7v-4h7zm4 16h23v-4H26zm23-8H26v-4h23zm-23-8h23v-4H26z"/><path fill="currentColor" fill-rule="evenodd" d="m6 12 2-2h19l1.675.907 3.408 5.225H56l2 2V52l-2 2H8l-2-2zm4 2v36h44V20.132H31l-1.675-.908L25.917 14z" clip-rule="evenodd"/></symbol>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5577a5"/></marker>
</defs>
