<svg viewBox="0 0 760 362" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect width="100%" height="100%" fill="#ffffff" /><title id="d16t">Choosing a scale-out technique for a hot Durable Object. Identify the limiting resource, then add the matching shards or layers.</title><desc id="d16d">Does one object need more capacity?
  no  → stop: one object per atom
  yes → which resource?
        broadcast or socket count → fan-out tree
        write rate                → hash shards
        storage growth            → time buckets or child objects
        mixed workloads           → split by responsibility
Before choosing smaller units, consider upstream connections and hot keys.</desc><defs><marker id="d16g" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d16o" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d16b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d16p" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#8b8b93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d16r" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#d93636" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d16k" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#1f9d55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs><rect x="250" y="10" width="260" height="46" rx="6" fill="#f4f4f5"></rect><text x="380" y="37" font-size="12.5" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="380" dy="0">Does one object need more capacity?</tspan></text><rect x="570" y="10" width="170" height="46" rx="6" fill="#e9f6ee" stroke="#a9dcb8" stroke-width="1.3"></rect><text x="655" y="30" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="655" dy="0">Stop here</tspan></text><text x="655" y="45" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="655" dy="0">one object per atom</tspan></text><path d="M511,33 L568,33" fill="none" stroke="#1f9d55" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d16k)"></path><text x="539.5" y="25" font-size="11" font-weight="600" fill="#1f9d55" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="539.5" dy="0">no</tspan></text><path d="M380,56 L380,90" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d16g)"></path><text x="392" y="77" font-size="11" font-weight="600" fill="#1f1f22" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="392" dy="0">yes</tspan></text><rect x="280" y="92" width="200" height="40" rx="6" fill="#f4f4f5"></rect><text x="380" y="116" font-size="12.5" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="380" dy="0">Which resource?</tspan></text><path d="M380,132 L380,160 L97,160 L97,186" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d16g)"></path><path d="M380,132 L380,160 L284,160 L284,186" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d16g)"></path><path d="M380,132 L380,160 L471,160 L471,186" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d16g)"></path><path d="M380,132 L380,160 L658,160 L658,186" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d16g)"></path><rect x="10" y="188" width="175" height="70" rx="6" fill="#fdf1e4"></rect><text x="97.5" y="220" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="97.5" dy="0">Broadcast · sockets</tspan></text><text x="97.5" y="235" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="97.5" dy="0">→ fan-out tree</tspan></text><rect x="197" y="188" width="175" height="70" rx="6" fill="#fdf1e4"></rect><text x="284.5" y="220" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="284.5" dy="0">Write rate</tspan></text><text x="284.5" y="235" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="284.5" dy="0">→ hash shards</tspan></text><rect x="384" y="188" width="175" height="70" rx="6" fill="#fdf1e4"></rect><text x="471.5" y="213" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="471.5" dy="0">Storage growth</tspan></text><text x="471.5" y="228" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="471.5" dy="0">→ time buckets or</tspan><tspan x="471.5" dy="14">child objects</tspan></text><rect x="571" y="188" width="175" height="70" rx="6" fill="#fdf1e4"></rect><text x="658.5" y="213" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="658.5" dy="0">Mixed workloads</tspan></text><text x="658.5" y="228" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="658.5" dy="0">→ split by</tspan><tspan x="658.5" dy="14">responsibility</tspan></text><rect x="130" y="290" width="500" height="56" rx="6" fill="#fdecec" stroke="#efb1b1" stroke-width="1.3"></rect><text x="380" y="315" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="380" dy="0">Before choosing smaller units, check the tradeoffs</tspan></text><text x="380" y="330" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="380" dy="0">consider upstream connections and hot keys</tspan></text>