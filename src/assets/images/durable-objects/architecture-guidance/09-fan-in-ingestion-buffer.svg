<svg viewBox="0 0 760 412" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect width="100%" height="100%" fill="#ffffff" /><title id="d8t">Fan in through an ingestion buffer. Shards absorb bursts and flush batches to R2, and the backend drains them at its own pace.</title><desc id="d8d">Application producers
  → Worker: validate, authenticate, hash to shard
  → stream:7:shard:0 | stream:7:shard:1 | stream:7:shard:2  (each: SQLite buffer + flush alarm)
  → alarm flushes batches → R2 batch objects (absorbs the peak)
  → steady, controlled drain → backend systems (capacity determines the drain rate)
KV holds per-stream config (shard count, layout version).</desc><defs><marker id="d8g" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d8o" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d8b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d8p" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#8b8b93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d8r" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#d93636" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d8k" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#1f9d55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs><circle cx="252" cy="22" r="4.2" fill="#a1a1aa"></circle><circle cx="266" cy="22" r="4.2" fill="#a1a1aa"></circle><circle cx="280" cy="22" r="4.2" fill="#a1a1aa"></circle><circle cx="294" cy="22" r="4.2" fill="#a1a1aa"></circle><circle cx="308" cy="22" r="4.2" fill="#a1a1aa"></circle><circle cx="322" cy="22" r="4.2" fill="#a1a1aa"></circle><circle cx="336" cy="22" r="4.2" fill="#a1a1aa"></circle><circle cx="350" cy="22" r="4.2" fill="#a1a1aa"></circle><circle cx="364" cy="22" r="4.2" fill="#a1a1aa"></circle><circle cx="378" cy="22" r="4.2" fill="#a1a1aa"></circle><circle cx="392" cy="22" r="4.2" fill="#a1a1aa"></circle><circle cx="406" cy="22" r="4.2" fill="#a1a1aa"></circle><circle cx="420" cy="22" r="4.2" fill="#a1a1aa"></circle><circle cx="434" cy="22" r="4.2" fill="#a1a1aa"></circle><circle cx="448" cy="22" r="4.2" fill="#a1a1aa"></circle><text x="470" y="26" font-size="10.5" font-weight="400" fill="#55555c" text-anchor="start"><tspan x="470" dy="0">bursty application producers</tspan></text><path d="M350,30 L350,48" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d8g)"></path><rect x="150" y="50" width="400" height="46" rx="6" fill="#fdf1e4"></rect><g transform="translate(162 62) scale(0.9166666666666666)" fill="none" stroke="#f6821f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M9.2 3.5h3.1L7 12l5.3 8.5H9.2L3.9 12z"></path><path d="M11.7 3.5h3.1l5.3 8.5-5.3 8.5h-3.1L17 12z"></path></g><text x="367" y="70" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="367" dy="0">Worker</tspan></text><text x="367" y="85" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="367" dy="0">validate · authenticate · hash to shard</tspan></text><rect x="130" y="122" width="445" height="110" rx="10" fill="#ffffff" fill-opacity="0.7" stroke="#c8c8ce" stroke-width="1.2" stroke-dasharray="6 4"></rect><path d="M350,96 L350,110 L213,110 L213,138" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d8o)"></path><path d="M350,96 L350,110 L353,110 L353,138" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d8o)"></path><path d="M350,96 L350,110 L493,110 L493,138" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d8o)"></path><rect x="148" y="140" width="130" height="72" rx="6" fill="#fdf1e4"></rect><text x="213" y="166" font-size="11.5" font-weight="700" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="213" dy="0">stream:7:shard:0</tspan></text><text x="213" y="181" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="213" dy="0">SQLite buffer</tspan><tspan x="213" dy="14">+ flush alarm</tspan></text><rect x="288" y="140" width="130" height="72" rx="6" fill="#fdf1e4"></rect><text x="353" y="166" font-size="11.5" font-weight="700" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="353" dy="0">stream:7:shard:1</tspan></text><text x="353" y="181" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="353" dy="0">SQLite buffer</tspan><tspan x="353" dy="14">+ flush alarm</tspan></text><rect x="428" y="140" width="130" height="72" rx="6" fill="#fdf1e4"></rect><text x="493" y="166" font-size="11.5" font-weight="700" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="493" dy="0">stream:7:shard:2</tspan></text><text x="493" y="181" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="493" dy="0">SQLite buffer</tspan><tspan x="493" dy="14">+ flush alarm</tspan></text><path d="M213,212 L213,258" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d8o)"></path><path d="M353,212 L353,258" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d8o)"></path><text x="410" y="244" font-size="11" font-weight="600" fill="#1f1f22" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="410" dy="0">flush batch</tspan></text><path d="M493,212 L493,258" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d8o)"></path><rect x="150" y="260" width="405" height="46" rx="6" fill="#fdf1e4"></rect><g transform="translate(162 272) scale(0.9166666666666666)" fill="none" stroke="#f6821f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><ellipse cx="12" cy="5.8" rx="7.5" ry="2.8"></ellipse><path d="M4.5 5.8v12.4c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V5.8M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"></path></g><text x="369.5" y="280" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="369.5" dy="0">R2: batch objects</tspan></text><text x="369.5" y="295" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="369.5" dy="0">absorbs the peak; data waits here if needed</tspan></text><rect x="590" y="260" width="150" height="46" rx="6" fill="#ffffff" stroke="#b9b9c0" stroke-width="1.3" stroke-dasharray="5 4"></rect><g transform="translate(602 272) scale(0.9166666666666666)" fill="none" stroke="#f6821f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><ellipse cx="12" cy="5.8" rx="7.5" ry="2.8"></ellipse><path d="M4.5 5.8v12.4c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V5.8M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"></path></g><text x="682" y="280" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="682" dy="0">KV</tspan></text><text x="682" y="295" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="682" dy="0">stream config</tspan></text><path d="M352,306 L352,346" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d8g)"></path><text x="445" y="330" font-size="11" font-weight="600" fill="#1f1f22" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="445