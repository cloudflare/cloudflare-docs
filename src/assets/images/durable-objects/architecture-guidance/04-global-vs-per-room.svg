<svg viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect width="100%" height="100%" fill="#ffffff" /><title id="d3t">A single global object serializes unrelated work. One object per room spreads the same load across many threads and locations.</title><desc id="d3d">WRONG: all clients → ChatRoom "global" (every room, one thread)
       result: queues grow; one failure affects everyone
RIGHT: clients → room:lobby | room:42 | room:dev (one object per room)
       result: rooms run in parallel; failures are isolated</desc><defs><marker id="d3g" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d3o" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d3b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d3p" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#8b8b93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d3r" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#d93636" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d3k" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#1f9d55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs><line x1="380" y1="8" x2="380" y2="96%" stroke="#e4e4e7" stroke-width="1.2"></line><text x="190" y="22" font-size="13" font-weight="700" fill="#b42323" text-anchor="middle"><tspan x="190" dy="0">One global Durable Object</tspan></text><text x="570" y="22" font-size="13" font-weight="700" fill="#157a43" text-anchor="middle"><tspan x="570" dy="0">One Durable Object per room</tspan></text><circle cx="60" cy="60" r="7" fill="#a1a1aa"></circle><path d="M60,69 L60,110 L190,110 L190,148" fill="none" stroke="#d93636" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#d3r)"></path><circle cx="112" cy="60" r="7" fill="#a1a1aa"></circle><path d="M112,69 L112,110 L190,110 L190,148" fill="none" stroke="#d93636" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#d3r)"></path><circle cx="164" cy="60" r="7" fill="#a1a1aa"></circle><path d="M164,69 L164,110 L190,110 L190,148" fill="none" stroke="#d93636" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#d3r)"></path><circle cx="216" cy="60" r="7" fill="#a1a1aa"></circle><path d="M216,69 L216,110 L190,110 L190,148" fill="none" stroke="#d93636" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#d3r)"></path><circle cx="268" cy="60" r="7" fill="#a1a1aa"></circle><path d="M268,69 L268,110 L190,110 L190,148" fill="none" stroke="#d93636" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#d3r)"></path><circle cx="320" cy="60" r="7" fill="#a1a1aa"></circle><path d="M320,69 L320,110 L190,110 L190,148" fill="none" stroke="#d93636" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#d3r)"></path><rect x="115" y="150" width="150" height="52" rx="6" fill="#fdecec" stroke="#efb1b1" stroke-width="1.3"></rect><text x="190" y="173" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="190" dy="0">ChatRoom "global"</tspan></text><text x="190" y="188" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="190" dy="0">all rooms, one thread</tspan></text><text x="190" y="226" font-size="11" font-weight="400" fill="#b42323" text-anchor="middle"><tspan x="190" dy="0">Queues grow; one failure affects everyone