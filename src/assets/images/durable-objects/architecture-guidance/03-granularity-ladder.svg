<svg viewBox="0 0 760 296" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect width="100%" height="100%" fill="#ffffff" /><title id="d2t">The granularity ladder. Choose the rung where one object owns everything that must change together, and nothing else.</title><desc id="d2d">Granularity ladder, coarse to fine:
  Global ...................... TOO COARSE: every request queues on one thread; one failure affects everyone
  Tenant or workspace ......... OK as a bounded parent or per-tenant database; too coarse if one tenant is busy
  User ........................ OK for per-user state, settings, inbox
  Room, session, document ..... SWEET SPOT: largest unit updated atomically, smallest unit served on its own
  Row, message, tool call, agent turn ... TOO FINE when each operation needs shared state from other objects</desc><defs><marker id="d2g" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d2o" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d2b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d2p" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#8b8b93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d2r" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#d93636" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d2k" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#1f9d55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs><rect x="10" y="179" width="722" height="52" rx="10" fill="#f3faf5" fill-opacity="1" stroke="#a9dcb8" stroke-width="1.2" stroke-dasharray="6 4"></rect><rect x="20" y="24" width="210" height="42" rx="6" fill="#fdecec" stroke="#efb1b1" stroke-width="1.3"></rect><text x="125" y="49" font-size="12.5" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="125" dy="0">Global</tspan></text><rect x="248" y="40" width="10" height="10" rx="2" fill="#f3a5a5"></rect><text x="470" y="41" font-size="11" font-weight="400" fill="#b42323" text-anchor="start"><tspan x="470" dy="0">Too coarse: every request queues behind</tspan><tspan x="470" dy="14.3">one thread, and one failure takes down all</tspan></text><rect x="20" y="78" width="210" height="42" rx="6" fill="#f4f4f5"></rect><text x="125" y="103" font-size="12.5" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="125" dy="0">Tenant · workspace</tspan></text><rect x="248" y="94" width="10" height="10" rx="2" fill="#f6821f"></rect><rect x="261" y="94" width="10" height="10" rx="2" fill="#f6821f"></rect><rect x="274" y="94" width="10" height="10" rx="2" fill="#f6821f"></rect><text x="470" y="95" font-size="11" font-weight="400" fill="#3f3f46" text-anchor="start"><tspan x="470" dy="0">Good bounded parent or per-tenant database;</tspan><tspan x="470" dy="14.3">too coarse if one tenant is very busy</tspan></text><rect x="20" y="132" width="210" height="42" rx="6" fill="#f4f4f5"></rect><text x="125" y="157" font-size="12.5" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="125" dy="0">User</tspan></text><rect x="248" y="148" width="10" height="10" rx="2" fill="#f6821f"></rect><rect x="261" y="148" width="10" height="10" rx="2" fill="#f6821f"></rect><rect x="274" y="148" width="10" height="10" rx="2" fill="#f6821f"></rect><rect x="287" y="148" width="10" height="10" rx="2" fill="#f6821f"></rect><rect x="300" y="148" width="10" height="10" rx="2" fill="#f6821f"></rect><rect x="313" y="148" width="10" height="10" rx="2" fill="#f6821f"></rect><text x="470" y="149" font-size="11" font-weight="400" fill="#3f3f46" text-anchor="start"><tspan x="470" dy="0">Good for per-user state, settings, inbox</tspan></text><rect x="20" y="186" width="210" height="42" rx="6" fill="#e9f6ee" stroke="#a9dcb8" stroke-width="1.3"></rect><text x="125" y="211" font-size="12.5" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="125" dy="0">Room · session · document</tspan></text><rect x="248" y="202" width="10" height="10" rx="2" fill="#f6821f"></rect><rect x="261" y="202" width="10" height="10" rx="2" fill="#f6821f"></rect><rect x="274" y="202" width="10" height="10" rx="2" fill="#f6821f"></rect><rect x="287" y="202" width="10" height="10" rx="2" fill="#f6821f"></rect><rect x="300" y="202" width="10" height="10" rx="2" fill="#f6821f"></rect><rect x="313" y="202" width="10" height="10" rx="2" fill="#f6821f"></rect><rect x="326" y="202" width="10" height="10" rx="2" fill="#f6821f"></rect><rect x="339" y="202" width="10" height="10" rx="2" fill="#f6821f"></rect><rect x="352" y="202" width="10" height="10" rx="2" fill="#f6821f"></rect><rect x="365" y="202" width="10" height="10" rx="2" fill="#f6821f"></rect><text x="470" y="203" font-size="11" font-weight="600" fill="#157a43" text-anchor="start"><tspan x="470" dy="0">Sweet spot for coordination: the unit you</tspan><tspan x="470" dy="14.3">update atomically and can serve on its own</tspan></text><rect x="20" y="240" width="210" height="42" rx="6" fill="#fdecec" stroke="#efb1b1" stroke-width="1.3"></rect><text x="125" y="257" font-size="12.5" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="125" dy="0">Row · message</tspan><tspan x="125" dy="15">tool call · agent turn</tspan></text><rect x="248" y="256" width="10" height="10" rx="2" fill="#f3a5a5"></rect><rect x="261" y="256" width="10" height="10" rx="2" fill="#f3a5a5"></rect><rect x="274" y="256" width="10" height="10" rx="2" fill="#f3a5a5"></rect><rect x="287" y="256" width="10" height="10" rx="2" fill="#f3a5a5"></rect><rect x="300" y="256" width="10" height="10" rx="2" fill="#f3a5a5"></rect><rect x="313" y="256" width="10" height="10" rx="2" fill="#f3a5a5"></rect><rect x="326" y="256" width="10" height="10" rx="2" fill="#f3a5a5"></rect><rect x="339" y="256" width="10" height="10" rx="2" fill="#f3a5a5"></rect><rect x="352" y="256" width="10" height="10" rx="2" fill="#f3a5a5"></rect><rect x="365" y="256" width="10" height="10" rx="2" fill="#f3a5a5"></rect><rect x="378" y="256" width="10" height="10" rx="2" fill="#f3a5a5"></rect><rect x="391" y="256" width="10" height="10" rx="2" fill="#f3a5a5"></rect><rect x="404" y="256" width="10" height="10" rx="2" fill="#f3a5a5"></rect><rect x="417" y="256" width="10" height="10" rx="2" fill="#f3a5a5"></rect><rect x="430" y="256" width="10" height="10" rx="2" fill="#f3a5a5"></rect><rect x="443" y="256" width="10" height="10" rx="2" fill="#f3a5a5"></rect><text x="470" y="257" font-size="11" font-weight="400" fill="#b42323" text-anchor="start"><tspan x="470" dy="0">Too fine when each operation needs</tspan><tspan x="470" dy="14.3">shared state from other objects</tspan></text><path d="M746,30 L746,262" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d2g)" marker-start="url(#d2g)"></path><text x="738" y="18" font-size="10" font-weight="400" fill="#55555c" text-anchor="end"><tspan x="738" dy="0">coarser</tspan></text><text x="738" y="288" font-size="10" font-weight="400" fill="#55555c" text-anchor="end"><tspan x="738" dy="0">finer</tspan></text><text x="248" y="16" font-size="10" font-weight="400" fill="#55555c" text-anchor="start"><tspan x="248" dy="0">number of objects</tspan></text></svg>
