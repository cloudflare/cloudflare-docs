<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect width="100%" height="100%" fill="#ffffff" /><title id="d14t">Split by responsibility. The session keeps the writes, a relay serves read-only viewers, and each sub-agent runs in its own object.</title><desc id="d14d">session:91 (source of truth, accepts all writes)
  → publish events → session:91:viewers (read-only fan-out) → hundreds of watchers
