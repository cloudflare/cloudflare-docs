<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Workers for Platforms administration and runtime dispatch</title>
<desc id="diagram-desc">The platform API Worker manages tenant deployments and authoritative registries in separately shown Durable Objects for tenants A and B. It publishes hostname-to-script mappings to KV. Runtime requests reach a dispatch Worker, which selects a tenant user Worker in the production dispatch namespace. Tenant A user Worker calls its document Durable Objects doc:1 and doc:2; tenant B user Worker calls its cart Durable Objects cart:9 and cart:10. Each Worker uses the Workers logo and every Durable Object is a separate box with the Durable Objects icon. Runtime dispatch bypasses the deployment API and authoritative registry.</desc>
