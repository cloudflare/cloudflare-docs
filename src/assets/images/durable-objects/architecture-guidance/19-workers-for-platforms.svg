<rect width="100%" height="100%" fill="#ffffff" /><title id="d19t">Workers for Platforms. The dispatch Worker and platform API form the control plane. Each tenant's Durable Objects are the data plane, reached only through that tenant's user Worker.</title><desc id="d19d">Tenant users → dispatch Worker (platform control plane: tenant lookup, auth, per-plan limits)
  ↔ KV: hostname → tenant
  ↔ D1: tenants table
  → DISPATCHER.get(script) → dispatch namespace "production"
       tenant-a user Worker → tenant A's Durable Objects (doc:1, doc:2)
       tenant-b user Worker → tenant B's Durable Objects (cart:9, cart:10)
