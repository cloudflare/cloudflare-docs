<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect width="100%" height="100%" fill="#ffffff" /><title id="d9t">Session per Durable Object. Every client and the sandbox meet in one object per session. A Worker plus D1 handles auth, webhooks, and listing.</title><desc id="d9d">Web app | Slack bot | browser extension | GitHub webhooks
  → Worker: GitHub OAuth, membership check, webhook → session lookup
      ↔ D1: session index and stats (listing never wakes objects)
  → getByName("session:91")
      holds: SQLite (prompts with authors, events, PR state) + hibernated WebSockets for every client
      ↔ sandbox VM (runs the agent, streams events in)
      → GitHub (opens the pull request)
      ⇢ spawns session:92, session:93 (sub-agents)
      ⇢ lifecycle changes only → D1</desc><defs><marker id="d9g" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d9o" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d9b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d9p" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#8b8b93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d9r" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#d93636" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d9k" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#1f9d55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs><rect x="20" y="36" width="130" height="38" rx="6" fill="#f4f4f5"></rect><text x="85" y="59" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="85" dy="0">Web app</tspan></text><rect x="20" y="86" width="130" height="38" rx="6" fill="#f4f4f5"></rect><text x="85" y="109" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="85" dy="0">Slack bot</tspan></text><rect x="20" y="136" width="130" height="38" rx="6" fill="#f4f4f5"></rect><text x="85" y="159" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="85" dy="0">Browser extension</tspan></text><rect x="20" y="186" width="130" height="38" rx="6" fill="#f4f4f5"></rect><text x="85" y="209" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="85" dy="0">GitHub webhooks</tspan></text><path d="M150,55 L188,55" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d9g)"></path><path d="M150,105 L188,105" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d9g)"></path><path d="M150,155 L188,155" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d9g)"></path><path d="M150,205 L188,205" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d9g)"></path><rect x="190" y="30" width="150" height="196" rx="6" fill="#fdf1e4"></rect><g transform="translate(250 73) scale(1.25)" fill="none" stroke="#f6821f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M9.2 3.5h3.1L7 12l5.3 8.5H9.2L3.9 12z"></path><path d="M11.7 3.5h3.1l5.3 8.5-5.3 8.5h-3.1L17 12z"></path></g><text x="265" y="123" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="265" dy="0">Worker</tspan></text><text x="265" y="138" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="265" dy="0">GitHub OAuth</tspan><tspan x="265" dy="14">membership check</tspan><tspan x="265" dy="14">webhook → session</tspan><tspan x="265" dy="14">lookup in D1</tspan></text><rect x="190" y="256" width="150" height="44" rx="6" fill="#fdf1e4"></rec