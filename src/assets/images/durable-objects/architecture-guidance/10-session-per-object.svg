="middle"><tspan x="685" dy="0">Sandbox VM</tspan></text><text x="685" y="94" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="685" dy="0">runs the agent</tspan></text><path d="M592,82 L628,82" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d9g)" marker-start="url(#d9g)"></path><text x="610" y="74" font-size="11" font-weight="600" fill="#1f1f22" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="610" dy="0">events</tspan></text><rect x="630" y="150" width="110" height="46" rx="6" fill="#f4f4f5"></rect><text x="685" y="170" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="685" dy="0">GitHub</tspan></text><text x="685" y="185" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="685" dy="0">pull request</tspan></text><path d="M592,173 L628,173" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#d9g)"></path><text x="610" y="165" font-size="11" font-weight="600" fill="#1f1f22" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"><tspan x="610" dy="0">PR</tspan></text><rect x="445" y="258" width="95" height="50" rx="6" fill="#fdf1e4"></rect><text x="492.5" y="280" font-size="12" font-weight="700" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="492.5" dy="0">session:92</tspan></text><text x="492.5" y="295" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="492.5" dy="0">sub-agent</tspan></text><rect x="550" y="258" width="95" height="50" rx="6" fill="#fdf1e4"></rect><text x="597.5" y="280" font-size="12" font-weight="700" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="597.5" dy="0">session:93</tspan></text><text x="597.5" y="295" font-size="11" font-weight="400" fil