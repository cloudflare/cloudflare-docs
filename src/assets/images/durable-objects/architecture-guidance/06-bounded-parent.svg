<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<rect width="100%" height="100%" fill="#ffffff" /><title id="d5t">A bounded parent tracks its children, but the Worker routes data traffic straight to each child by name.</title><desc id="d5d">Worker → tenant:acme (bounded parent, index of its children): create and list only (rare)
Worker → match:1 | match:2 | match:3: directly, for every player action (hot path)
tenant:acme ⇢ match:N: lifecycle only (init() on create, status report on finish)
Rule: data traffic never passes through the parent.</desc><defs><marker id="d5g" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d5o" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d5b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#26262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d5p" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#8b8b93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d5r" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#d93636" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker><marker id="d5k" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5,1.5 L10,6 L2.5,10.5" fill="none" stroke="#1f9d55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs><rect x="300" y="18" width="160" height="50" rx="6" fill="#fdf1e4"></rect><g transform="translate(312 32) scale(0.9166666666666666)" fill="none" stroke="#f6821f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M9.2 3.5h3.1L7 12l5.3 8.5H9.2L3.9 12z"></path><path d="M11.7 3.5h3.1l5.3 8.5-5.3 8.5h-3.1L17 12z"></path></g><text x="397" y="40" font-size="13" font-weight="700" fill="#1f1f22" text-anchor="middle"><tspan x="397" dy="0">Worker</tspan></text><text x="397" y="55" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="397" dy="0">routes by name</tspan></text><rect x="40" y="140" width="170" height="60" rx="6" fill="#fdf1e4"></rect><text x="125" y="160" font-size="12" font-weight="700" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="125" dy="0">tenant:acme</tspan></text><text x="125" y="175" font-size="11" font-weight="400" fill="#55555c" text-anchor="middle"><tspan x="125" dy="0">bounded parent</tspan><tspan x="125" dy="14">index of its children</tspan></text><rect x="300" y="140" width="130" height="52" rx="6" fill="#fdf1e4"></rect><g transform="translate(312 155) scale(0.9166666666666666)" fill="none" stroke="#f6821f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12.6 3.1v17.8M3.4 9.4h9.2M3.4 14.6h9.2"></path><circle cx="16.6" cy="7.6" r="1.2" fill="#f6821f" stroke="none"></circle><circle cx="17.6" cy="12" r="1.2" fill="#f6821f" stroke="none"></circle><circle cx="16.6" cy="16.4" r="1.2" fill="#f6821f" stroke="none"></circle></g><text x="382" y="170" font-size="12" font-weight="700" fill="#1f1f22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><tspan x="382" dy="0">match:1</tspan></text><rect x="450" y="140" width="130" height="52" rx="6" fill="#fdf1e4"></rect><g transform="translate(462 155) scale(0.9166666666666666)" fill="none" stroke="#f6821f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12.6 3.1v17.8M3.4 9.4h9.2M3.4 14.6h9.2"></path><circle cx="