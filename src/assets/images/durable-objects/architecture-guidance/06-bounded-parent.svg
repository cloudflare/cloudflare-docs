<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 355" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<title>Administrative parent and independent resource requests</title>
<desc>An administrative Worker calls an account parent Durable Object to create and list resources. The parent initializes match objects. A separate request path goes from the request Worker directly to match objects for player actions. Match activity does not write account configuration. The parent acts as a control plane for resource lifecycle, not a required hop for every action.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5577a5"/></marker></defs>
<rect width="800" height="355" fill="white"/>
<rect x="25" y="40" width="210" height="75" rx="9" fill="#fff4e8" stroke="#e7a460"/><text x="130" y="65" fill="#1d2939" font-size="15" text-anchor="middle" font-weight="600">Administrative Worker</text><text x="130" y="88" fill="#344054" font-size="13" text-anchor="middle" font-weight="400">Create · list resources</text><rect x="345" y="40" width="260" height="75" rx="9" fill="#fff4e8" stroke="#e7a460"/><text x="475" y="65" fill="#1d2939" font-size="15" text-anchor="middle" font-weight="600">Account parent DO</text><text x="475" y="88" fill="#344054" font-size="13" text-anchor="middle" font-weight="400">Control plane · tenant:acme</text><path d="M235 78 H345" fill="none" stroke="#5577a5" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="225" width="210" height="75" rx="9" fill="#f4f7fc" stroke="#b6c7e0"/><text x="130" y="250" fill="#1d2939" font-size="15" text-anchor="middle" font-weight="600">Request Worker</text><text x="130" y="273" fill="#344054" font-size="13" text-anchor="middle" font-weight="400">Player actions · data plane</text><rect x="345" y="225" width="120" height="75" rx="9" fill="#f4f7fc" stroke="#b6c7e0"/><text x="405" y="250" fill="#1d2939" font-size="15" text-anchor="middle" font-weight="600">match:1</text><text x="405" y="273" fill="#344054" font-size="13" text-anchor="middle" font-weight="400">Game state</text><rect x="490" y="225" width="120" height="75" rx="9" fill="#f4f7fc" stroke="#b6c7e0"/><text x="550" y="250" fill="#1d2939" font-size="15" text-anchor="middle" font-weight="600">match:2</text><text x="550" y="273" fill="#344054" font-size="13" text-anchor="middle" font-weight="400">Game state</text><rect x="635" y="225" width="120" height="75" rx="9" fill="#f4f7fc" stroke="#b6c7e0"/><text x="695" y="250" fill="#1d2939" font-size="15" text-anchor="middle" font-weight="600">match:3</text><text x="695" y="273" fill="#344054" font-size="13" text-anchor="middle" font-weight="400">Game state</text><path d="M235 263 H345" fill="none" stroke="#5577a5" stroke-width="2" marker-end="url(#arrow)"/><path d="M275 263 V195 H550 V225" fill="none" stroke="#5577a5" stroke-width="2" marker-end="url(#arrow)"/><path d="M275 195 H695 V225" fill="none" stroke="#5577a5" stroke-width="2" marker-end="url(#arrow)"/><path d="M475 115 V158 H550 V225" fill="none" stroke="#5577a5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="618" y="153" fill="#344054" font-size="12" text-anchor="middle" font-weight="400">Resource initialization</text><text x="400" y="337" fill="#344054" font-size="13" text-anchor="middle" font-weight="400">Independent player actions bypass the parent; match activity does not update account configuration</text>
</svg>
