<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .main-label { font-size: 14px; fill: #1a1a1a; font-weight: 700; font-family: 'SF Mono', 'Fira Code', monospace; }
    .branch-name { font-size: 11px; fill: #1a1a1a; font-weight: 700; font-family: 'SF Mono', 'Fira Code', monospace; }
    .generic-label { font-size: 9px; fill: #9ca3af; font-family: 'SF Mono', 'Fira Code', monospace; }
    .box-label { font-size: 11px; fill: #374151; font-weight: 600; }
    .track-label { font-size: 10px; fill: #6b7280; font-weight: 600; }
    .url { font-size: 8.5px; fill: #2563eb; font-family: 'SF Mono', 'Fira Code', monospace; font-weight: 600; }
    .tag { font-size: 8px; font-weight: 600; }
    .cmd { font-size: 8.5px; fill: #6b7280; font-family: 'SF Mono', 'Fira Code', monospace; }
    .dots { font-size: 18px; fill: #9ca3af; font-weight: 700; letter-spacing: 4px; }
    .plus { font-size: 12px; fill: #6b7280; font-weight: 600; }
  </style>
  <defs>
    <marker id="ah-main" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 12 4, 0 8" fill="#374151"/>
    </marker>
    <marker id="ah-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- ==================== MAIN LINE ==================== -->

  <text x="20" y="40" class="main-label">main</text>
  <line x1="60" y1="35" x2="1170" y2="35" stroke="#374151" stroke-width="3" style="marker-end: url(#ah-main);"/>

  <!-- All commits on main -->
  <circle cx="120" cy="35" r="4" fill="#374151"/>
  <circle cx="230" cy="35" r="4" fill="#374151"/>
  <circle cx="340" cy="35" r="4" fill="#374151"/>
  <circle cx="440" cy="35" r="4" fill="#374151"/>
  <circle cx="510" cy="35" r="4" fill="#374151"/>
  <circle cx="580" cy="35" r="4" fill="#374151"/>
  <circle cx="650" cy="35" r="4" fill="#374151"/>
  <circle cx="730" cy="35" r="4" fill="#374151"/>
  <circle cx="800" cy="35" r="4" fill="#374151"/>
  <circle cx="870" cy="35" r="4" fill="#374151"/>
  <circle cx="940" cy="35" r="4" fill="#374151"/>
  <circle cx="1020" cy="35" r="4" fill="#374151"/>
  <circle cx="1070" cy="35" r="4" fill="#374151"/>
  <circle cx="1120" cy="35" r="4" fill="#374151"/>

  <!-- ==================== LEFT: 3 DETAILED BRANCHES (centers 120, 230, 340) ==================== -->

  <!-- git branch arrows -->
  <line x1="120" y1="40" x2="120" y2="68" stroke="#3b82f6" stroke-width="1.5" style="marker-end: url(#ah-blue);"/>
  <text x="132" y="60" class="cmd">git branch</text>

  <line x1="230" y1="40" x2="230" y2="68" stroke="#3b82f6" stroke-width="1.5" style="marker-end: url(#ah-blue);"/>
  <text x="242" y="60" class="cmd">git branch</text>

  <line x1="340" y1="40" x2="340" y2="68" stroke="#3b82f6" stroke-width="1.5" style="marker-end: url(#ah-blue);"/>
  <text x="352" y="60" class="cmd">git branch</text>

  <!-- Branch names -->
  <text x="120" y="88" text-anchor="middle" class="branch-name">fix-ui</text>
  <text x="230" y="88" text-anchor="middle" class="branch-name">new-api</text>
  <text x="340" y="88" text-anchor="middle" class="branch-name">redesign</text>

  <!-- Code boxes (100px wide, 110px apart = no overlap) -->
  <rect x="70" y="96" width="100" height="30" rx="4" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="120" y="115" text-anchor="middle" class="box-label">Code</text>

  <rect x="180" y="96" width="100" height="30" rx="4" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="230" y="115" text-anchor="middle" class="box-label">Code</text>

  <rect x="290" y="96" width="100" height="30" rx="4" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="340" y="115" text-anchor="middle" class="box-label">Code</text>

  <!-- Lines down from Code to base config -->
  <line x1="120" y1="126" x2="120" y2="245" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="230" y1="126" x2="230" y2="245" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="340" y1="126" x2="340" y2="245" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- npx wrangler preview labels (to right of each line) -->
  <text x="130" y="190" class="cmd">npx wrangler</text>
  <text x="130" y="202" class="cmd">preview</text>

  <text x="240" y="190" class="cmd">npx wrangler</text>
  <text x="240" y="202" class="cmd">preview</text>

  <text x="350" y="190" class="cmd">npx wrangler</text>
  <text x="350" y="202" class="cmd">preview</text>

  <!-- ==================== BASE CONFIG LINE ==================== -->

  <text x="20" y="255" class="track-label">Base</text>
  <text x="20" y="268" class="track-label">Config</text>
  <line x1="65" y1="258" x2="1170" y2="258" stroke="#9ca3af" stroke-width="2" stroke-dasharray="10,5"/>

  <!-- Single base config dot (aligned with fix-ui) -->
  <circle cx="120" cy="258" r="5.5" fill="#374151"/>

  <!-- Horizontal connections: new-api and redesign lines meet the dot -->
  <line x1="120" y1="248" x2="230" y2="248" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="120" y1="245" x2="340" y2="245" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Fan out below: paths from base config dot to each preview -->
  <!-- fix-ui: straight down -->
  <line x1="120" y1="264" x2="120" y2="370" stroke="#3b82f6" stroke-width="1.5" style="marker-end: url(#ah-blue);"/>

  <!-- new-api: diagonal then down -->
  <path d="M 120 270 C 120 290, 170 310, 230 320" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
  <line x1="230" y1="320" x2="230" y2="370" stroke="#3b82f6" stroke-width="1.5" style="marker-end: url(#ah-blue);"/>

  <!-- redesign: wider diagonal then down -->
  <path d="M 120 275 C 120 300, 230 330, 340 340" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
  <line x1="340" y1="340" x2="340" y2="370" stroke="#3b82f6" stroke-width="1.5" style="marker-end: url(#ah-blue);"/>

  <!-- Preview URLs -->
  <text x="120" y="390" text-anchor="middle" class="url">fix-ui.example.com</text>
  <text x="230" y="390" text-anchor="middle" class="url">new-api.example.com</text>
  <text x="340" y="390" text-anchor="middle" class="url">redesign.example.com</text>

  <!-- Preview boxes -->
  <rect x="70" y="398" width="100" height="40" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="78" y="404" width="42" height="14" rx="3" fill="#3b82f6"/>
  <text x="99" y="415" text-anchor="middle" class="tag" fill="#fff">Preview</text>
  <text x="120" y="432" text-anchor="middle" class="box-label" style="font-size:10px;">Config</text>

  <rect x="180" y="398" width="100" height="40" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="188" y="404" width="42" height="14" rx="3" fill="#3b82f6"/>
  <text x="209" y="415" text-anchor="middle" class="tag" fill="#fff">Preview</text>
  <text x="230" y="432" text-anchor="middle" class="box-label" style="font-size:10px;">Config</text>

  <rect x="290" y="398" width="100" height="40" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="298" y="404" width="42" height="14" rx="3" fill="#3b82f6"/>
  <text x="319" y="415" text-anchor="middle" class="tag" fill="#fff">Preview</text>
  <text x="340" y="432" text-anchor="middle" class="box-label" style="font-size:10px;">Config</text>

  <!-- ==================== DOTS separator ==================== -->

  <text x="420" y="150" class="dots">..</text>

  <!-- ==================== MIDDLE: GENERIC BRANCHES ==================== -->

  <!-- auth-fix branch -->
  <path d="M 440 35 C 440 60, 460 78, 490 78" stroke="#c4c4c4" stroke-width="1.5" fill="none"/>
  <line x1="490" y1="78" x2="620" y2="78" stroke="#c4c4c4" stroke-width="1.5"/>
  <path d="M 620 78 C 650 78, 650 60, 650 35" stroke="#c4c4c4" stroke-width="1.5" fill="none"/>
  <circle cx="510" cy="78" r="3" fill="#c4c4c4"/>
  <circle cx="540" cy="78" r="3" fill="#c4c4c4"/>
  <circle cx="570" cy="78" r="3" fill="#c4c4c4"/>
  <circle cx="600" cy="78" r="3" fill="#c4c4c4"/>
  <text x="555" y="96" text-anchor="middle" class="generic-label">auth-fix branch</text>

  <!-- dark-mode branch -->
  <path d="M 730 35 C 730 60, 750 78, 780 78" stroke="#c4c4c4" stroke-width="1.5" fill="none"/>
  <line x1="780" y1="78" x2="910" y2="78" stroke="#c4c4c4" stroke-width="1.5"/>
  <path d="M 910 78 C 940 78, 940 60, 940 35" stroke="#c4c4c4" stroke-width="1.5" fill="none"/>
  <circle cx="800" cy="78" r="3" fill="#c4c4c4"/>
  <circle cx="830" cy="78" r="3" fill="#c4c4c4"/>
  <circle cx="860" cy="78" r="3" fill="#c4c4c4"/>
  <circle cx="890" cy="78" r="3" fill="#c4c4c4"/>
  <text x="845" y="96" text-anchor="middle" class="generic-label">dark-mode branch</text>

  <!-- caching branch (lower) -->
  <path d="M 580 35 C 580 100, 610 125, 640 125" stroke="#c4c4c4" stroke-width="1.5" fill="none"/>
  <line x1="640" y1="125" x2="780" y2="125" stroke="#c4c4c4" stroke-width="1.5"/>
  <path d="M 780 125 C 810 125, 800 100, 800 35" stroke="#c4c4c4" stroke-width="1.5" fill="none"/>
  <circle cx="665" cy="125" r="3" fill="#c4c4c4"/>
  <circle cx="695" cy="125" r="3" fill="#c4c4c4"/>
  <circle cx="725" cy="125" r="3" fill="#c4c4c4"/>
  <circle cx="755" cy="125" r="3" fill="#c4c4c4"/>
  <text x="710" y="143" text-anchor="middle" class="generic-label">caching branch</text>

  <!-- ==================== DOTS separator ==================== -->

  <text x="970" y="150" class="dots">..</text>

  <!-- ==================== RIGHT: perf-opt DETAILED BRANCH (center 1070) ==================== -->

  <line x1="1070" y1="40" x2="1070" y2="68" stroke="#3b82f6" stroke-width="1.5" style="marker-end: url(#ah-blue);"/>
  <text x="1082" y="60" class="cmd">git branch</text>

  <text x="1070" y="88" text-anchor="middle" class="branch-name">perf-opt</text>

  <rect x="1020" y="96" width="100" height="30" rx="4" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="1070" y="115" text-anchor="middle" class="box-label">Code</text>

  <line x1="1070" y1="126" x2="1070" y2="245" stroke="#3b82f6" stroke-width="1.5"/>

  <text x="1082" y="190" class="cmd">npx wrangler</text>
  <text x="1082" y="202" class="cmd">preview</text>

  <!-- perf-opt hits base config line, connects horizontally back -->
  <line x1="120" y1="252" x2="1070" y2="252" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <line x1="1070" y1="245" x2="1070" y2="258" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- perf-opt fan out below -->
  <line x1="1070" y1="264" x2="1070" y2="370" stroke="#3b82f6" stroke-width="1.5" style="marker-end: url(#ah-blue);"/>

  <text x="1070" y="390" text-anchor="middle" class="url">perf-opt.example.com</text>

  <rect x="1020" y="398" width="100" height="40" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="1028" y="404" width="42" height="14" rx="3" fill="#3b82f6"/>
  <text x="1049" y="415" text-anchor="middle" class="tag" fill="#fff">Preview</text>
  <text x="1070" y="432" text-anchor="middle" class="box-label" style="font-size:10px;">Config</text>

  <!-- ==================== FINAL DOTS ==================== -->

  <text x="1145" y="425" class="dots">..</text>
</svg>
