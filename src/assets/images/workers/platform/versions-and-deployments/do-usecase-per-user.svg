<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 320" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
    .label { font-size: 12px; fill: #1a1a1a; }
    .sublabel { font-size: 11px; fill: #6b7280; }
    .cohort-free { font-size: 11px; font-weight: 600; fill: #c2410c; }
    .no-cohort { font-size: 11px; fill: #9ca3af; }
    .arrow-label { font-size: 10px; fill: #6b7280; }
    .vtag { font-size: 10px; font-weight: 600; fill: #fff; }
  </style>

  <rect width="750" height="320" fill="#fafafa" rx="8"/>

  <!-- Config -->
  <rect x="20" y="12" width="710" height="36" rx="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="375" y="35" text-anchor="middle" style="font-size: 11px; fill: #16a34a; font-weight: 600;">Deployment config:  default = stable 100%   |   free = new 100%</text>

  <!-- Timeline -->
  <line x1="40" y1="150" x2="720" y2="150" stroke="#d1d5db" stroke-width="1.5"/>
  <polygon points="715,145 725,150 715,155" fill="#d1d5db"/>

  <!-- Instance foo (alice, free) on Version B -->
  <text x="105" y="75" text-anchor="middle" class="title">foo</text>
  <text x="105" y="90" text-anchor="middle" class="sublabel">alice's DO</text>
  <rect x="55" y="100" width="100" height="40" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <rect x="80" y="108" width="60" height="24" rx="4" fill="#f97316"/>
  <text x="110" y="125" text-anchor="middle" class="vtag">Version B</text>

  <line x1="105" y1="215" x2="105" y2="155" stroke="#f97316" stroke-width="2"/>
  <polygon points="101,158 105,150 109,158" fill="#f97316"/>
  <text x="105" y="235" text-anchor="middle" class="label">alice</text>
  <text x="105" y="251" text-anchor="middle" class="cohort-free">cohort = free</text>

  <!-- Instance bar (bob, paid) on Version A -->
  <text x="275" y="75" text-anchor="middle" class="title">bar</text>
  <text x="275" y="90" text-anchor="middle" class="sublabel">bob's DO</text>
  <rect x="225" y="100" width="100" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="250" y="108" width="60" height="24" rx="4" fill="#9ca3af"/>
  <text x="280" y="125" text-anchor="middle" class="vtag">Version A</text>

  <line x1="275" y1="215" x2="275" y2="155" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="271,158 275,150 279,158" fill="#9ca3af"/>
  <text x="275" y="235" text-anchor="middle" class="label">bob</text>
  <text x="275" y="251" text-anchor="middle" class="no-cohort">no cohort (paid)</text>

  <!-- Instance baz (carol, free) on Version B -->
  <text x="445" y="75" text-anchor="middle" class="title">baz</text>
  <text x="445" y="90" text-anchor="middle" class="sublabel">carol's DO</text>
  <rect x="395" y="100" width="100" height="40" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <rect x="420" y="108" width="60" height="24" rx="4" fill="#f97316"/>
  <text x="450" y="125" text-anchor="middle" class="vtag">Version B</text>

  <line x1="445" y1="215" x2="445" y2="155" stroke="#f97316" stroke-width="2"/>
  <polygon points="441,158 445,150 449,158" fill="#f97316"/>
  <text x="445" y="235" text-anchor="middle" class="label">carol</text>
  <text x="445" y="251" text-anchor="middle" class="cohort-free">cohort = free</text>

  <!-- Instance qux (dave, paid) on Version A -->
  <text x="615" y="75" text-anchor="middle" class="title">qux</text>
  <text x="615" y="90" text-anchor="middle" class="sublabel">dave's DO</text>
  <rect x="565" y="100" width="100" height="40" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="590" y="108" width="60" height="24" rx="4" fill="#9ca3af"/>
  <text x="620" y="125" text-anchor="middle" class="vtag">Version A</text>

  <line x1="615" y1="215" x2="615" y2="155" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="611,158 615,150 619,158" fill="#9ca3af"/>
  <text x="615" y="235" text-anchor="middle" class="label">dave</text>
  <text x="615" y="251" text-anchor="middle" class="no-cohort">no cohort (paid)</text>

  <!-- Bottom note -->
  <text x="375" y="290" text-anchor="middle" class="sublabel">Free-tier users' instances (foo, baz) get Version B. Paid users' instances (bar, qux) stay on stable.</text>
  <text x="375" y="308" text-anchor="middle" class="sublabel">Your app always sends the same cohort for the same user.</text>
</svg>
