<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 320" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
    .label { font-size: 12px; fill: #1a1a1a; }
    .sublabel { font-size: 11px; fill: #6b7280; }
    .cohort-canary { font-size: 11px; font-weight: 600; fill: #c2410c; }
    .no-cohort { font-size: 11px; fill: #9ca3af; }
    .arrow-label { font-size: 10px; fill: #6b7280; }
    .vtag { font-size: 10px; font-weight: 600; fill: #fff; }
  </style>

  <rect width="750" height="320" fill="#fafafa" rx="8"/>

  <!-- Config -->
  <rect x="20" y="12" width="710" height="36" rx="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="375" y="35" text-anchor="middle" style="font-size: 11px; fill: #16a34a; font-weight: 600;">Deployment config:  default = stable 100%   |   canary = new 100%</text>

  <!-- Timeline -->
  <line x1="40" y1="150" x2="720" y2="150" stroke="#d1d5db" stroke-width="1.5"/>
  <polygon points="715,145 725,150 715,155" fill="#d1d5db"/>

  <!-- Instance foo (chat room, canary) on Version B -->
  <text x="195" y="75" text-anchor="middle" class="title">foo (chat room)</text>
  <rect x="80" y="95" width="230" height="45" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="175" y="118" text-anchor="middle" class="label">Running on</text>
  <rect x="240" y="103" width="60" height="28" rx="4" fill="#f97316"/>
  <text x="270" y="122" text-anchor="middle" class="vtag">Version B</text>

  <!-- alice's request to foo -->
  <line x1="140" y1="220" x2="140" y2="155" stroke="#f97316" stroke-width="2"/>
  <polygon points="136,158 140,150 144,158" fill="#f97316"/>
  <text x="140" y="240" text-anchor="middle" class="label">alice (free)</text>
  <text x="140" y="256" text-anchor="middle" class="cohort-canary">cohort = canary</text>
  <text x="140" y="274" text-anchor="middle" class="arrow-label">starts foo on Version B</text>

  <!-- bob's request to foo -->
  <line x1="260" y1="220" x2="260" y2="155" stroke="#f97316" stroke-width="2"/>
  <polygon points="256,158 260,150 264,158" fill="#f97316"/>
  <text x="260" y="240" text-anchor="middle" class="label">bob (paid)</text>
  <text x="260" y="256" text-anchor="middle" class="cohort-canary">cohort = canary</text>
  <text x="260" y="274" text-anchor="middle" class="arrow-label">still Version B</text>

  <!-- Instance bar (another room, no cohort) on Version A -->
  <text x="545" y="75" text-anchor="middle" class="title">bar (another room)</text>
  <rect x="440" y="95" width="230" height="45" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="535" y="118" text-anchor="middle" class="label">Running on</text>
  <rect x="600" y="103" width="60" height="28" rx="4" fill="#9ca3af"/>
  <text x="630" y="122" text-anchor="middle" class="vtag">Version A</text>

  <!-- carol's request to bar -->
  <line x1="510" y1="220" x2="510" y2="155" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="506,158 510,150 514,158" fill="#9ca3af"/>
  <text x="510" y="240" text-anchor="middle" class="label">carol</text>
  <text x="510" y="256" text-anchor="middle" class="no-cohort">no cohort</text>
  <text x="510" y="274" text-anchor="middle" class="arrow-label">uses default (stable)</text>

  <!-- dave's request to bar -->
  <line x1="620" y1="220" x2="620" y2="155" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="616,158 620,150 624,158" fill="#9ca3af"/>
  <text x="620" y="240" text-anchor="middle" class="label">dave</text>
  <text x="620" y="256" text-anchor="middle" class="no-cohort">no cohort</text>
  <text x="620" y="274" text-anchor="middle" class="arrow-label">still Version A</text>

  <!-- Bottom note -->
  <text x="375" y="310" text-anchor="middle" class="sublabel">The cohort is set per room, not per user. All users in foo get Version B. All users in bar get Version A.</text>
</svg>
