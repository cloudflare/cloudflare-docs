<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" fill="none">
  <defs>
    <pattern id="diagonal-orange" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#f97316" stroke-width="2.5"/>
    </pattern>
    <pattern id="diagonal-blue" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3b82f6" stroke-width="2.5"/>
    </pattern>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .heading { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
    .cohort-name { font-size: 12px; font-weight: 600; fill: #1a1a1a; }
    .version-label { font-size: 11px; fill: #6b7280; }
    .pct { font-size: 12px; font-weight: 600; fill: #fff; }
    .pct-dark { font-size: 12px; font-weight: 600; fill: #c2410c; }
    .desc { font-size: 11px; fill: #6b7280; }
  </style>

  <!-- Background -->
  <rect width="780" height="250" fill="#fafafa" rx="8"/>

  <!-- Incoming requests (left side) -->
  <rect x="30" y="45" width="130" height="200" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="95" y="35" text-anchor="middle" class="heading">Incoming requests</text>

  <!-- Team requests -->
  <rect x="45" y="65" width="100" height="36" rx="4" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="95" y="80" text-anchor="middle" class="cohort-name">team</text>
  <text x="95" y="93" text-anchor="middle" class="desc">your team</text>

  <!-- Beta requests -->
  <rect x="45" y="120" width="100" height="36" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="95" y="135" text-anchor="middle" class="cohort-name">beta</text>
  <text x="95" y="148" text-anchor="middle" class="desc">beta testers</text>

  <!-- VIP requests -->
  <rect x="45" y="175" width="100" height="36" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="95" y="190" text-anchor="middle" class="cohort-name">vip</text>
  <text x="95" y="203" text-anchor="middle" class="desc">VIP users</text>

  <!-- Percentage bars (middle) -->
  <!-- Column header -->
  <text x="420" y="35" text-anchor="middle" class="heading">Version split</text>

  <!-- Team bar: 0% stable, 100% new -->
  <line x1="160" y1="83" x2="220" y2="83" stroke="#f97316" stroke-width="1.5"/>
  <polygon points="217,79 225,83 217,87" fill="#f97316"/>
  <rect x="230" y="65" width="380" height="36" rx="4" fill="#f97316"/>
  <text x="420" y="87" text-anchor="middle" class="pct">100% new version</text>

  <!-- Beta bar: 50% stable, 50% new (striped) -->
  <line x1="160" y1="138" x2="220" y2="138" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="217,134 225,138 217,142" fill="#9ca3af"/>
  <rect x="230" y="120" width="190" height="36" rx="4 0 0 4" fill="url(#diagonal-blue)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="290" y="128" width="70" height="20" rx="3" fill="#fff"/>
  <text x="325" y="142" text-anchor="middle" style="font-size: 12px; font-weight: 600; fill: #1d4ed8;">50% stable</text>
  <rect x="420" y="120" width="190" height="36" rx="0 4 4 0" fill="url(#diagonal-orange)" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="485" y="128" width="60" height="20" rx="3" fill="#fff"/>
  <text x="515" y="142" text-anchor="middle" class="pct-dark">50% new</text>

  <!-- VIP bar: 100% stable, 0% new -->
  <line x1="160" y1="193" x2="220" y2="193" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="217,189 225,193 217,197" fill="#3b82f6"/>
  <rect x="230" y="175" width="380" height="36" rx="4" fill="#3b82f6"/>
  <text x="420" y="197" text-anchor="middle" class="pct">100% stable version</text>

  <!-- Annotations on right -->
  <text x="625" y="87" class="desc">sees new version only</text>
  <text x="625" y="142" class="desc">50/50 chance</text>
  <text x="625" y="197" class="desc">stays on stable</text>

</svg>
