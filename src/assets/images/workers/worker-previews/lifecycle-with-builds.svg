<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 210" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .label { font-size: 13px; fill: #1a1a1a; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #6b7280; }
    .cmd { font-size: 11px; fill: #6b7280; font-family: 'SF Mono', 'Fira Code', monospace; }
    .box { rx: 8; stroke-width: 1.5; }
    .box-preview { fill: #eff6ff; stroke: #3b82f6; }
    .box-prod { fill: #fff7ed; stroke: #f6821f; }
    .box-trigger { fill: #f9fafb; stroke: #d1d5db; }
    .box-action { fill: #f0fdf4; stroke: #22c55e; }
    .arrow { stroke: #9ca3af; stroke-width: 2; fill: none; marker-end: url(#arr); }
    .row-label { font-size: 11px; fill: #9ca3af; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .title { font-size: 14px; fill: #1a1a1a; font-weight: 600; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="18" text-anchor="middle" class="title">With Workers Builds</text>

  <!-- Feature branch row -->
  <text x="18" y="58" class="row-label">Feature</text>
  <text x="18" y="70" class="row-label">branch</text>

  <rect x="90" y="40" width="120" height="46" class="box box-trigger"/>
  <text x="150" y="60" text-anchor="middle" class="label">git push</text>
  <text x="150" y="74" text-anchor="middle" class="sublabel">feature branch</text>

  <line x1="210" y1="63" x2="250" y2="63" class="arrow"/>

  <rect x="258" y="40" width="130" height="46" class="box box-trigger"/>
  <text x="323" y="60" text-anchor="middle" class="label">Builds runs</text>
  <text x="323" y="74" text-anchor="middle" class="sublabel">build command</text>

  <line x1="388" y1="63" x2="428" y2="63" class="arrow"/>

  <rect x="436" y="40" width="130" height="46" class="box box-preview"/>
  <text x="501" y="58" text-anchor="middle" class="label" style="fill: #1e40af;">Preview</text>
  <text x="501" y="74" text-anchor="middle" class="sublabel">isolated bindings</text>

  <line x1="566" y1="63" x2="606" y2="63" class="arrow"/>

  <rect x="614" y="40" width="130" height="46" class="box box-action"/>
  <text x="679" y="58" text-anchor="middle" class="label" style="fill: #15803d;">Test</text>
  <text x="679" y="74" text-anchor="middle" class="sublabel">preview URL</text>

  <!-- Divider -->
  <line x1="90" y1="108" x2="744" y2="108" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Main branch row -->
  <text x="18" y="148" class="row-label">Main</text>
  <text x="18" y="160" class="row-label">branch</text>

  <rect x="90" y="130" width="120" height="46" class="box box-trigger"/>
  <text x="150" y="150" text-anchor="middle" class="label">Merge PR</text>
  <text x="150" y="164" text-anchor="middle" class="sublabel">to main</text>

  <line x1="210" y1="153" x2="250" y2="153" class="arrow"/>

  <rect x="258" y="130" width="130" height="46" class="box box-trigger"/>
  <text x="323" y="150" text-anchor="middle" class="label">Builds runs</text>
  <text x="323" y="164" text-anchor="middle" class="sublabel">build command</text>

  <line x1="388" y1="153" x2="428" y2="153" class="arrow"/>

  <rect x="436" y="130" width="130" height="46" class="box box-prod"/>
  <text x="501" y="148" text-anchor="middle" class="cmd">wrangler deploy</text>
  <text x="501" y="164" text-anchor="middle" class="sublabel">production bindings</text>

  <line x1="566" y1="153" x2="606" y2="153" class="arrow"/>

  <rect x="614" y="130" width="130" height="46" class="box box-prod"/>
  <text x="679" y="150" text-anchor="middle" class="label" style="fill: #c2410c;">Production</text>
  <text x="679" y="164" text-anchor="middle" class="sublabel">live at 100%</text>

  <!-- Legend -->
  <rect x="310" y="194" width="10" height="10" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="326" y="203" class="sublabel">Preview</text>
  <rect x="400" y="194" width="10" height="10" rx="2" fill="#fff7ed" stroke="#f6821f" stroke-width="1"/>
  <text x="416" y="203" class="sublabel">Production</text>
</svg>
