<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .label { font-size: 13px; fill: #1a1a1a; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #6b7280; }
    .cmd { font-size: 11px; fill: #6b7280; font-family: 'SF Mono', 'Fira Code', monospace; }
    .box { rx: 8; stroke-width: 1.5; }
    .box-preview { fill: #eff6ff; stroke: #3b82f6; }
    .box-prod { fill: #fff7ed; stroke: #f6821f; }
    .box-trigger { fill: #f9fafb; stroke: #d1d5db; }
    .box-action { fill: #f0fdf4; stroke: #22c55e; }
    .arrow { stroke: #9ca3af; stroke-width: 2; fill: none; marker-end: url(#arr); }
    .arrow-merge { stroke: #9ca3af; stroke-width: 2; fill: none; stroke-dasharray: 6,4; marker-end: url(#arr); }
    .row-label { font-size: 11px; fill: #9ca3af; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .title { font-size: 14px; fill: #1a1a1a; font-weight: 600; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="18" text-anchor="middle" class="title">Without Workers Builds (Wrangler CLI)</text>

  <!-- Feature branch row -->
  <text x="18" y="60" class="row-label">Feature</text>
  <text x="18" y="72" class="row-label">branch</text>

  <rect x="90" y="40" width="150" height="46" class="box box-trigger"/>
  <text x="165" y="58" text-anchor="middle" class="label">Write code</text>
  <text x="165" y="74" text-anchor="middle" class="sublabel">on feature branch</text>

  <line x1="240" y1="63" x2="280" y2="63" class="arrow"/>

  <rect x="288" y="40" width="160" height="46" class="box box-preview"/>
  <text x="368" y="58" text-anchor="middle" class="cmd">wrangler preview</text>
  <text x="368" y="74" text-anchor="middle" class="sublabel">isolated bindings</text>

  <line x1="448" y1="63" x2="488" y2="63" class="arrow"/>

  <rect x="496" y="40" width="110" height="46" class="box box-action"/>
  <text x="551" y="58" text-anchor="middle" class="label" style="fill: #15803d;">Test</text>
  <text x="551" y="74" text-anchor="middle" class="sublabel">preview URL</text>

  <!-- Divider -->
  <line x1="90" y1="110" x2="620" y2="110" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Main branch row -->
  <text x="18" y="155" class="row-label">Main</text>
  <text x="18" y="167" class="row-label">branch</text>

  <rect x="90" y="135" width="150" height="46" class="box box-trigger"/>
  <text x="165" y="155" text-anchor="middle" class="label">Merge to main</text>
  <text x="165" y="169" text-anchor="middle" class="sublabel">checkout main</text>

  <line x1="240" y1="158" x2="280" y2="158" class="arrow"/>

  <rect x="288" y="135" width="160" height="46" class="box box-prod"/>
  <text x="368" y="153" text-anchor="middle" class="cmd">wrangler deploy</text>
  <text x="368" y="169" text-anchor="middle" class="sublabel">production bindings</text>

  <line x1="448" y1="158" x2="488" y2="158" class="arrow"/>

  <rect x="496" y="135" width="160" height="46" class="box box-prod"/>
  <text x="576" y="155" text-anchor="middle" class="label" style="fill: #c2410c;">Production</text>
  <text x="576" y="169" text-anchor="middle" class="sublabel">live at 100%</text>

  <!-- Legend -->
  <rect x="690" y="54" width="10" height="10" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="706" y="63" class="sublabel">Preview</text>
  <rect x="690" y="74" width="10" height="10" rx="2" fill="#fff7ed" stroke="#f6821f" stroke-width="1"/>
  <text x="706" y="83" class="sublabel">Production</text>
</svg>
