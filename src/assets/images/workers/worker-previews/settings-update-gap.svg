<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 210" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .label { font-size: 13px; fill: #1a1a1a; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #6b7280; }
    .cmd { font-size: 11px; fill: #6b7280; font-family: 'SF Mono', 'Fira Code', monospace; }
    .heading { font-size: 14px; fill: #1a1a1a; font-weight: 600; }
    .box { rx: 8; stroke-width: 1.5; }
    .box-preview { fill: #eff6ff; stroke: #3b82f6; }
    .box-bad { fill: #fef2f2; stroke: #ef4444; }
    .box-good { fill: #f0fdf4; stroke: #22c55e; }
    .box-trigger { fill: #f9fafb; stroke: #d1d5db; }
    .box-manual { fill: #faf5ff; stroke: #a855f7; }
    .arrow { stroke: #9ca3af; stroke-width: 2; fill: none; marker-end: url(#arr); }
    .arrow-red { stroke: #ef4444; stroke-width: 2; fill: none; marker-end: url(#arr-red); }
    .arrow-green { stroke: #22c55e; stroke-width: 2; fill: none; marker-end: url(#arr-green); }
    .row-label { font-size: 11px; fill: #9ca3af; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="430" y="22" text-anchor="middle" class="heading">Wrangler: editing config does not update Preview Defaults automatically</text>

  <!-- WRONG ROW -->
  <rect x="30" y="48" width="56" height="20" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="58" y="62" text-anchor="middle" class="sublabel" style="fill: #dc2626; font-weight: 600; font-size: 10px;">Wrong</text>

  <rect x="110" y="42" width="180" height="46" class="box box-trigger"/>
  <text x="200" y="60" text-anchor="middle" class="cmd">edit previews block</text>
  <text x="200" y="74" text-anchor="middle" class="sublabel">in wrangler.jsonc</text>

  <line x1="290" y1="65" x2="326" y2="65" class="arrow-red"/>

  <rect x="334" y="42" width="180" height="46" class="box box-preview"/>
  <text x="424" y="60" text-anchor="middle" class="cmd">wrangler preview</text>
  <text x="424" y="74" text-anchor="middle" class="sublabel">runs immediately</text>

  <line x1="514" y1="65" x2="550" y2="65" class="arrow-red"/>

  <rect x="558" y="42" width="230" height="46" class="box box-bad"/>
  <text x="673" y="60" text-anchor="middle" class="label" style="fill: #dc2626;">Uses old defaults</text>
  <text x="673" y="74" text-anchor="middle" class="sublabel">Local config was never pushed to API</text>

  <!-- Divider -->
  <line x1="110" y1="108" x2="788" y2="108" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- CORRECT ROW -->
  <rect x="30" y="128" width="56" height="20" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="58" y="142" text-anchor="middle" class="sublabel" style="fill: #15803d; font-weight: 600; font-size: 10px;">Correct</text>

  <rect x="110" y="122" width="140" height="46" class="box box-trigger"/>
  <text x="180" y="140" text-anchor="middle" class="cmd">edit previews block</text>
  <text x="180" y="154" text-anchor="middle" class="sublabel">in wrangler.jsonc</text>

  <line x1="250" y1="145" x2="272" y2="145" class="arrow-green"/>

  <rect x="280" y="122" width="186" height="46" class="box box-manual"/>
  <text x="373" y="140" text-anchor="middle" class="cmd">wrangler preview</text>
  <text x="373" y="154" text-anchor="middle" class="cmd">settings update</text>

  <line x1="466" y1="145" x2="488" y2="145" class="arrow-green"/>

  <rect x="496" y="122" width="140" height="46" class="box box-preview"/>
  <text x="566" y="140" text-anchor="middle" class="cmd">wrangler preview</text>
  <text x="566" y="154" text-anchor="middle" class="sublabel">runs</text>

  <line x1="636" y1="145" x2="658" y2="145" class="arrow-green"/>

  <rect x="666" y="122" width="122" height="46" class="box box-good"/>
  <text x="727" y="140" text-anchor="middle" class="label" style="fill: #15803d;">Correct</text>
  <text x="727" y="154" text-anchor="middle" class="sublabel">new defaults applied</text>

  <!-- Legend -->
  <line x1="110" y1="186" x2="788" y2="186" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="290" y="194" width="10" height="10" rx="2" fill="#faf5ff" stroke="#a855f7" stroke-width="1"/>
  <text x="306" y="203" class="sublabel">Required sync step</text>
  <rect x="440" y="194" width="10" height="10" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="456" y="203" class="sublabel">Preview command</text>
</svg>
