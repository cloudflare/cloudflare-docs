"295" y="128" class="annotation" text-anchor="middle">or internal buffering</text><text x="40" y="165" class="sublabel">When a 7th connection is opened, a brief gap where there is no I/O makes</text><text x="40" y="180" class="sublabel">the connection appear idle — so it gets canceled, even though the Worker</text><text x="40" y="195" class="sublabel">is still using it.</text><rect width="740" height="32" x="40" y="215" fill="#f9fafb" stroke="#e5e7eb" rx="6"/><rect width="24" height="14" x="58" y="224" fill="#fff7ed" stroke="#fdba74" rx="3"/><text x="89" y="235" class="sublabel">Bytes flowing</text><rect width="24" height="14" x="200" y="224" fill="#f3f4f6" stroke="#d1d5db" stroke-dasharray="3 2" rx="3"/><text x="231" y="235" class="sublabel">Brief pause (appears idle)</text><rect width="24" height="14" x="420" y="224" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="3 2" rx="3"/><text x="451" y="235" class="sublabel">Canceled by runtime</text></svg>