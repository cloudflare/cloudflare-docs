custom_style_guide:
  enabled: true
  check_status_upon_review_failure: success
reviewer:
  limit_num_reviews: 2
  limit_num_comments: 7
  custom_comment: "Howdy and thanks for contributing to our repo. We review new, external PRs within **two (2) weeks**. If it's been two weeks or longer without any movement, please tag the PR **Assignees** in a comment.\n\nWe review internal PRs within **1 week**. If it's something urgent or has been sitting without a comment, start a thread in the *Developer Docs* space internally."
openapi:
  enabled: true
  urls:
    - https://raw.githubusercontent.com/cloudflare/api-schemas/main/openapi.json
