openapi: 3.0.0
info:
  title: Cloudflare Realtime API
  version: "1.0"
externalDocs:
  description: Find out more about Cloudflare Realtime
  url: https://developers.cloudflare.com/realtime/
servers:
  - url: https://rtc.live.cloudflare.com/v1
paths:
  /apps/{appId}/sessions/new:
    post:
      tags:
        - New Session
      summary: Create a session
      description: >
        With no request body, this operation returns a sessionId without establishing
        a WebRTC connection. Create the session when ready to begin SDP negotiation.
        An unconnected session can expire before its first use.
      security:
        - secret: []
      parameters:
        - in: path
          name: appId
          schema:
            type: string
          required: true
          description: WebRTC application ID
        - in: query
          name: thirdparty
          schema:
            type: boolean
          description: Session is intended to connect to an ICE-lite peer like a third party SFU/server
        - in: query
          name: correlationId
          schema:
            type: string
          description: >
            Associate a diagnostic label with the new session. This is not an idempotency key:
            repeating a request with the same value creates a separate session. The Connection
            API does not provide lookup by correlationId. Retain the returned sessionId.
      responses:
        "201":
          description: Created
          headers:
            vary:
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/NewSessionResponse"
                  - example:
                      sessionId: e017a2629c754fedc1f7d8587e06d126
  /apps/{appId}/adapters/websocket/new:
    post:
      tags:
        - Create adapter(s)
      summary: Create WebSocket adapter(s) for ingest or stream
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAdapterRequest"
            examples:
              local_ingest:
                description: Ingest audio from a WebSocket endpoint to create a new WebRTC track
                value:
                  tracks:
                    - location: local
                      trackName: tts-track
                      endpoint: wss://example.com/ingest
                      inputCodec: pcm
                      mode: buffer
              remote_stream_audio:
                description: Stream an existing WebRTC audio track to a WebSocket endpoint
                value:
                  tracks:
                    - location: remote
                      sessionId: 2a45361d5fd7cc14eface0587c276c94
                      trackName: mic-track
                      endpoint: wss://example.com/stream-audio
                      outputCodec: pcm
                      mode: stream
              remote_stream_video:
                description: Stream an existing WebRTC video track as JPEG to a WebSocket endpoint
                value:
                  tracks:
                    - location: remote
                      sessionId: 2a45361d5fd7cc14eface0587c276c94
                      trackName: camera-track
                      endpoint: wss://example.com/stream-video
                      outputCodec: jpeg
                      mode: stream
        required: true
      security:
        - secret: []
      parameters:
        - in: path
          name: appId
          schema:
            type: string
          required: true
          description: WebRTC application ID
      responses:
        "200":
          description: At least one item succeeded. Inspect every tracks entry for item-level errors.
          headers:
            vary:
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewAdapterResponse"
              examples:
                local_ingest:
                  value:
                    tracks:
                      - trackName: tts-track
                        adapterId: 4e66a9d5a35e4a0899f6f8d0b63a35c1
                        sessionId: d6f73f6f0c6645a7bb8f74e3fcb00a2f
                        endpoint: wss://example.com/ingest
                remote_stream:
                  value:
                    tracks:
                      - trackName: mic-track
                        adapterId: 2b2ff7d2e17a4d638be5b6e3075ed6ce
                        endpoint: wss://example.com/stream-audio
                partial_success:
                  description: A successful allocation and a failed item can share an HTTP 200 response.
                  value:
                    tracks:
                      - trackName: mic-track
                        adapterId: <ADAPTER_ID>
                        endpoint: wss://example.com/stream-audio
                      - trackName: camera-track
                        errorCode: websocket_handshake_failed
                        errorDescription: The handshake with the provided endpoint failed.
        "503":
          description:
            No requested adapter could be created. Inspect each item errorCode and
            errorDescription; per-item HTTP status codes are not returned.
          headers:
            vary:
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewAdapterResponse"
              example:
                tracks:
                  - trackName: mic-track
                    errorCode: websocket_handshake_failed
                    errorDescription: The handshake with the provided endpoint failed.
        "400":
          description: The JSON body or its field types could not be decoded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterRequestError"
              example:
                errorCode: decoding_error
                errorDescription: The request could not be decoded.
        "406":
          description:
            The request has invalid parameters, missing required values, an invalid endpoint, or a
            track count outside one to four.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterRequestError"
              example:
                errorCode: invalid_params
                errorDescription: Expecting at most 4 track in the request
      description:
        Create one to four unidirectional WebSocket adapters. Ingest accepts PCM audio and
        allocates a publishing session. Egress reads an existing audio or video track. The response
        may contain both successful allocations and item errors; save successful adapter IDs before
        retrying failed work.
  /apps/{appId}/adapters/websocket/close:
    post:
      tags:
        - Close adapter(s)
      summary: Close WebSocket adapter(s)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseAdapterRequest"
            example:
              tracks:
                - adapterId: 4e66a9d5a35e4a0899f6f8d0b63a35c1
        required: true
      security:
        - secret: []
      parameters:
        - in: path
          name: appId
          schema:
            type: string
          required: true
          description: WebRTC application ID
      responses:
        "200":
          description: At least one item succeeded. Inspect every tracks entry for item-level errors.
          headers:
            vary:
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseAdapterResponse"
              example:
                tracks:
                  - adapterId: 4e66a9d5a35e4a0899f6f8d0b63a35c1
                    bytesProcessed: 83492
        "503":
          description:
            No requested adapter could be closed. Inspect each item errorCode and errorDescription;
            per-item HTTP status codes are not returned.
          headers:
            vary:
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseAdapterResponse"
              example:
                tracks:
                  - adapterId: 4e66a9d5a35e4a0899f6f8d0b63a35c1
                    errorCode: adapter_not_found
                    errorDescription: Adapter not found
        "400":
          description: The JSON body or its field types could not be decoded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterRequestError"
              example:
                errorCode: decoding_error
                errorDescription: The request could not be decoded.
        "406":
          description: The request has an empty or missing adapter ID, or a track count outside one to four.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterRequestError"
              example:
                errorCode: invalid_params
                errorDescription: Expecting at most 4 track in the request
      description:
        Close one to four adapters and inspect every item result. An absent or already-closed
        adapter may return adapter_not_found. If every item fails, including already-absent items,
        the outer response is 503. Do not treat every 503 response as successful cleanup.
  /apps/{appId}/sessions/{sessionId}/tracks/new:
    post:
      tags:
        - Add a track
      summary: Solve the given track object(s) and add the track(s) to the WebRTC session
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TracksRequest"
            examples:
              local_tracks:
                description: Share a track to be played by remote peers
                value:
                  sessionDescription:
                    sdp: |
                      v=0
                      o=- 0 0 IN IP4 127.0.0.1
                      s=-
                      c=IN IP4 127.0.0.1
                      t=0 0
                      m=audio 4000 RTP/AVP 111
                      a=rtpmap:111 OPUS/48000/2
                      m=video 4002 RTP/AVP 96
                      a=rtpmap:96 VP8/90000
                      ...
                    type: offer
                  tracks:
                    - location: local
                      mid: "4"
                      trackName: 1a037563-c35c-4bf6-a9ee-2b474cbb9a51
              remote_tracks:
                description: Play a track from a remote peer
                value:
                  tracks:
                    - location: remote
                      sessionId: 2a45361d5fd7cc14eface0587c276c94
                      trackName: 2e037563-a35d-4bf6-a9ee-2d474cbb9a58
              push_track_with_bidirectional_stream:
                description: Share a track through a bidirectional transceiver
                value:
                  sessionDescription:
                    sdp: |
                      v=0
                      o=- 0 0 IN IP4 127.0.0.1
                      s=-
                      c=IN IP4 127.0.0.1
                      t=0 0
                      m=audio 4000 RTP/AVP 111
                      a=rtpmap:111 OPUS/48000/2
                      m=video 4002 RTP/AVP 96
                      a=rtpmap:96 VP8/90000
                      ...
                    type: offer
                  tracks:
                    - location: local
                      mid: "0"
                      trackName: mic-1
                      bidirectionalMediaStream: true
                      kind: "audio"
              push_track_without_an_offer:
                description: SFU can generate an offer to push a local track
                value:
                  tracks:
                    - location: local
                      trackName: mic-1
                      kind: "audio"
              push_tracks_with_autodiscover:
                description: SFU detects any new track in the offered SDP
                value:
                  autoDiscover: true
                  sessionDescription:
                    sdp: |
                      v=0
                      o=- 0 0 IN IP4 127.0.0.1
                      s=-
                      c=IN IP4 127.0.0.1
                      t=0 0
                      m=audio 4000 RTP/AVP 111
                      a=rtpmap:111 OPUS/48000/2
                      m=video 4002 RTP/AVP 96
                      a=rtpmap:96 VP8/90000
                      ...
                    type: offer
              pull_track_with_bidirectional_stream:
                description: Pull a track through an existing bidirectional transceiver identified by a mid
                value:
                  tracks:
                    - location: remote
                      mid: "#mic-1"
                      sessionId: 2a45361d5fd7cc14eface0587c276c94
                      trackName: generated-audio
                      kind: "audio"
              remote_track_with_simulcast:
                description: Pull a remote track with simulcast preferences
                value:
                  tracks:
                    - location: remote
                      sessionId: 2a45361d5fd7cc14eface0587c276c94
                      trackName: simulcast-video-track
                      simulcast:
                        preferredRid: "h"
                        priorityOrdering: "asciibetical"
                        ridNotAvailable: "asciibetical"
      security:
        - secret: []
      parameters:
        - in: path
          name: appId
          schema:
            type: string
          required: true
          description: WebRTC application ID
        - in: path
          name: sessionId
          schema:
            type: string
          required: true
          description: Current PeerConnection session ID
      responses:
        "200":
          description: OK
          headers:
            vary:
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TracksResponse"
              examples:
                local_tracks:
                  value:
                    requiresImmediateRenegotiation: false
                    tracks:
                      - trackName: 1a037563-c35c-4bf6-a9ee-2b474cbb9a51
                        mid: "4"
                    sessionDescription:
                      sdp: |
                        v=0
                        o=- 0 0 IN IP4 127.0.0.1
                        s=-
                        c=IN IP4 127.0.0.1
                        t=0 0
                        m=audio 4000 RTP/AVP 111
                        a=rtpmap:111 OPUS/48000/2
                        m=video 4002 RTP/AVP 96
                        a=rtpmap:96 VP8/90000
                        ...
                      type: answer
                remote_tracks:
                  value:
                    requiresImmediateRenegotiation: true
                    tracks:
                      - sessionId: 2a45361d5fd7cc14eface0587c276c94
                        trackName: 2e037563-a35d-4bf6-a9ee-2d474cbb9a58
                        mid: "7"
                    sessionDescription:
                      sdp: |
                        v=0
                        o=- 0 0 IN IP4 127.0.0.1
                        s=-
                        c=IN IP4 127.0.0.1
                        t=0 0
                        m=audio 4000 RTP/AVP 111
                        a=rtpmap:111 OPUS/48000/2
                        m=video 4002 RTP/AVP 96
                        a=rtpmap:96 VP8/90000
                        ...
                      type: offer
                remote_tracks_with_simulcast:
                  value:
                    requiresImmediateRenegotiation: true
                    tracks:
                      - sessionId: 2a45361d5fd7cc14eface0587c276c94
                        trackName: simulcast-video-track
                        mid: "5"
                        simulcast:
                          preferredRid: "h"
                          priorityOrdering: "asciibetical"
                          ridNotAvailable: "asciibetical"
                    sessionDescription:
                      sdp: |
                        v=0
                        o=- 0 0 IN IP4 127.0.0.1
                        s=-
                        c=IN IP4 127.0.0.1
                        t=0 0
                        m=video 4002 RTP/AVP 96
                        a=rtpmap:96 VP8/90000
                        a=simulcast:recv f;h;q
                        a=rid:f recv
                        a=rid:h recv
                        a=rid:q recv
                        ...
                      type: offer
  /apps/{appId}/sessions/{sessionId}/renegotiate:
    put:
      tags:
        - Renegotiate WebRTC session
      summary: When a previous response has requiresImmediateRenegotiation, you must renegotiate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenegotiateRequest"
            example:
              sessionDescription:
                sdp: |
                  v=0
                  o=- 0 0 IN IP4 127.0.0.1
                  s=-
                  c=IN IP4 127.0.0.1
                  t=0 0
                  m=audio 4000 RTP/AVP 111
                  a=rtpmap:111 OPUS/48000/2
                  m=video 4002 RTP/AVP 96
                  a=rtpmap:96 VP8/90000
                  ...
                type: answer
      security:
        - secret: []
      parameters:
        - in: path
          name: appId
          schema:
            type: string
          required: true
          description: WebRTC application ID
        - in: path
          name: sessionId
          schema:
            type: string
          required: true
      responses:
        "200":
          description: OK
          headers:
            vary:
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenegotiateResponse"
              example: {}
  /apps/{appId}/sessions/{sessionId}/tracks/close:
    put:
      tags:
        - Close a track
      summary: Close a local or remote track
      description: >
        Close media tracks identified by mids on the session in the URL. Closing a receiving
        track stops that subscription; closing a publishing track stops that source. A
        successful close of a bidirectional transceiver stops both directions. With
        force=false, provide an endpoint offer and apply the returned answer to complete
        negotiation. With force=true, no SDP exchange is required. Process each track result
        independently. A request-level failure can occur after individual tracks have closed.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseTracksRequest"
            examples:
              negotiated:
                summary: Close a track and complete an SDP exchange
                value:
                  tracks:
                    - mid: "7"
                  sessionDescription:
                    type: offer
                    sdp: "<ENDPOINT_OFFER_SDP>"
                  force: false
              forced:
                summary: Close tracks without an SDP exchange
                value:
                  tracks:
                    - mid: "0"
                    - mid: "1"
                    - mid: "2"
                  force: true
        required: true
      security:
        - secret: []
      parameters:
        - in: path
          name: appId
          schema:
            type: string
          required: true
          description: WebRTC application ID
        - in: path
          name: sessionId
          schema:
            type: string
          required: true
      responses:
        "200":
          description: OK
          headers:
            vary:
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseTracksResponse"
              examples:
                negotiated:
                  summary: Apply the returned answer to finish closure
                  value:
                    sessionDescription:
                      type: answer
                      sdp: "<SFU_ANSWER_SDP>"
                    requiresImmediateRenegotiation: false
                    tracks:
                      - mid: "7"
                forced:
                  summary: Successful forced closure
                  value:
                    requiresImmediateRenegotiation: false
                    tracks:
                      - mid: "0"
                      - mid: "1"
                      - mid: "2"
                already_closed:
                  summary: The identified track is absent or already closed
                  value:
                    requiresImmediateRenegotiation: false
                    tracks:
                      - mid: "7"
                        errorCode: close_track_error
                        errorDescription: Track doesn't exist or was already closed
                mixed:
                  summary: Successful close, already-closed item, and unresolved failure
                  value:
                    requiresImmediateRenegotiation: false
                    tracks:
                      - mid: "0"
                      - mid: "1"
                        errorCode: close_track_error
                        errorDescription: Track doesn't exist or was already closed
                      - mid: "2"
                        errorCode: internal_error
                        errorDescription: Backend error
  /apps/{appId}/sessions/{sessionId}/tracks/update:
    put:
      tags:
        - Change tracks
      summary: Change tracks by reusing existing transceivers
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTracksRequest"
            examples:
              reuse_transceiver:
                description: Reuse an existing transceiver for a new track
                value:
                  tracks:
                    - location: "remote"
                      sessionId: "2a45361d5fd7cc14eface0587c276c94"
                      trackName: "other-track-name"
                      mid: "7"
              reuse_with_simulcast:
                description: Reuse an existing transceiver with new simulcast preferences
                value:
                  tracks:
                    - location: "remote"
                      sessionId: "2a45361d5fd7cc14eface0587c276c94"
                      trackName: "simulcast-track"
                      mid: "8"
                      simulcast:
                        preferredRid: "h"
                        priorityOrdering: "asciibetical"
                        ridNotAvailable: "asciibetical"
      security:
        - secret: []
      parameters:
        - in: path
          name: appId
          schema:
            type: string
          required: true
          description: WebRTC application ID
        - in: path
          name: sessionId
          schema:
            type: string
          required: true
          description: Current PeerConnection session ID
      responses:
        "200":
          description: OK
          headers:
            vary:
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateTracksResponse"
              examples:
                success:
                  value:
                    requiresImmediateRenegotiation: false
                    tracks:
                      - mid: "7"
                        sessionId: "2a45361d5fd7cc14eface0587c276c94"
                        trackName: "new-track-name"
  /apps/{appId}/sessions/{sessionId}/datachannels/establish:
    post:
      tags:
        - Establish a data channel transport
      summary:
        Pull a server events channel to establish a data channel transport. It only allows to pull
        the server-events channel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstablishDataChannelsTransportRequest"
            examples:
              ask_for_an_offer:
                description: Ask for an offer to pull the server-events channel
                value:
                  dataChannel:
                    location: remote
                    dataChannelName: server-events
              send_an_offer:
                description: Send an offer with an application media section to pull the server-events channel
                value:
                  dataChannel:
                    location: remote
                    dataChannelName: server-events
                  sessionDescription:
                    sdp: |
                      v=0
                      o=- 0 0 IN IP4 127.0.0.1
                      s=-
                      c=IN IP4 127.0.0.1
                      t=0 0
                      m=application 9 UDP/DTLS/SCTP webrtc-datachannel
                      ...
                    type: offer
      security:
        - secret: []
      parameters:
        - in: path
          name: appId
          schema:
            type: string
          required: true
          description: WebRTC application ID
        - in: path
          name: sessionId
          schema:
            type: string
          required: true
          description: Current PeerConnection session ID
      responses:
        "200":
          description: OK
          headers:
            vary:
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstablishDataChannelsTransportResponse"
              examples:
                ask_for_an_offer:
                  description: Response shape with abbreviated SDP. Answer the actual offer returned by the SFU.
                  value:
                    requiresImmediateRenegotiation: true
                    dataChannel:
                      dataChannelName: server-events
                      id: 0
                    sessionDescription:
                      type: offer
                      sdp: |
                        v=0
                        o=- 0 0 IN IP4 127.0.0.1
                        s=-
                        c=IN IP4 127.0.0.1
                        t=0 0
                        m=application 9 UDP/DTLS/SCTP webrtc-datachannel
                        ...
                send_an_offer:
                  description: Response shape with abbreviated SDP. Apply the actual answer returned by the SFU.
                  value:
                    requiresImmediateRenegotiation: false
                    dataChannel:
                      dataChannelName: server-events
                      id: 0
                    sessionDescription:
                      sdp: |
                        v=0
                        o=- 0 0 IN IP4 127.0.0.1
                        s=-
                        c=IN IP4 127.0.0.1
                        t=0 0
                        m=application 9 UDP/DTLS/SCTP webrtc-datachannel
                        ...
                      type: answer
  /apps/{appId}/sessions/{sessionId}/datachannels/new:
    post:
      tags:
        - Add data channel(s)
      summary:
        Solve the given data channel object(s) and add the data channel(s) to the WebRTC session.
        It requires to have a data channels transport established
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataChannelsRequest"
            examples:
              local_datachannels:
                description: Share a data channel to be consumed by remote peers
                value:
                  dataChannels:
                    - location: local
                      dataChannelName: 1a037563-c35c-4bf6-a9ee-2b474cbb9a51
              local_datachannels_unordered:
                description: Share a reliable unordered data channel
                value:
                  dataChannels:
                    - location: local
                      dataChannelName: independent-events
                      ordered: false
              local_datachannels_unreliable:
                description: Share an unreliable unordered data channel for high-frequency state
                value:
                  dataChannels:
                    - location: local
                      dataChannelName: player-state
                      ordered: false
                      maxRetransmits: 0
              remote_datachannels:
                description: Consume a remote data channel
                value:
                  dataChannels:
                    - location: remote
                      waitForAck: true
                      sessionId: "2a45361d5fd7cc14eface0587c276c94"
                      dataChannelName: 1a037563-c35c-4bf6-a9ee-2b474cbb9a51
              remote_datachannels_can_reply:
                description: Consume a remote data channel and admit reverse traffic to the publisher
                value:
                  dataChannels:
                    - location: remote
                      canReply: true
                      sessionId: "2a45361d5fd7cc14eface0587c276c94"
                      dataChannelName: 1a037563-c35c-4bf6-a9ee-2b474cbb9a51
              remote_datachannels_unordered:
                description: Consume a remote reliable unordered data channel
                value:
                  dataChannels:
                    - location: remote
                      sessionId: "2a45361d5fd7cc14eface0587c276c94"
                      dataChannelName: independent-events
                      ordered: false
              remote_datachannels_unreliable:
                description: Consume a remote unreliable unordered data channel
                value:
                  dataChannels:
                    - location: remote
                      sessionId: "2a45361d5fd7cc14eface0587c276c94"
                      dataChannelName: player-state
                      ordered: false
                      maxRetransmits: 0
      security:
        - secret: []
      parameters:
        - in: path
          name: appId
          schema:
            type: string
          required: true
          description: WebRTC application ID
        - in: path
          name: sessionId
          schema:
            type: string
          required: true
          description: Current PeerConnection session ID
      responses:
        "200":
          description: OK
          headers:
            vary:
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataChannelsResponse"
              examples:
                local_datachannels:
                  value:
                    dataChannels:
                      - dataChannelName: 1a037563-c35c-4bf6-a9ee-2b474cbb9a51
                        location: local
                        id: 3
                remote_datachannels:
                  value:
                    dataChannels:
                      - sessionId: 2a45361d5fd7cc14eface0587c276c94
                        location: remote
                        dataChannelName: 1a037563-c35c-4bf6-a9ee-2b474cbb9a51
                        id: 4
  /apps/{appId}/sessions/{sessionId}/datachannels/update:
    put:
      tags:
        - Update data channel(s)
      summary: Update flags on already pulled remote data channel(s), such as granting or revoking canReply
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataChannelsRequest"
            examples:
              grant_can_reply:
                description: Grant return-to-publisher admission on a pulled remote data channel
                value:
                  dataChannels:
                    - location: remote
                      canReply: true
                      sessionId: "2a45361d5fd7cc14eface0587c276c94"
                      dataChannelName: 1a037563-c35c-4bf6-a9ee-2b474cbb9a51
              revoke_can_reply:
                description: Revoke return-to-publisher admission
                value:
                  dataChannels:
                    - location: remote
                      canReply: false
                      sessionId: "2a45361d5fd7cc14eface0587c276c94"
                      dataChannelName: 1a037563-c35c-4bf6-a9ee-2b474cbb9a51
      security:
        - secret: []
      parameters:
        - in: path
          name: appId
          schema:
            type: string
          required: true
          description: WebRTC application ID
        - in: path
          name: sessionId
          schema:
            type: string
          required: true
          description: Current PeerConnection session ID (the subscriber session that pulled the channel)
      responses:
        "200":
          description: OK
          headers:
            vary:
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataChannelsResponse"
              examples:
                grant_can_reply:
                  value:
                    dataChannels:
                      - sessionId: 2a45361d5fd7cc14eface0587c276c94
                        location: remote
                        dataChannelName: 1a037563-c35c-4bf6-a9ee-2b474cbb9a51
                        canReply: true
                        id: 4
  /apps/{appId}/sessions/{sessionId}/datachannels/close:
    put:
      tags:
        - Close data channel(s)
      summary: Close local or remote data channel(s)
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CloseDataChannelsRequest"
                - example:
                    dataChannels:
                      - id: 2
      security:
        - secret: []
      parameters:
        - in: path
          name: appId
          schema:
            type: string
          required: true
          description: WebRTC application ID
        - in: path
          name: sessionId
          schema:
            type: string
          required: true
      responses:
        "200":
          description: OK
          headers:
            vary:
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseDataChannelsResponse"
              example:
                dataChannels:
                  - location: remote
                    sessionId: 2a45361d5fd7cc14eface0587c276c94
                    dataChannelName: 1a037563-c35c-4bf6-a9ee-2b474cbb9a51
                    id: 2
  /apps/{appId}/sessions/{sessionId}:
    get:
      tags:
        - Get session state
      summary: Return the media tracks and DataChannels associated with the session
      description: >
        Inspect the current resource identifiers and statuses. Closed tracks can remain listed
        as inactive. This response does not contain SDP, signaling state, or an operation history.
        A request still in progress can change the state after this read; an empty resource list
        does not cancel an earlier request or establish that a timed-out allocation cannot finish.
      security:
        - secret: []
      parameters:
        - in: path
          name: appId
          schema:
            type: string
          required: true
          description: WebRTC application ID
        - in: path
          name: sessionId
          schema:
            type: string
          required: true
      responses:
        "200":
          description: OK
          headers:
            vary:
              schema:
                type: string
                example: Origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSessionStateResponse"
              example:
                tracks:
                  - location: local
                    mid: "2"
                    trackName: 1a037563-c35c-4bf6-a9ee-2b474cbb9a51
                    status: active
                  - location: remote
                    mid: "7"
                    sessionId: 2a45361d5fd7cc14eface0587c276c94
                    trackName: 2e037563-a35d-4bf6-a9ee-2d474cbb9a58
                    status: active
                dataChannels:
                  - location: remote
                    sessionId: 2a45361d5fd7cc14eface0587c276c94
                    dataChannelName: controls
                    id: 2
                    status: active

components:
  securitySchemes:
    secret:
      type: http
      scheme: bearer
  schemas:
    SessionDescription:
      type: object
      properties:
        sdp:
          type: string
        type:
          type: string
          enum:
            - answer
            - offer
    TrackObject:
      type: object
      properties:
        location:
          type: string
          enum:
            - local
            - remote
          description:
            If you want to share a track, it should be local. If you want to play a track shared by
            a remote agent, it should be remote
        mid:
          type: string
          description:
            mid associated to track's transceiver. It also can be prefixed with \# to reference an
            existing transceiver by its trackName
        sessionId:
          type: string
          description: Session ID of the track owner. It should be set for remote tracks only
        trackName:
          type: string
          description: Given name for the track
        bidirectionalMediaStream:
          type: boolean
          description:
            Make the associated transceiver bidirectional. This option works only when the SFU
            generates the offer
        kind:
          type: string
          description:
            Give a hint to the SFU about the transceiver kind. This is required when the SFU
            generates the offer
        simulcast:
          type: object
          description: Simulcast configuration for the track
          properties:
            preferredRid:
              type: string
              description: Preferred RID for simulcast streams
            priorityOrdering:
              type: string
              enum:
                - none
                - asciibetical
              default: none
              description:
                Controls what happens if there is not enough network resources available to send the
                preferredRid. 'none' means keep sending even if not enough bandwidth, 'asciibetical'
                uses a-z order to determine priority where a is most desirable and z is least
                desirable.
            ridNotAvailable:
              type: string
              enum:
                - none
                - asciibetical
              default: none
              description:
                Controls what happens when the rid currently being used or preferredRid is no longer
                being sent by the publisher. 'none' means do nothing, 'asciibetical' uses the next
                available layer after sorting the layers a-z.
    CloseTrackObject:
      type: object
      required:
        - mid
      properties:
        mid:
          type: string
          minLength: 1
          description: >
            The track transceiver's mid on the session being modified. Use that same mid to
            correlate a close result, whether this is a publishing or receiving session.
    TracksRequest:
      type: object
      properties:
        sessionDescription:
          $ref: "#/components/schemas/SessionDescription"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackObject"
        autoDiscover:
          type: boolean
          description: Assign a random track name to any new track in the offered SDP
    TracksResponse:
      type: object
      properties:
        errorCode:
          type: string
        errorDescription:
          type: string
        requiresImmediateRenegotiation:
          type: boolean
        sessionDescription:
          $ref: "#/components/schemas/SessionDescription"
        tracks:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/TrackObject"
              - properties:
                  errorCode:
                    type: string
                  errorDescription:
                    type: string
    NewSessionRequest:
      type: object
      properties:
        sessionDescription:
          $ref: "#/components/schemas/SessionDescription"
    NewSessionResponse:
      required:
        - sessionId
      type: object
      properties:
        errorCode:
          type: string
        errorDescription:
          type: string
        sessionDescription:
          type: object
          properties:
            sdp:
              type: string
            type:
              type: string
              enum:
                - answer
                - offer
        sessionId:
          type: string
    CloseTracksRequest:
      type: object
      required:
        - tracks
        - force
      description: >
        Close known media tracks on this session. For a negotiated close, stop the selected
        endpoint transceivers, create and set an offer, and provide it as sessionDescription.
        Forced closure skips that exchange; it does not complete a pending negotiation or
        cancel other requests already in progress.
      properties:
        sessionDescription:
          $ref: "#/components/schemas/SessionDescription"
        tracks:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CloseTrackObject"
        force:
          type: boolean
          description: >
            When true, stop the selected tracks' media flow without an SDP exchange. Closed
            records can remain in session information. When false, sessionDescription must
            contain the endpoint's offer; apply the returned answer before the next mutation.
            Packets already sent or buffered at endpoints are separate from future forwarding.
    CloseTracksResponse:
      type: object
      description: >
        Match tracks results to the requested mids on this session. A successful HTTP response
        can contain failed items. An item's close_track_error reports that resource is absent
        or already closed; retain other failed or unreported resources for cleanup. A
        request-level error without item results does not establish that all tracks are absent.
      properties:
        errorCode:
          type: string
        errorDescription:
          type: string
        sessionDescription:
          $ref: "#/components/schemas/SessionDescription"
        tracks:
          type: array
          description: Per-track results identified by the requested mid.
          items:
            allOf:
              - $ref: "#/components/schemas/CloseTrackObject"
              - properties:
                  errorCode:
                    type: string
                  errorDescription:
                    type: string
        requiresImmediateRenegotiation:
          type: boolean
          description: >
            Track closure returns false. A negotiated close returns an answer for the endpoint
            to apply; a forced close does not return SDP. This does not describe the completion
            of any earlier exchange.
    SessionResourceStatus:
      type: string
      enum:
        - active
        - inactive
        - initializing
      description: >
        active means the media track has not closed or become unavailable, or the DataChannel
        is open. inactive means the media track is closed or unavailable, or the DataChannel
        is no longer connecting or open. initializing means a DataChannel is still connecting.
        These values do not confirm packet delivery, playback, or SDP-answer acceptance.
    SessionDataChannelState:
      type: object
      properties:
        location:
          type: string
          enum:
            - local
            - remote
        sessionId:
          type: string
          description: Publisher session ID for a remote DataChannel.
        dataChannelName:
          type: string
          description: Name of the publication.
        id:
          type: integer
          description: Channel ID allocated on the inspected endpoint's session.
        status:
          $ref: "#/components/schemas/SessionResourceStatus"
    GetSessionStateResponse:
      type: object
      properties:
        errorCode:
          type: string
        errorDescription:
          type: string
        tracks:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/TrackObject"
              - properties:
                  status:
                    $ref: "#/components/schemas/SessionResourceStatus"
        dataChannels:
          type: array
          items:
            $ref: "#/components/schemas/SessionDataChannelState"
    RenegotiateRequest:
      type: object
      properties:
        sessionDescription:
          $ref: "#/components/schemas/SessionDescription"
    RenegotiateResponse:
      type: object
      properties:
        errorCode:
          type: string
        errorDescription:
          type: string
        sessionDescription:
          $ref: "#/components/schemas/SessionDescription"
    ChangeTracksRequest:
      type: object
      properties:
        tracks:
          type: object
          additionalProperties:
            allOf:
              - $ref: "#/components/schemas/TrackObject"
          description: Map of track IDs to track objects for changing tracks
        sessionDescription:
          $ref: "#/components/schemas/SessionDescription"
    UpdateTracksRequest:
      type: object
      properties:
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackObject"
          description: Array of track objects for updating tracks
        sessionDescription:
          $ref: "#/components/schemas/SessionDescription"
    UpdateTracksResponse:
      type: object
      properties:
        errorCode:
          type: string
        errorDescription:
          type: string
        requiresImmediateRenegotiation:
          type: boolean
        tracks:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/TrackObject"
              - properties:
                  errorCode:
                    type: string
                  errorDescription:
                    type: string
          description: Array of track objects with results
    AdapterObject:
      type: object
      properties:
        location:
          type: string
          enum:
            - local
            - remote
          description:
            Use local to ingest media from an external endpoint. Use remote to stream media from an
            existing WebRTC track.
        sessionId:
          type: string
          description:
            Publisher session ID. Required for remote requests; ignored on local requests. A
            successful local creation returns a newly allocated publishing session ID. Remote
            creation responses omit this field.
        trackName:
          type: string
          description: Track name to ingest into or stream from.
          minLength: 1
        endpoint:
          type: string
          description:
            Publicly reachable WebSocket endpoint. Custom WebSocket request headers and HTTP
            redirects are not supported. Use wss:// and authenticate the endpoint independently of
            the SFU API.
          minLength: 1
          format: uri
          pattern: ^wss?://
        outputCodec:
          type: string
          enum:
            - pcm
            - jpeg
          description:
            Codec for outgoing media on remote adapters. Use pcm for an Opus audio source track,
            decoded to 48 kHz stereo PCM, or jpeg for video.
        inputCodec:
          type: string
          enum:
            - pcm
          description: Codec for incoming media on local adapters.
        mode:
          type: string
          enum:
            - stream
            - buffer
          description:
            "Processing mode is selected by location: buffer for local audio ingest and stream for
            remote egress. Providing this field does not change the selected mode."
        adapterId:
          type: string
          description: Unique identifier of the adapter instance.
    AdapterStatObject:
      type: object
      properties:
        adapterId:
          type: string
          description: Unique identifier of the adapter instance.
        bytesProcessed:
          type: number
          description:
            Operational bytes-processed statistic at close. This value is not the authoritative
            billed-usage total.
    NewAdapterRequest:
      type: object
      properties:
        tracks:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AdapterObject"
              - type: object
                required:
                  - location
                  - trackName
                  - endpoint
                oneOf:
                  - properties:
                      location:
                        enum:
                          - local
                    required:
                      - inputCodec
                  - properties:
                      location:
                        enum:
                          - remote
                      sessionId:
                        type: string
                        minLength: 1
                    required:
                      - sessionId
                      - outputCodec
          minItems: 1
          maxItems: 4
      required:
        - tracks
    NewAdapterResponse:
      type: object
      properties:
        errorCode:
          type: string
        errorDescription:
          type: string
        tracks:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AdapterObject"
              - properties:
                  errorCode:
                    type: string
                  errorDescription:
                    type: string
    CloseAdapterRequest:
      type: object
      properties:
        tracks:
          type: array
          items:
            type: object
            properties:
              adapterId:
                type: string
                description: Adapter identifier to close.
                minLength: 1
            required:
              - adapterId
          minItems: 1
          maxItems: 4
      required:
        - tracks
    CloseAdapterResponse:
      type: object
      properties:
        errorCode:
          type: string
        errorDescription:
          type: string
        tracks:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AdapterStatObject"
              - properties:
                  errorCode:
                    type: string
                  errorDescription:
                    type: string
    DataChannelObject:
      type: object
      description: >
        The publisher chooses one delivery policy (ordered, maxRetransmits, and maxPacketLifeTime)
        for each named channel. Every subscriber must mirror that policy in its request, and each
        endpoint must configure its browser DataChannel accordingly. The application supplies these
        settings. Use separate named channels for different policies, including within one session
        or application. Asymmetric reliability is outside the supported contract. Channel IDs are
        endpoint-specific; waitForAck and canReply are subscription-specific.
      properties:
        location:
          type: string
          enum:
            - local
            - remote
          description:
            Choose local to broadcast into the given dataChannelName. Choose remote to consume a
            broadcast from someone else
        sessionId:
          type: string
          description: Session ID of the data channel owner. It should be set for remote data channels only
        dataChannelName:
          type: string
          description: Given name for the data channel
        ordered:
          type: boolean
          default: true
          description: >
            When true (default), messages are delivered in send order. When false, messages may
            arrive out of order without waiting for earlier messages. Omission means true.
            The publisher chooses this value for the named channel; every subscriber and each
            endpoint's createDataChannel() configuration must use the same ordering policy.
        maxRetransmits:
          type: integer
          minimum: 0
          description: >
            Maximum number of times the WebRTC transport may retransmit a message after the first
            send. 0 means no retransmissions and is different from omitting the retry limit.
            Mutually exclusive with maxPacketLifeTime. Omit both retry-limit fields for reliable
            delivery. Every subscriber request and browser DataChannel must mirror the publisher's
            choice of retry-limit field and value for this named channel. Reliable delivery does
            not provide durable storage or confirm command execution.
        maxPacketLifeTime:
          type: integer
          minimum: 0
          description: >
            Transport time budget in milliseconds for attempting transmission and retransmission
            of a message. This is not an end-to-end message-age deadline. Mutually exclusive with
            maxRetransmits. Omit both retry-limit fields for reliable delivery. Every subscriber
            request and browser DataChannel must mirror the publisher's choice of retry-limit
            field and value for this named channel.
        waitForAck:
          type: boolean
          default: false
          description: >
            For remote DataChannels only. When true, the SFU holds delivery to this subscriber until
            the subscriber sends its first message on this DataChannel (the acknowledgment). The
            acknowledgment is consumed by the SFU and is not forwarded. It must arrive within 30
            seconds of creating the remote DataChannel; otherwise the SFU tears down the gated
            channel. Ignored for local DataChannels.
        canReply:
          type: boolean
          default: false
          description: >
            For remote DataChannels only. When true, this subscriber may send reverse traffic on the
            DataChannel to the publisher. Reverse messages are delivered only to the publisher and
            are not fanned out to other subscribers. At most one subscriber may hold canReply for a
            given publisher DataChannel at a time; granting canReply to another subscriber replaces
            the previous selection. Set on datachannels/new at pull time, or grant and revoke later
            with datachannels/update. Ignored for local DataChannels.
        id:
          type: number
          description: Channel ID allocated on this endpoint's session. Publisher and subscriber IDs can differ.
    DataChannelsRequest:
      type: object
      properties:
        dataChannels:
          type: array
          items:
            $ref: "#/components/schemas/DataChannelObject"
    DataChannelsResponse:
      type: object
      properties:
        errorCode:
          type: string
        errorDescription:
          type: string
        dataChannels:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/DataChannelObject"
              - properties:
                  errorCode:
                    type: string
                  errorDescription:
                    type: string
    EstablishDataChannelsTransportRequest:
      type: object
      properties:
        sessionDescription:
          $ref: "#/components/schemas/SessionDescription"
        dataChannel:
          $ref: "#/components/schemas/DataChannelObject"
    EstablishDataChannelsTransportResponse:
      type: object
      properties:
        errorCode:
          type: string
        errorDescription:
          type: string
        sessionDescription:
          $ref: "#/components/schemas/SessionDescription"
        requiresImmediateRenegotiation:
          type: boolean
        dataChannel:
          $ref: "#/components/schemas/DataChannelObject"
    CloseDataChannelsRequest:
      type: object
      properties:
        dataChannels:
          type: array
          items:
            $ref: "#/components/schemas/DataChannelObject"
    CloseDataChannelsResponse:
      type: object
      properties:
        errorCode:
          type: string
        errorDescription:
          type: string
        dataChannels:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/DataChannelObject"
              - properties:
                  errorCode:
                    type: string
                  errorDescription:
                    type: string
    AdapterRequestError:
      type: object
      required:
        - errorCode
        - errorDescription
      properties:
        errorCode:
          type: string
        errorDescription:
          type: string
