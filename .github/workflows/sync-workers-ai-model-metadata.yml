name: Sync Workers AI model metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

concurrency:
  group: sync-workers-ai-model-metadata
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'cloudflare/cloudflare-docs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Generate Cloudflare Docs App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CLOUDFLARE_DOCS_BOT_APP_ID }}
          private-key: ${{ secrets.CLOUDFLARE_DOCS_BOT_APP_PRIVATE_KEY }}

      - name: Check out production
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: production
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize model metadata
        id: sync
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_AI_GATEWAY_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_AI_GATEWAY_TOKEN }}
        run: |
          summary_path="${RUNNER_TEMP}/workers-ai-model-sync.md"
          pnpm run sync:workers-ai-model-metadata -- --summary-file "${summary_path}"
          echo "summary-path=${summary_path}" >> "${GITHUB_OUTPUT}"
          if [[ -n "$(git status --porcelain -- src/content/workers-ai-models)" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate generated model files
        if: steps.sync.outputs.changed == 'true'
        run: pnpm run check

      # The App token allows the resulting pull_request event to run normal CI.
      # Pull requests created with GITHUB_TOKEN do not trigger other workflows.
      - name: Create or update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: production
          branch: automation/workers-ai-model-metadata
          delete-branch: true
          add-paths: src/content/workers-ai-models/*.json
          commit-message: "[Workers AI] Sync model metadata"
          title: "[Workers AI] Sync model metadata"
          body-path: ${{ steps.sync.outputs.summary-path }}
