name: Publish
on:
  push:
    branches:
      - production

concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'cloudflare/cloudflare-docs'
    name: Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.28.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        id: setup-node
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use merge queue build
        id: queue-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reuse() {
            echo "reused=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not reusing a merge queue build: $1"
            rm -rf dist
            exit 0
          }

          run_id=$(gh run list --workflow ci.yml --event merge_group --commit "$GITHUB_SHA" \
            --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success")][0].databaseId // empty')
          [ -n "$run_id" ] || reuse "no successful merge queue run for $GITHUB_SHA"

          gh run download "$run_id" --name dist --dir dist || reuse "could not download dist from run $run_id"

          grep -q 'data-domain-script="b1e05d49-f072-4bae-9116-bdb78af15448"' dist/index.html || reuse "OneTrust ID is not the production one"
          [ -f dist/.well-known/ard.json ] || reuse "dist/.well-known is missing"
          [ -f dist/.assetsignore ] || reuse "dist/.assetsignore is missing"

          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Reusing the build from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"

      # Full history is required for accurate "Last updated" dates on pages and
      # `lastmod` in the sitemap, both derived from `git log`.
      - name: Fetch full history
        if: steps.queue-build.outputs.reused != 'true'
        run: git fetch --unshallow

      - name: Restore Astro assets from cache
        if: steps.queue-build.outputs.reused != 'true'
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            node_modules/.astro/assets
          key: astro-assets-${{ hashFiles('src/assets/**') }}
          restore-keys: |
            astro-assets-

      - name: Build
        if: steps.queue-build.outputs.reused != 'true'
        run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_ENV: production

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        continue-on-error: true
        with:
          name: site-html
          path: dist

      - name: Notify Google Chat on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.CED_TEAM_ALERTS_CHANNEL_WEBHOOK }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Use jq to safely construct JSON payload
          MESSAGE="❌ *Publish Production* workflow failed.\nActor: $ACTOR\n<https://github.com/$REPO/actions/runs/$RUN_ID|View run>"
          JSON_PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text: $text}')

          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"
