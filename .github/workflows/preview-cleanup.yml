name: Preview cleanup

on:
  pull_request:
    types: [closed]

jobs:
  delete-worker-preview:
    name: Delete Worker Preview
    # Only same-repo PRs get a Preview (secrets are unavailable to forks).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.28.2

      - name: Set up node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete Worker Preview
        # Best effort: the Preview may not exist or may already be evicted.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          PREVIEW_NAME=$(pnpm exec tsx bin/preview-name.ts "$PR_HEAD_REF")
          pnpm exec wrangler preview delete --config wrangler.preview.json \
            --name "$PREVIEW_NAME" --skip-confirmation
