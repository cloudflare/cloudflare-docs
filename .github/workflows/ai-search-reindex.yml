name: AI Search Reindex

on:
  workflow_run:
    workflows: ["Publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force_full_reindex:
        description: "Rebuild the AI Search index from scratch (send every page, ignore the previous manifest)."
        type: boolean
        default: false

# Reindexing is a whole-site diff against a single shared manifest, so two runs
# must never overlap: both would restore the same baseline, and an upsert from
# the older run landing after a delete from the newer one would leave a stale
# page in the index. Queue instead of cancelling, because cancelling mid-send
# would abandon a partially delivered batch.
concurrency:
  group: ai-search-reindex
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  reindex:
    name: AI Search reindex
    if: >-
      github.repository == 'cloudflare/cloudflare-docs' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve published site
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_RUN_ID: ${{ github.event.workflow_run.id }}
          PUBLISHED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$PUBLISH_RUN_ID" ] || [ -z "$PUBLISHED_SHA" ]; then
            PUBLISH_RUN=$(gh run list --workflow publish-production.yml --branch production \
              --event push --status success --limit 1 --json databaseId,headSha --jq '.[0]')
            PUBLISH_RUN_ID=$(jq -r '.databaseId // empty' <<< "$PUBLISH_RUN")
            PUBLISHED_SHA=$(jq -r '.headSha // empty' <<< "$PUBLISH_RUN")
          fi
          : "${PUBLISH_RUN_ID:?No successful production publish found}"
          : "${PUBLISHED_SHA:?No successful production publish found}"
          echo "run_id=$PUBLISH_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$PUBLISHED_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Match the indexer code to the commit that produced the site artifact.
          ref: ${{ steps.published.outputs.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        id: setup-node
        with:
          node-version: 24.x
          cache: pnpm
      - name: Restore node_modules (cache hit)
        id: node-modules-cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('package.json') }}
      - name: Install node_modules (cache miss)
        run: pnpm install --frozen-lockfile
        if: steps.node-modules-cache.outputs.cache-hit != 'true'

      - name: Download published site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-html
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.published.outputs.run_id }}

      # Successful runs can lack an artifact when the reindex job was skipped,
      # so try recent runs until one contains a manifest.
      - name: Restore previous manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .ai-search
          restored=false
          for previous_run in $(gh run list --workflow ai-search-reindex.yml --branch production \
            --status success --limit 10 --json databaseId --jq '.[].databaseId' 2>/dev/null); do
            if gh run download "$previous_run" --name ai-search-manifest --dir .ai-search 2>/dev/null; then
              echo "Restored previous manifest from run $previous_run."
              restored=true
              break
            fi
          done
          if [ "$restored" != "true" ] && [ "${{ inputs.force_full_reindex }}" != "true" ]; then
            echo "No previous manifest artifact. Refusing to advance an empty baseline." >&2
            echo "Restore a prior manifest or manually run against a known-empty/reset instance with force_full_reindex=true." >&2
            exit 1
          fi

      - name: Reindex AI Search
        env:
          # The indexer sits behind Cloudflare Access, so the reindex call needs
          # an Access service token (send.ts sends these as CF-Access-Client-*).
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # Absolute URL of the indexer worker's reindex endpoint.
          REINDEX_URL: ${{ vars.AI_SEARCH_REINDEX_URL }}
        run: |
          : "${REINDEX_URL:?AI_SEARCH_REINDEX_URL repository variable is required}"
          : "${CF_ACCESS_CLIENT_ID:?CF_ACCESS_CLIENT_ID secret is required}"
          : "${CF_ACCESS_CLIENT_SECRET:?CF_ACCESS_CLIENT_SECRET secret is required}"

          EXTRA=""
          if [ "${{ inputs.force_full_reindex }}" = "true" ]; then
            EXTRA="--force-full-reindex"
          fi
          pnpm exec tsx bin/ai-search-doc-events.ts \
            --previous .ai-search/page-hashes.json \
            --manifest .ai-search/page-hashes.json \
            --batch-size 25 \
            --send-url "$REINDEX_URL" \
            $EXTRA

      - name: Save updated manifest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ai-search-manifest
          path: .ai-search/page-hashes.json
          retention-days: 7
          overwrite: true

      - name: Notify Google Chat on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.CED_TEAM_ALERTS_CHANNEL_WEBHOOK }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          MESSAGE="⚠️ *AI Search reindex* failed (site still deployed).\nActor: $ACTOR\n<https://github.com/$REPO/actions/runs/$RUN_ID|View run>"
          JSON_PAYLOAD=$(jq -n --arg text "$MESSAGE" '{text: $text}')
          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD"
