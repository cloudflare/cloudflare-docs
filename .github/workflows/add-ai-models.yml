name: Add AI models

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: add-ai-models
  cancel-in-progress: false

jobs:
  add-models:
    name: Check for new AI models
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.28.2

      - name: Set up node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch model data
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node bin/fetch-ai-models.js
          pnpm exec tsx bin/fetch-catalog-models.ts

      - name: Stage new models
        id: models
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/new-ai-models"
          manifest="$RUNNER_TEMP/new-ai-models.txt"
          mkdir -p "$destination"
          git ls-files --others --exclude-standard -- src/content/workers-ai-models src/content/catalog-models > "$manifest"
          while IFS= read -r file; do
            mkdir -p "$destination/$(dirname "$file")"
            cp "$file" "$destination/$file"
          done < "$manifest"
          git restore --source=HEAD --staged --worktree -- src/content/workers-ai-models src/content/catalog-models
          git clean -fd -- src/content/workers-ai-models src/content/catalog-models
          count=$(wc -l < "$manifest" | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Generate App token
        if: steps.models.outputs.count != '0'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CLOUDFLARE_DOCS_BOT_APP_ID }}
          private-key: ${{ secrets.CLOUDFLARE_DOCS_BOT_APP_PRIVATE_KEY }}

      - name: Open pull requests for new models
        if: steps.models.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          base=production
          bot_name="cloudflare-docs-bot[bot]"
          bot_email="cloudflare-docs-bot[bot]@users.noreply.github.com"
          destination="$RUNNER_TEMP/new-ai-models"
          manifest="$RUNNER_TEMP/new-ai-models.txt"
          basic_auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$basic_auth"
          git_auth() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic_auth" "$@"; }
          git fetch --no-tags --depth=1 origin "+refs/heads/$base:refs/remotes/origin/$base"
          while IFS= read -r model; do
            safe_model=$(printf '%s' "$model" | tr -cs '[:alnum:].-' '-')
            branch="bot/add-ai-model-$safe_model"
            if [ -n "$(gh pr list --head "$branch" --base "$base" --state open --json number --jq '.[0].number // empty')" ]; then
              continue
            fi
            remote_sha=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
            git checkout --force -B "$branch" "origin/$base"
            while IFS= read -r file; do
              if [ "$(basename "$file" .json)" = "$model" ]; then
                mkdir -p "$(dirname "$file")"
                cp "$destination/$file" "$file"
                git add "$file"
              fi
            done < "$manifest"
            git config user.name "$bot_name"
            git config user.email "$bot_email"
            git commit --no-verify -m "docs: add $model model"
            git_auth push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:refs/heads/$branch"
            gh pr create --base "$base" --head "$branch" --title "docs: add $model model" --body "Adds the newly published \`$model\` model data from the automated catalog sync."
          done < <(while IFS= read -r file; do basename "$file" .json; done < "$manifest" | sort -u)
