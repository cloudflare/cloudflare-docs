name: Auto Format (Apply)

# Part 2 of 2 of the auto-formatter (companion: auto-format-build.yml).
#
# Trust model. This runs in the base repo with the bot's credentials, after a
# run that was triggered by a pull request. Nothing from that run is trusted:
#   - The target PR is resolved from GitHub's run metadata (head sha + head
#     repo). No artifact selects where changes are pushed, and there is none.
#   - The changed-file list comes from the pull request files API.
#   - Formatting is recomputed here with the base branch's prettier, config,
#     plugins and ignore file. The PR's own tooling never runs; its files are
#     only read as text and formatted.
#   - The PR is checked out at the exact head sha, and the push is a plain
#     (non-force) push, so it is rejected if the branch moved.
#   - Untrusted values reach shell only through env vars, never `${{ }}`.
#   - The App token is minted last, only when there is something to push, and
#     limited to contents and pull-requests write.

on:
  workflow_run:
    workflows: ["Auto Format (Build)"]
    types: [completed]

permissions: {}

concurrency:
  group: auto-format-apply-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  apply:
    name: Format and push
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      ALLOWED_EXT: '\.(js|jsx|ts|tsx|mjs|css|json|yaml|yml|astro)$'
      BLOCKED: '^(\.github/|package\.json$|package-lock\.json$|pnpm-lock\.yaml$|\.npmrc$|patches/|\.husky/)'
    steps:
      - name: Resolve PR and changed files
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FILES_OUT: ${{ runner.temp }}/files.txt
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            core.setOutput('proceed', 'false');

            if (!/^[0-9a-f]{40}$/.test(run.head_sha ?? '')) return;

            const candidates = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'production',
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
              per_page: 100,
            });
            const matches = candidates.filter(
              (pr) =>
                pr.head.sha === run.head_sha &&
                pr.head.repo &&
                pr.head.repo.full_name === run.head_repository.full_name,
            );
            if (matches.length !== 1) {
              core.info('No single open PR matches this run; skipping.');
              return;
            }
            const pr = matches[0];
            if (!Number.isSafeInteger(pr.number) || pr.number < 1) return;
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(pr.head.repo.full_name)) return;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const allowedExt = new RegExp(process.env.ALLOWED_EXT);
            const blocked = new RegExp(process.env.BLOCKED);
            // Conservative path charset: also keeps prettier from reading any
            // name as a glob.
            const safePath = /^[A-Za-z0-9._\/-]+$/;
            const selected = files
              .filter((f) => f.status !== 'removed')
              .map((f) => f.filename)
              .filter(
                (p) =>
                  safePath.test(p) &&
                  !p.startsWith('/') &&
                  !p.startsWith('-') &&
                  !p.split('/').some((s) => s === '' || s === '.' || s === '..') &&
                  allowedExt.test(p) &&
                  !blocked.test(p),
              );
            if (selected.length === 0) {
              core.info('No formattable files in this PR.');
              return;
            }

            fs.writeFileSync(process.env.FILES_OUT, selected.join('\n') + '\n');
            const isFork = pr.head.repo.full_name !== `${owner}/${repo}`;
            core.setOutput('proceed', 'true');
            core.setOutput('number', String(pr.number));
            core.setOutput('sha', pr.head.sha);
            core.setOutput('ref', pr.head.ref);
            core.setOutput('full_name', pr.head.repo.full_name);
            core.setOutput('is_fork', String(isFork));

      # Trusted tooling: the base branch, never the PR.
      - name: Check out trusted tooling
        if: steps.pr.outputs.proceed == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      # The PR at its exact head sha. Files are read as text only.
      - name: Check out PR (pinned sha)
        if: steps.pr.outputs.proceed == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ${{ steps.pr.outputs.full_name }}
          ref: ${{ steps.pr.outputs.sha }}
          path: pr
          persist-credentials: false

      - name: Set up pnpm
        if: steps.pr.outputs.proceed == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.28.2
          package_json_file: trusted/package.json

      - name: Set up node
        if: steps.pr.outputs.proceed == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: trusted/pnpm-lock.yaml

      - name: Install trusted dependencies
        if: steps.pr.outputs.proceed == 'true'
        working-directory: trusted
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Overlay the PR's changed files onto the trusted tree, commit them to a
      # throwaway index, format with trusted config, and take the difference
      # as the formatting change.
      - name: Format with trusted prettier
        if: steps.pr.outputs.proceed == 'true'
        id: format
        run: |
          set -euo pipefail
          PR_ROOT=$(realpath pr)
          TRUSTED_ROOT=$(realpath trusted)

          # Resolve a path and require it to stay inside a root. Rejects
          # symlinks that point elsewhere.
          inside() {
            local root=$1 path=$2 resolved
            resolved=$(realpath -m -- "$path")
            [[ "$resolved" == "$root"/* ]]
          }

          files=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            src="pr/$f"
            if [ ! -f "$src" ] || [ -L "$src" ]; then
              echo "Skipping non-regular file: $f"
              continue
            fi
            if ! inside "$PR_ROOT" "$src"; then
              echo "Skipping path outside PR tree: $f"
              continue
            fi
            if ! inside "$TRUSTED_ROOT" "trusted/$f"; then
              echo "Skipping path outside trusted tree: $f"
              continue
            fi
            files+=("$f")
          done < "$RUNNER_TEMP/files.txt"

          if [ "${#files[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cd trusted
          git config user.name "format"
          git config user.email "format@localhost"
          for f in "${files[@]}"; do
            mkdir -p -- "$(dirname -- "$f")"
            cp -- "../pr/$f" "$f"
          done
          git add -- "${files[@]}"
          # Commit with hooks off; the base tree's own history stays untouched
          # in this runner-local checkout.
          git commit --no-verify -q -m "pr files" || true

          pnpm exec prettier --write --ignore-unknown --ignore-path .prettierignore -- "${files[@]}"

          mapfile -t changed < <(git diff --name-only -- "${files[@]}")
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "Nothing to format."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${changed[@]}" > "$RUNNER_TEMP/changed.txt"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Stage formatted files in the PR checkout
        if: steps.format.outputs.changed == 'true'
        run: |
          set -euo pipefail
          PR_ROOT=$(realpath pr)
          TRUSTED_ROOT=$(realpath trusted)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if echo "$f" | grep -qE "$BLOCKED" || ! echo "$f" | grep -qE "$ALLOWED_EXT"; then
              echo "::error::Refusing path: $f"
              exit 1
            fi
            for side in trusted pr; do
              if [ ! -f "$side/$f" ] || [ -L "$side/$f" ]; then
                echo "::error::Not a regular file: $side/$f"
                exit 1
              fi
            done
            if [[ "$(realpath -m -- "pr/$f")" != "$PR_ROOT"/* ]] ||
              [[ "$(realpath -m -- "trusted/$f")" != "$TRUSTED_ROOT"/* ]]; then
              echo "::error::Path escapes its tree: $f"
              exit 1
            fi
            cp -- "trusted/$f" "pr/$f"
          done < "$RUNNER_TEMP/changed.txt"

          cd pr
          xargs -d '\n' git add -- < "$RUNNER_TEMP/changed.txt"
          # Re-check what is actually staged.
          fail=0
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            if echo "$p" | grep -qE "$BLOCKED" || ! echo "$p" | grep -qE "$ALLOWED_EXT"; then
              echo "::error::Staged change touches disallowed path: $p"
              fail=1
            fi
          done < <(git diff --staged --name-only)
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          if git diff --staged --quiet; then
            echo "::error::Nothing staged after formatting."
            exit 1
          fi

      # Minted last: validation is done and there is something to push.
      - name: Generate App token
        if: steps.format.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CLOUDFLARE_DOCS_BOT_APP_ID }}
          private-key: ${{ secrets.CLOUDFLARE_DOCS_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Commit and push
        if: steps.format.outputs.changed == 'true'
        id: push
        working-directory: pr
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_REF: ${{ steps.pr.outputs.ref }}
          PR_REPO: ${{ steps.pr.outputs.full_name }}
          IS_FORK: ${{ steps.pr.outputs.is_fork }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$PR_REF" > /dev/null
          git config user.name "cloudflare-docs-bot[bot]"
          git config user.email "cloudflare-docs-bot[bot]@users.noreply.github.com"
          git commit --no-verify -m "style: format"

          # Hand the token to git through askpass, read from the environment,
          # so it is never written to disk or a remote URL.
          export GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          printf '#!/bin/sh\necho "$APP_TOKEN"\n' > "$GIT_ASKPASS"
          chmod +x "$GIT_ASKPASS"
          trap 'rm -f "$GIT_ASKPASS"' EXIT

          # Plain push (no force): rejected if the branch moved past the
          # commit we formatted.
          if git push "https://x-access-token@github.com/${PR_REPO}.git" "HEAD:refs/heads/${PR_REF}"; then
            echo "push_failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "push_failed=true" >> "$GITHUB_OUTPUT"
            [ "$IS_FORK" = "true" ] || exit 1
          fi

      - name: Comment on push failure
        if: steps.push.outputs.push_failed == 'true' && steps.pr.outputs.is_fork == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.PR_NUMBER, 10),
              body:
                'Could not push formatting changes to this fork. ' +
                'The contributor may have "Allow edits by maintainers" disabled.\n\n' +
                'Please run the formatter locally:\n\n' +
                '```\npnpm format\n```',
            });
