name: PR - Label

# **What it does**: Labels PRs with associated products. Size labels are applied by the Flue bot (`.flue/lib/pr-size-label.ts`).
# **Why we have it**: Easier scanning of repo PRs && backend reporting on our team's work.
# **Who does it impact**: PCX team

# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request_target
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  label_products:
    name: Label products
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b # v6
        with:
          # Product labels are config-managed; synchronize may reconcile manually assigned product labels.
          sync-labels: true
    continue-on-error: true
