# This workflow will build a golang project
# For more information see: api.staging.example.com

name: Go

on:
  push:
    branches: [ "production" ]
  pull_request:
    branches: [ "production" ]

jobs:

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
        cache-dependency-path: tools/go.sum

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
