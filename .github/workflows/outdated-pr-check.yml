name: PR Outdated Check

# **What it does**: Checks if a PR's branch is more than 24 hours out of date with production.
# **Why we have it**: Prevents merging PRs whose base has drifted from production for too long.
#                     Combined with the daily refresh job, the effective enforcement window is
#                     24–48 hours depending on when the PR was last rebased vs. the job schedule.
# **Who does it impact**: All contributors opening PRs against production.

# NOTE: pull_request_target is used instead of pull_request so that fork PRs can
# receive commit statuses (pull_request gives forks a read-only token). This is safe
# here because the workflow never checks out or executes any code from the PR — it only
# calls gh api. The danger with pull_request_target arises when you add
# `actions/checkout` with `ref: github.event.pull_request.head.sha`, which would run
# untrusted PR code with base-repo permissions. Do not add a checkout step here.
on:
  pull_request_target:
    branches:
      - production
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-outdated:
    name: Check outdated
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check if PR base is within 24 hours of production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          PR_SHA="${{ github.event.pull_request.head.sha }}"

          # Compare PR head against production to get the merge base
          COMPARE=$(gh api "/repos/${REPO}/compare/production...${PR_SHA}") || {
            echo "Compare API failed — skipping status post"
            exit 0
          }
          BEHIND_BY=$(echo "$COMPARE" | jq -r '.behind_by')

          if [ -z "$BEHIND_BY" ] || [ "$BEHIND_BY" = "null" ]; then
            echo "Unexpected API response — skipping status post"
            exit 0
          fi

          if [ "$BEHIND_BY" = "0" ]; then
            STATE="success"
            DESCRIPTION="Branch is up to date with production"
          else
            MERGE_BASE_DATE=$(echo "$COMPARE" | jq -r '.merge_base_commit.commit.committer.date')

            if [ -z "$MERGE_BASE_DATE" ] || [ "$MERGE_BASE_DATE" = "null" ]; then
              echo "Could not determine merge base date — skipping status post"
              exit 0
            fi

            MERGE_BASE_TS=$(date -d "$MERGE_BASE_DATE" +%s)
            NOW=$(date +%s)
            AGE=$((NOW - MERGE_BASE_TS))

            if [ "$AGE" -gt 86400 ]; then
              HOURS=$((AGE / 3600))
              STATE="failure"
              DESCRIPTION="Branch is ${HOURS}h out of date with production. Please rebase or merge."
            else
              STATE="success"
              DESCRIPTION="Branch is behind production but within the 24-hour grace period"
            fi
          fi

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/statuses/${PR_SHA}" \
            -f state="$STATE" \
            -f context="pr/outdated-check" \
            -f description="$DESCRIPTION" \
            || echo "Failed to post status — skipping"
