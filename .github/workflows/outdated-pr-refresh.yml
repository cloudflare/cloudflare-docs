name: Refresh PR Outdated Checks

# **What it does**: Refreshes the outdated status check for all open PRs once a day (~4am CT).
# **Why we have it**: Catches PRs that become outdated when production advances without any PR activity.
#                     Because this runs once daily, the effective enforcement window is 24–48 hours
#                     depending on when the PR was last rebased relative to the job's schedule.
# **Who does it impact**: All contributors with open PRs against production.

on:
  schedule:
    - cron: "0 10 * * *" # 4am CST (UTC-6); runs ~5am during CDT (UTC-5)
  workflow_dispatch:

jobs:
  refresh-outdated:
    name: Refresh outdated check for all open PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Refresh outdated status for all open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          # Get all open PRs targeting production
          PRS=$(gh pr list \
            --base production \
            --state open \
            --limit 500 \
            --json number,headRefOid)

          echo "$PRS" | jq -c '.[]' | while read -r PR; do
            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            PR_SHA=$(echo "$PR" | jq -r '.headRefOid')

            echo "Checking PR #${PR_NUMBER} (${PR_SHA:0:7})"

            COMPARE=$(gh api "/repos/${REPO}/compare/production...${PR_SHA}" 2>/dev/null) || {
              echo "  Skipping PR #${PR_NUMBER}: compare API failed"
              continue
            }

            BEHIND_BY=$(echo "$COMPARE" | jq -r '.behind_by')

            if [ "$BEHIND_BY" = "0" ]; then
              STATE="success"
              DESCRIPTION="Branch is up to date with production"
            else
              MERGE_BASE_DATE=$(echo "$COMPARE" | jq -r '.merge_base_commit.commit.committer.date')
              MERGE_BASE_TS=$(date -d "$MERGE_BASE_DATE" +%s)
              NOW=$(date +%s)
              AGE=$((NOW - MERGE_BASE_TS))

              if [ "$AGE" -gt 86400 ]; then
                HOURS=$((AGE / 3600))
                STATE="failure"
                DESCRIPTION="Branch is ${HOURS}h out of date with production. Please rebase or merge."
              else
                STATE="success"
                DESCRIPTION="Branch is behind production but within the 24-hour grace period"
              fi
            fi

            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/statuses/${PR_SHA}" \
              -f state="$STATE" \
              -f context="pr/outdated-check" \
              -f description="$DESCRIPTION" \
              || { echo "  Failed to post status for PR #${PR_NUMBER} — continuing"; true; }

            echo "  Posted: $STATE — $DESCRIPTION"
          done
