name: Code Example Review

# Trigger on PRs with "Review-Code" label or via comment commands
on:
  pull_request:
    types: [labeled]
    branches:
      - production
    paths:
      - "src/content/docs/**/*.md"
      - "src/content/docs/**/*.mdx"
  issue_comment:
    types: [created]

# Prevent duplicate runs on the same PR
concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-membership:
    name: Check Cloudflare Membership
    runs-on: ubuntu-latest
    outputs:
      is_member: ${{ steps.check_membership.outputs.is_member }}
    steps:
      - id: check_membership
        name: Check if user is Cloudflare org member
        run: 'curl --write-out ''%{http_code}'' --silent --output /dev/null -L -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/orgs/cloudflare/members/${{ github.actor }} | grep -q ''204'' && echo "is_member=true" >> $GITHUB_OUTPUT || echo "is_member=false" >> $GITHUB_OUTPUT'

  review:
    name: Code Example Review
    runs-on: ubuntu-latest
    needs: check-membership
    if: |
      needs.check-membership.outputs.is_member == 'true' &&
      (
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'Review-Code')) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request)
      )
    timeout-minutes: 15 # Prevent indefinite hanging
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Checkout PR code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run automated code review
        uses: anomalyco/opencode/github@9cfdbbb1afa2f183f3fb0507457297b317261990  # v1.1.41
        continue-on-error: true # Don't block PR if review fails
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: anthropic/claude-opus-4-5-20250514
          share: false
          token: ${{ secrets.GITHUB_TOKEN }}
          use_github_token: true
          prompt: |
            You are running in GitHub Actions automation. Do not ask questions or wait for user input.
            Run /review-code-examples to review all changed documentation files in this PR.
            Post findings as a PR comment when complete.
