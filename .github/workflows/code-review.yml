name: Code Example Review

# Trigger only on PRs targeting jun-test-code-review branch with markdown changes
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - jun-test-code-review
    paths:
      - "src/content/docs/**/*.md"
      - "src/content/docs/**/*.mdx"

# Prevent duplicate runs on the same PR
concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review code examples
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Prevent indefinite hanging
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run automated code review
        uses: anomalyco/opencode/github@latest
        continue-on-error: true # Don't block PR if review fails
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: anthropic/claude-opus-4-5-20250514
          share: false
          token: ${{ secrets.GITHUB_TOKEN }}
          use_github_token: true
          prompt: |
            You are running in GitHub Actions automation. Do not ask questions or wait for user input.
            Run /review-code-examples to review all changed documentation files in this PR.
            Post findings as a PR comment when complete.
