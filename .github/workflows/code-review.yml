name: Code Example Review

# Trigger only on PRs targeting production branch with markdown changes
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - production
    paths:
      - "src/content/docs/**/*.md"
      - "src/content/docs/**/*.mdx"

# Prevent duplicate runs on the same PR
concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review code examples
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Prevent indefinite hanging
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run automated code review
        uses: anomalyco/opencode/github@latest
        continue-on-error: true # Don't block PR if review fails
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: anthropic/claude-sonnet-4.5-20250514
          share: false
          token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            CONTEXT: You are running in GitHub Actions automation mode.

            STEP 1: Execute the review command with --automated flag

            Run: review-code-example --automated ${{ github.event.pull_request.html_url }}

            The --automated flag instructs the command to:
            - Skip all interactive prompts
            - Complete the review without waiting for user input
            - Generate a formatted GitHub PR comment
            - Exit immediately after generating the comment text

            STEP 2: Post or update the GitHub PR comment

            After the command outputs the formatted comment text:

            A) Check if a review comment already exists on this PR:
               
               COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
                 --jq '.[] | select(.body | contains("Code Review Complete")) | .id' | head -n1)

            B) If COMMENT_ID exists (not empty):
               Update the existing comment to preserve comment structure:
               
               gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID \
                 -X PATCH -f body="$(cat comment.md)"
               
               (where comment.md contains the generated comment text)

            C) If COMMENT_ID is empty (no existing comment):
               Create a new comment:
               
               gh pr comment ${{ github.event.pull_request.number }} \
                 --body-file comment.md

            D) Log success and exit:
               echo "✅ Review comment posted/updated on PR #${{ github.event.pull_request.number }}"

            CRITICAL REMINDERS:
            - The command generates the comment content (with timestamp, collapsed details, etc.)
            - Your job is to take that generated content and post/update it on GitHub
            - Do NOT make any file edits or commits
            - Do NOT create any PRs
            - Use the exact comment text generated by the command
            - Preserve the comment structure when updating (same headings, same <details> sections)
