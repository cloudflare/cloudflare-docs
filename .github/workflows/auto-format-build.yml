name: Auto Format (Build)

# Part 1 of 2 of the auto-formatter (companion: auto-format-apply.yml).
#
# This workflow runs on the pull request, so it must stay free of secrets and
# must not feed anything to the apply workflow. Apply works out the target PR
# and the formatting itself. This job only signals "a prettier-scoped file
# changed", via the workflow_run trigger.

on:
  pull_request:
    branches: [production]
    types: [opened, synchronize]
    paths:
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mjs"
      - "**/*.css"
      - "**/*.json"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.astro"

permissions: {}

concurrency:
  group: auto-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect formattable changes
    # Skip bot-authored commits to avoid loops.
    if: github.actor != 'cloudflare-docs-bot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Signal apply workflow
        run: echo "Prettier-scoped files changed; Auto Format (Apply) will format them."
