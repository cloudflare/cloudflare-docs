name: Incremental Build Preview

on:
  pull_request:
    branches:
      - production

env:
  INTEGRATION_R2_BUCKET: astro-partial-builds-integration
  BUILD_CACHE_R2_BUCKET: cloudflare-docs-production-build-cache

concurrency:
  group: incremental-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  incremental-build:
    name: Incremental Build
    # Only run for PRs from the same repo (not forks), same as the regular preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      # -- Install docs dependencies --
      - name: Restore node_modules (cache hit)
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('package.json') }}

      - name: Install node_modules (cache miss)
        run: npm ci
        if: steps.node-modules-cache.outputs.cache-hit != 'true'

      # -- Download astro-incremental-builds integration from R2 --
      - name: Download incremental builds integration from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ASTRO_PARTIAL_BUILDS_INTEGRATION_R2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ASTRO_PARTIAL_BUILDS_INTEGRATION_R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp "s3://${{ env.INTEGRATION_R2_BUCKET }}/latest.tgz" /tmp/astro-incremental-builds.tgz \
            --endpoint-url ${{ secrets.ASTRO_PARTIAL_BUILDS_INTEGRATION_R2_ENDPOINT }} \
            || { echo "::error::Failed to download astro-incremental-builds tarball from R2"; exit 1; }

      - name: Install incremental builds integration
        run: npm install /tmp/astro-incremental-builds.tgz --no-save

      # -- Restore previous build from R2 --
      - name: Download previous build from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUILD_CACHE_R2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUILD_CACHE_R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          mkdir -p .previous-build
          aws s3 cp "s3://${{ env.BUILD_CACHE_R2_BUCKET }}/latest.tar.gz" /tmp/previous-build.tar.gz \
            --endpoint-url ${{ secrets.BUILD_CACHE_R2_ENDPOINT }} || true
          if [ -f /tmp/previous-build.tar.gz ]; then
            tar -xzf /tmp/previous-build.tar.gz -C .previous-build
          fi

      # -- Run the build --
      - name: Restore Astro assets from cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.astro/assets
          key: astro-assets-${{ hashFiles('src/assets/**') }}
          restore-keys: |
            astro-assets-

      - name: Build
        run: INCREMENTAL_BUILD=1 npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -- Upload build to R2 for future incremental runs --
      - name: Upload build cache to R2
        if: success() && hashFiles('dist/index.html') != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUILD_CACHE_R2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUILD_CACHE_R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          tar -czf /tmp/build-cache.tar.gz dist/ $([ -d dist-meta ] && echo "dist-meta/")
          aws s3 cp /tmp/build-cache.tar.gz "s3://${{ env.BUILD_CACHE_R2_BUCKET }}/latest.tar.gz" --endpoint-url ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}

      # -- Deploy preview --
      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          SHORT_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${SHORT_SHA:0:8}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          npx wrangler deploy --dispatch-namespace preview-deployments --name "incr-${SHORT_SHA}"

      - name: Post preview URL on PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${{ steps.deploy.outputs.short_sha }}"
          PREVIEW_URL="https://incr-${SHORT_SHA}.preview.developers.cloudflare.com"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          # Check for existing incremental build comment
          EXISTING=$(gh api \
            "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("Incremental Build Preview"))) | .id' \
            | head -1)

          BODY="**Incremental Build Preview:** ${PREVIEW_URL}"

          if [ -n "$EXISTING" ]; then
            gh api \
              "repos/${{ github.repository }}/issues/comments/${EXISTING}" \
              -X PATCH -f body="$BODY"
          else
            gh api \
              "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -f body="$BODY"
          fi
