name: Incremental Build Preview

on:
  pull_request:
    branches:
      - production

concurrency:
  group: incremental-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  incremental-build:
    name: Incremental Build
    # Only run for PRs from the same repo (not forks), same as the regular preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10

      - name: Set up node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        id: setup-node
        with:
          node-version: 24.x
          cache: pnpm

      - name: Restore node_modules (cache hit)
        id: node-modules-cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('package.json') }}

      - name: Install node_modules (cache miss)
        run: pnpm install --frozen-lockfile
        if: steps.node-modules-cache.outputs.cache-hit != 'true'

      - name: Download previous build from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUILD_CACHE_R2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUILD_CACHE_R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          BUILD_CACHE_R2_ENDPOINT: ${{ secrets.BUILD_CACHE_R2_ENDPOINT }}
        run: |
          aws s3 cp "s3://cloudflare-docs-production-build-cache/latest.tar.gz" /tmp/previous-build.tar.gz \
            --endpoint-url "$BUILD_CACHE_R2_ENDPOINT" || true
          if [ -f /tmp/previous-build.tar.gz ]; then
            tar -xzf /tmp/previous-build.tar.gz
          fi

      - name: Restore Astro assets from cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            node_modules/.astro/assets
          key: astro-assets-${{ hashFiles('src/assets/**') }}
          restore-keys: |
            astro-assets-

      - name: Build
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_START=$(date +%s)
          INCREMENTAL_BUILD=1 pnpm run build 2>&1 | tee /tmp/build.log
          BUILD_END=$(date +%s)
          BUILD_DURATION=$((BUILD_END - BUILD_START))
          BUILD_MIN=$((BUILD_DURATION / 60))
          BUILD_SEC=$((BUILD_DURATION % 60))
          echo "duration=${BUILD_MIN}m ${BUILD_SEC}s" >> "$GITHUB_OUTPUT"

          # Detect build type from integration log output
          if grep -q "Full rebuild required" /tmp/build.log; then
            echo "build_type=full" >> "$GITHUB_OUTPUT"
          elif grep -q "Incremental build:" /tmp/build.log; then
            PAGES_REBUILT=$(grep "Incremental build:" /tmp/build.log | grep -oP '\d+ page' | grep -oP '\d+')
            PAGES_COPIED=$(grep "Copied" /tmp/build.log | grep -oP '\d+ clean' | grep -oP '\d+')
            echo "build_type=incremental" >> "$GITHUB_OUTPUT"
            echo "pages_rebuilt=${PAGES_REBUILT:-0}" >> "$GITHUB_OUTPUT"
            echo "pages_copied=${PAGES_COPIED:-0}" >> "$GITHUB_OUTPUT"
          else
            echo "build_type=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          SHORT_SHA="${PR_HEAD_SHA:0:8}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          pnpm exec wrangler deploy --dispatch-namespace preview-deployments --name "incr-${SHORT_SHA}"

      - name: Post preview URL on PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ steps.deploy.outputs.short_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_DURATION: ${{ steps.build.outputs.duration }}
          BUILD_TYPE: ${{ steps.build.outputs.build_type }}
          PAGES_REBUILT: ${{ steps.build.outputs.pages_rebuilt }}
          PAGES_COPIED: ${{ steps.build.outputs.pages_copied }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          PREVIEW_URL="https://incr-${SHORT_SHA}.preview.developers.cloudflare.com"

          if [ "$BUILD_TYPE" = "incremental" ]; then
            BUILD_INFO="Incremental — ${PAGES_REBUILT} page(s) rebuilt, ${PAGES_COPIED} copied from cache"
            BUILD_EMOJI="⚡"
          else
            BUILD_INFO="Full rebuild (no previous build cache or source files changed)"
            BUILD_EMOJI="🔨"
          fi

          BODY=$(cat <<EOF
          ### ${BUILD_EMOJI} Incremental Build Preview

          | | |
          |---|---|
          | **Preview** | ${PREVIEW_URL} |
          | **Build type** | ${BUILD_INFO} |
          | **Build time** | ${BUILD_DURATION} |
          | **Commit** | \`${SHORT_SHA}\` |
          EOF
          )

          # Check for existing incremental build comment
          EXISTING=$(gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("Incremental Build Preview"))) | .id' \
            | head -1)

          if [ -n "$EXISTING" ]; then
            gh api \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING}" \
              -X PATCH -f body="$BODY"
          else
            gh api \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$BODY"
          fi
